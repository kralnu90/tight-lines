<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1c19">
<meta name="description" content="Tight Lines: a survival fishing adventure prototype by Kralnu Games.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tight Lines">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Tight Lines</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Alegreya+Sans:wght@400;500;700;800&display=swap">
<style>
/* Layout: one-screen game. Conditions strip, river canvas, angler's control panel underneath. Single committed riverbank look. */
:root{
  --ink:#0e1c19;
  --panel:#15302a;
  --panel-2:#1d3d35;
  --rule:#2e5a4e;
  --cream:#f0e7d0;
  --muted:#a7bbad;
  --brass:#dcaa48;
  --brass-deep:#9c6d24;
  --danger:#e3593c;
  --safe:#86b56f;
  --slack:#6f8a84;
  --display:"Alegreya SC", Georgia, "Times New Roman", serif;
  --body:"Alegreya Sans", "Trebuchet MS", Verdana, sans-serif;
  color-scheme: dark;
}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;background:var(--ink);color:var(--cream);font-family:var(--body);font-size:15px;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:8px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:8px}
.top{display:flex;align-items:center;gap:10px}
.brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.02em;color:var(--brass);line-height:1}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.lvl{margin-left:auto;white-space:nowrap;text-align:right;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:0}
.lvl b{color:var(--cream);font-weight:700}
.xpbar{height:4px;background:var(--panel-2);border-radius:2px;margin-top:3px;overflow:hidden;width:110px;margin-left:auto}
.xpbar i{display:block;height:100%;background:var(--brass);width:0}
.iconbtn{background:var(--panel);color:var(--cream);border:1px solid var(--rule);border-radius:10px;height:36px;padding:0 12px;font:600 13px var(--body);cursor:pointer}
.iconbtn:focus-visible,.big:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.conds{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:6px;align-items:end}
.cond.info b{line-height:1.2;font-size:12px;padding:4px 6px}
.cond{display:flex;flex-direction:column;gap:2px;min-width:0}
.cond label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.cond select{width:100%;background:var(--panel);color:var(--cream);border:1px solid var(--rule);border-radius:8px;padding:6px 6px;font:600 13px var(--body)}
.cond select:disabled{opacity:.55}
.cond .lab{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.cond.info b{display:block;background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:6px;font:600 13px var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.needs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.need{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.need .nb{height:6px;border-radius:3px;background:var(--panel-2);overflow:hidden;margin-top:3px}
.need .nb i{display:block;height:100%;background:var(--safe);width:100%}
.need.low{color:#ffb8a8}.need.low .nb i{background:var(--danger)}
.need.mid .nb i{background:#c9a34a}
.acts{display:flex;flex-direction:column;gap:6px}
.act{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--panel-2);border:1px solid var(--rule);border-radius:10px;padding:10px 12px;color:var(--cream);font:600 15px var(--body);text-align:left;cursor:pointer;width:100%}
.act small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:2px}
.act em{font-style:normal;color:var(--brass);font-size:12px;white-space:nowrap}
.act:disabled{opacity:.45;cursor:default}
.slot{background:var(--panel-2);border:1px solid var(--rule);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.slot b{font-size:16px}.slot small{color:var(--muted)}
.slot .controls .big{padding:10px;font-size:14px}
.hc{color:#ffb8a8;font-weight:700}
.mem{border-left:3px solid var(--brass-deep);padding:6px 10px;background:var(--panel-2);border-radius:0 8px 8px 0}
.mem b{display:block}.mem small{color:var(--muted)}
input[type=text]{width:100%;background:var(--panel-2);color:var(--cream);border:1px solid var(--rule);border-radius:8px;padding:10px;font:600 15px var(--body)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mode{display:flex;flex-direction:column;justify-content:flex-start;background:var(--panel-2);border:1px solid var(--rule);border-radius:10px;padding:10px;color:var(--cream);text-align:left;font:600 15px var(--body);cursor:pointer}
.mode small{display:block;color:var(--muted);font-weight:400;font-size:12px;margin-top:3px}
.mode.on{border-color:var(--brass);box-shadow:inset 0 0 0 1px var(--brass)}
.mode.hard.on{border-color:var(--danger);box-shadow:inset 0 0 0 1px var(--danger)}
.stage{position:relative;flex:1;min-height:200px;border-radius:14px;overflow:hidden;border:1px solid var(--rule);background:#22413f}
canvas{display:block;width:100%;height:100%;touch-action:none}
.toast{position:absolute;left:50%;top:14%;transform:translate(-50%,0);background:rgba(14,28,25,.82);border:1px solid var(--brass-deep);
  color:var(--cream);padding:8px 14px;border-radius:10px;font:700 16px var(--body);text-align:center;max-width:86%;pointer-events:none;
  opacity:0;transition:opacity .25s}
.toast.on{opacity:1}
.toast.warn{border-color:var(--danger);color:#ffd9cf}
.panel{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px}
.hint{color:var(--muted);font-size:14px;line-height:1.35}
.hint b{color:var(--cream)}
.odds{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--panel-2);border-radius:999px;padding:3px 10px;font-size:12px;font-variant-numeric:tabular-nums;color:var(--cream)}
.chip em{font-style:normal;color:var(--muted)}
.meter{display:grid;grid-template-columns:64px 1fr 56px;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.meter span:last-child{text-align:right;color:var(--cream)}
.bar{position:relative;height:12px;border-radius:6px;background:var(--panel-2);overflow:hidden}
.bar.tension{background:linear-gradient(90deg,var(--slack) 0 10%,var(--safe) 10% 82%,#c9a34a 82% 90%,var(--danger) 90%)}
.bar .fill{position:absolute;inset:0 auto 0 0;background:var(--brass);width:0}
.bar .needle{position:absolute;top:-2px;bottom:-2px;width:4px;margin-left:-2px;background:var(--cream);border-radius:2px;box-shadow:0 0 0 2px var(--ink);left:0}
.controls{display:flex;gap:8px}
.big{flex:1;border:0;border-radius:12px;padding:14px 10px;font:800 18px var(--body);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;touch-action:none}
.big.reel{background:var(--brass);color:#2a1d07;flex:1.4}
.big.reel.on{background:#f2c463;box-shadow:inset 0 3px 0 rgba(0,0,0,.25)}
.big.net{background:var(--panel-2);color:var(--muted);border:1px solid var(--rule)}
.big.net.ready{background:var(--safe);color:#10230c;border-color:var(--safe)}
.big.strike{background:var(--brass);color:#2a1d07}
.big.ghost{background:var(--panel-2);color:var(--cream);border:1px solid var(--rule);flex:0 0 auto;padding:14px 16px}
.overlay{position:fixed;inset:0;z-index:20;background:rgba(9,18,16,.78);display:flex;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.card{background:var(--panel);border:1px solid var(--brass-deep);border-radius:14px;padding:16px;width:100%;max-width:420px;display:flex;flex-direction:column;gap:10px;max-height:100%;overflow:auto}
.card h2{margin:0;font-family:var(--display);font-size:26px;color:var(--brass);line-height:1.1;text-wrap:balance}
.card p{margin:0;color:var(--cream);line-height:1.4}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;font-variant-numeric:tabular-nums}
.stats div{background:var(--panel-2);border-radius:8px;padding:6px 8px}
.stats small{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.stats b{font-size:16px}
.stars{color:var(--brass);font-size:20px;letter-spacing:2px}
.stars i{font-style:normal;color:var(--rule)}
.tag{display:inline-block;align-self:flex-start;background:var(--brass);color:#2a1d07;border-radius:6px;padding:2px 8px;font-weight:800;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.log{display:flex;flex-direction:column;gap:6px}
.logrow{display:grid;grid-template-columns:1fr auto;gap:2px 8px;background:var(--panel-2);border-radius:8px;padding:8px 10px;font-variant-numeric:tabular-nums}
.logrow b{font-size:15px}
.logrow small{color:var(--muted);font-size:12px}
.logrow .stars{font-size:14px;text-align:right}
.pbs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.pbs div{background:var(--panel-2);border-radius:8px;padding:6px 8px;font-size:12px;color:var(--muted)}
.pbs b{display:block;color:var(--cream);font-size:14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.row label{color:var(--cream)}
input[type=range]{width:55%;accent-color:var(--brass)}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--brass)}
.note{font-size:12px;color:var(--muted);line-height:1.4}
.danger-btn{background:transparent;color:#ffb8a8;border:1px solid var(--danger);border-radius:10px;padding:8px 12px;font:700 13px var(--body);cursor:pointer}
h3{margin:4px 0 0;font:700 12px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
@media (max-height:640px){.brand{font-size:19px}.big{padding:11px 8px;font-size:16px}.panel{padding:8px;gap:6px}}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
.conds{grid-template-columns:1.1fr 1.2fr 0.8fr}
.status{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;align-items:baseline}
.status b{color:var(--cream);font-weight:700}
.cond select{padding:6px 4px;font-size:12px}
.title-card{text-align:center;gap:12px}
.title-card h1{margin:0;font-family:var(--display);font-weight:700;font-size:44px;line-height:1;color:var(--brass);letter-spacing:.02em}
.title-card .sub{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.title-card .rule{height:1px;background:linear-gradient(90deg,transparent,var(--brass-deep),transparent);margin:2px 0}
.menu{display:flex;flex-direction:column;gap:8px}
.menu button,.menu a{display:block;width:100%;padding:13px 12px;border-radius:12px;border:1px solid var(--rule);background:var(--panel-2);color:var(--cream);font:700 16px var(--body);letter-spacing:.04em;cursor:pointer;text-decoration:none;text-align:center}
.menu .primary{background:var(--brass);color:#2a1d07;border-color:var(--brass)}
.menu button:disabled{opacity:.4;cursor:default}
.menu small{display:block;font-weight:500;font-size:12px;letter-spacing:0;margin-top:2px;opacity:.8}
.howto p{font-size:14px}
.howto dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 10px;font-size:14px}
.howto dt{font-weight:700;color:var(--brass)}
.howto dd{margin:0;color:var(--cream)}
.top .iconbtn[hidden]{display:none}
.lbrow{display:grid;grid-template-columns:22px minmax(0,1fr) auto;grid-template-areas:"r w t" "r w s";gap:0 10px;align-items:center;background:var(--panel-2);border-radius:8px;padding:8px 10px;font-variant-numeric:tabular-nums}
.lbrow.me{box-shadow:inset 0 0 0 1px var(--brass)}
.lbrow .rank{grid-area:r;font:700 16px var(--display);color:var(--brass);text-align:center}
.lbrow .who{grid-area:w;min-width:0}.lbrow .who b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbrow small{display:block;color:var(--muted);font-size:12px}
.lbrow .wt{grid-area:t;text-align:right}.lbrow .stars{grid-area:s;font-size:13px;text-align:right}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="brand">Tight Lines<small id="who">Kralnu Games</small></div>
    <div class="lvl"><div>Fishing <b id="lvl">Lv 1</b> · <b id="bucks">0</b> FB</div><div id="xptext">0 / 50 XP</div><div class="xpbar"><i id="xpfill"></i></div></div>
    <button class="iconbtn" id="btnLog" type="button">Log</button>
    <button class="iconbtn" id="btnMenu" type="button">Menu</button>
  </header>

  <div class="status"><b id="cSpot">Willowmere River</b><span id="cDay">Spring · Day 1</span><span id="cTime">06:00 Dawn</span><span id="cWeather">Clear</span></div>
  <div class="conds">
    <div class="cond"><label for="selMethod">Method</label><select id="selMethod"></select></div>
    <div class="cond"><label for="selBait">Bait</label><select id="selBait"></select></div>
    <div class="cond"><label for="selLine">Line</label><select id="selLine"></select></div>
  </div>

  <div class="needs" id="needs" aria-label="Survival needs"></div>

  <div class="stage" id="stage">
    <canvas id="river" aria-label="Fishing scene. Drag down on the water to cast; during a fight drag left and right to move the rod."></canvas>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>

  <div class="panel" id="panel"></div>
</div>
<div class="overlay" id="overlay" hidden></div>

<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rand=(a,b)=>a+Math.random()*(b-a);
const lerp=(a,b,t)=>a+(b-a)*t;
const ALL=["Spring","Summer","Autumn","Winter"];

/* ---------- Data (matches Tight_Lines_Game_Data.xlsx) ---------- */
const RARITY={Common:100,Uncommon:30,Rare:8,"Very rare":2};
const SPOTS={
  river:{name:"Willowmere River",water:"River",travel:{tavern:60,lake:60,coast:120},snagSide:-1,snagName:"snags",snagLose:"Snagged in the tree roots",flow:1},
  lake:{name:"Willowmere Lake",water:"Lake",travel:{tavern:60,river:60,coast:150},snagSide:1,snagName:"weed",snagLose:"Lost in the weed bed",flow:0},
  coast:{name:"Saltmarsh Point",water:"Coast",travel:{tavern:120,river:120,lake:150},snagSide:-1,snagName:"rocks",snagLose:"Cut off on the rocks",flow:0,salt:true}
};
const METHODS={
  Float:{lvl:1,baits:["Maggots","Bread","Worm","Sweetcorn","Ragworm"]},
  Ledger:{lvl:5,baits:["Worm","Pellets","Boilies","Sweetcorn","Deadbait","Lugworm","Ragworm","Squid","Peeler crab"]},
  Spinning:{lvl:10,baits:["Spinner","Soft lure","Big lure","Feathers"]},
  Fly:{lvl:15,baits:["Dry fly","Nymph"]}
};
const F_=(o)=>Object.assign({jump:0,switchy:0.5,nibbles:[0,2],strikeWin:1,speed:1},o);
const FISH=[
  // River
  F_({id:"dace",name:"Dace",water:"River",rarity:"Common",seasons:ALL,times:["Day"],methods:["Float"],baits:["Maggots"],min:0.1,max:0.5,lenK:31,pull:0.55,stam:0.9,speed:1.15,switchy:0.75,strikeWin:0.7,nibbles:[1,3],fights:"Quick little darts, easy"}),
  F_({id:"chub",name:"Chub",water:"River",rarity:"Common",seasons:["Summer"],times:["Day","Dusk"],methods:["Float","Ledger"],baits:["Bread"],min:1,max:5,lenK:31,pull:0.88,stam:1.6,speed:0.95,switchy:0.3,dash:true,strikeWin:1.1,fights:"One hard dash for the snags, then tires"}),
  F_({id:"trout",name:"Brown trout",water:"River",rarity:"Uncommon",seasons:["Spring","Summer"],times:["Dawn","Dusk"],methods:["Spinning","Fly"],baits:["Spinner","Dry fly"],min:0.5,max:4,lenK:32,pull:0.82,stam:1.8,speed:1.25,jump:0.28,strikeWin:0.9,nibbles:[0,1],spooky:true,fights:"Darting runs and the odd jump"}),
  F_({id:"grayling",name:"Grayling",water:"River",rarity:"Uncommon",seasons:["Autumn","Winter"],times:["Day"],weather:["Clear"],methods:["Fly","Float"],baits:["Nymph","Worm"],min:0.5,max:2,lenK:33,pull:0.72,stam:1.2,switchy:0.85,twist:true,strikeWin:0.6,spooky:true,fights:"Twists and uses its big fin against the current"}),
  F_({id:"eel",name:"European eel",water:"River",rarity:"Uncommon",seasons:["Summer"],times:["Night"],methods:["Ledger"],baits:["Worm"],min:1,max:4,lenK:58,pull:0.75,stam:1.7,speed:0.6,switchy:0.6,roll:true,strikeWin:1.4,nibbles:[1,3],eelShape:true,fights:"Rolls and twists, tangles the line"}),
  F_({id:"barbel",name:"Barbel",water:"River",rarity:"Uncommon",seasons:["Summer","Autumn"],times:["Night"],weather:["Rain"],methods:["Ledger"],baits:["Pellets"],min:2,max:12,lenK:33,pull:1.0,stam:2.6,speed:0.8,switchy:0.25,stubborn:true,nibbles:[0,1],fights:"Powerful runs along the bottom, won't give up"}),
  F_({id:"salmon",name:"Atlantic salmon",water:"River",rarity:"Rare",seasons:["Autumn"],times:["Dawn","Day"],weather:["Rain"],methods:["Fly","Spinning"],baits:["Dry fly","Nymph","Spinner"],min:5,max:25,lenK:31,pull:1.05,stam:3.0,speed:1.3,switchy:0.35,jump:0.4,longRuns:true,strikeWin:0.9,nibbles:[0,1],fights:"Long runs and leaps; drop the rod tip"}),
  // Lake
  F_({id:"roach",name:"Roach",water:"Lake",rarity:"Common",seasons:ALL,times:["Day"],methods:["Float"],baits:["Maggots"],min:0.25,max:2,lenK:30,pull:0.5,stam:0.9,switchy:0.6,strikeWin:0.8,nibbles:[1,3],fights:"Light and easy, a starter fish"}),
  F_({id:"rudd",name:"Rudd",water:"Lake",rarity:"Common",seasons:["Summer"],times:["Day"],weather:["Clear"],methods:["Float"],baits:["Bread"],min:0.25,max:2,lenK:30,pull:0.55,stam:0.9,speed:1.1,switchy:0.7,strikeWin:0.8,fights:"Splashy near the top"}),
  F_({id:"perch",name:"Perch",water:"Lake",rarity:"Common",seasons:ALL,times:["Day","Dusk"],methods:["Float","Spinning"],baits:["Worm","Soft lure"],min:0.5,max:3,lenK:30,pull:0.65,stam:1.0,shaky:true,strikeWin:0.9,fights:"Short runs and head shakes"}),
  F_({id:"bream",name:"Bream",water:"Lake",rarity:"Common",seasons:["Summer"],times:["Dusk"],methods:["Ledger"],baits:["Sweetcorn"],min:2,max:10,lenK:30,pull:0.6,stam:1.4,speed:0.5,switchy:0.2,sluggish:true,strikeWin:1.3,nibbles:[1,2],fights:"Heavy and sluggish, like a wet sack"}),
  F_({id:"tench",name:"Tench",water:"Lake",rarity:"Uncommon",seasons:["Spring","Summer"],times:["Dawn"],methods:["Float","Ledger"],baits:["Sweetcorn","Worm"],min:2,max:8,lenK:30,pull:0.85,stam:1.9,speed:0.8,switchy:0.3,dash:true,strikeWin:1.2,fights:"Slow, strong runs into weed"}),

function levelInfo(xp){let L=1,acc=0;while(L<50&&xp>=acc+xpToNext(L)){acc+=xpToNext(L);L++;}return {L,into:xp-acc,need:L<50?xpToNext(L):0};}
function level(){return levelInfo(run?run.xp:0).L;}
function renderLevel(){const i=levelInfo(run?run.xp:0);$("#lvl").textContent="Lv "+i.L;
  $("#xptext").textContent=i.need?`${i.into} / ${i.need} XP`:"Max level";$("#xpfill").style.width=(i.need?i.into/i.need*100:100)+"%";}

/* ---------- Conditions & bite odds ---------- */
function tod(min){const h=min/60;return h>=5&&h<8?"Dawn":h>=8&&h<18?"Day":h>=18&&h<21?"Dusk":"Night";}
function spotKey(){return run&&SPOTS[run.loc]?run.loc:(run&&run.lastSpot)||"river";}
function spot(){return SPOTS[spotKey()];}
function conds(){const r=run||{day:1,min:6.5*60,weather:"Clear"};
  return {season:SEASONS[Math.floor((r.day-1)/10)%4],time:tod(r.min),weather:r.weather,method:$("#selMethod").value||"Float",bait:$("#selBait").value,line:$("#selLine").value,water:spot().water};}
function methodOk(m){return save.settings.unlockAll||level()>=METHODS[m].lvl;}
function fillMethods(){
  const sel=$("#selMethod"),cur=sel.value||"Float";
  sel.innerHTML=Object.keys(METHODS).map(m=>{const lock=!methodOk(m),coastFly=m==="Fly"&&spot().salt,noRod=m==="Fly"&&run&&!run.equip.fly;
    return `<option value="${m}" ${lock||coastFly||noRod?"disabled":""}>${m}${lock?` (Lv ${METHODS[m].lvl})`:coastFly?" (no)":noRod?" (rod)":""}</option>`;}).join("");
  const opt=[...sel.options].find(o=>o.value===cur&&!o.disabled)||[...sel.options].find(o=>!o.disabled);sel.value=opt.value;fillBaits();}
function have(b){if(!run)return 99;return LURES[b]!==undefined?(run.inv.lures[b]||0):(run.inv.bait[b]||0);}
function fillBaits(){const sel=$("#selBait"),cur=sel.value;const list=METHODS[$("#selMethod").value].baits;
  sel.innerHTML=list.map(b=>{const n=have(b);return `<option value="${b}" ${n?"":"disabled"}>${b}${run?` (${n})`:""}</option>`;}).join("");
  const ok=[...sel.options].find(o=>o.value===cur&&!o.disabled)||[...sel.options].find(o=>!o.disabled);if(ok)sel.value=ok.value;else sel.value=list[0];
  fillLines();}
function fillLines(){const sel=$("#selLine"),cur=sel.value||(run&&run.equip.line)||"Medium";
  const owned=Object.keys(LINES).filter(k=>!run||run.inv.lines[k]);
  sel.innerHTML=owned.map(k=>`<option value="${k}">${LINES[k].short}</option>`).join("");sel.value=owned.includes(cur)?cur:owned[0];if(run)run.equip.line=sel.value;}
function biteWeights(c,q){return FISH.filter(f=>f.water===c.water).map(f=>{let w=RARITY[f.rarity];
  w*=f.seasons.includes(c.season)?2:0.1;
  if(f.times.includes(c.time))w*=1.5;
  const mOk=f.methods.includes(c.method),bOk=f.baits.includes(c.bait);
  w*=mOk&&bOk?2:mOk?0.4:bOk?0.3:0.05;
  if(f.weather&&f.weather.includes(c.weather))w*=1.5;
  const L=LINES[c.line]||LINES.Medium;if(f.spooky&&L.shy)w*=L.shy;if(L.all)w*=L.all;
  if(f.rarity!=="Common")w*=diff().rare;
  if(q!==undefined&&f.rarity!=="Common")w*=1+0.5*q;
  return {f,w};});}
function pickFish(c,q){const ws=biteWeights(c,q);const tot=ws.reduce((a,b)=>a+b.w,0);let r=Math.random()*tot;
  for(const x of ws){if((r-=x.w)<=0)return x.f;}return ws[0].f;}

function geom(){return {waterTop:H*0.2,nearY:H*0.88};}
function buildScenery(){
  const g=geom(),pts=[],hills=[],reeds=[],streaks=[],pads=[];
  let y=g.waterTop-10;
  for(let x=-10;x<=W+10;x+=8){y=clamp(y+rand(-6,6),g.waterTop-H*0.12,g.waterTop-H*0.03);pts.push([x,y]);}
  for(let x=-10;x<=W+10;x+=10)hills.push([x,g.waterTop-H*0.05-Math.sin(x/W*Math.PI*1.3+0.4)*H*0.07-Math.sin(x*0.05)*3]);
  for(let i=0;i<Math.floor(W/7);i++)reeds.push([rand(0,W),rand(0,1),rand(8,18)]);
  for(let i=0;i<70;i++)streaks.push({x:rand(0,W),t:Math.random(),l:rand(10,34)});
  for(let i=0;i<16;i++)pads.push([W*rand(0.76,1.02),lerp(g.waterTop+H*0.08,g.waterTop+H*0.34,Math.random()),rand(5,10)]);
  scen={pts,hills,reeds,streaks,pads};
}
function resize(){const r=cv.getBoundingClientRect();DPR=Math.min(2,window.devicePixelRatio||1);
  W=Math.max(200,r.width);H=Math.max(200,r.height);cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);buildScenery();}
new ResizeObserver(resize).observe(cv);
const MAXD=40;
function toScreen(D,X){const g=geom();const t=clamp(D/MAXD,0,1);
  const y=lerp(g.nearY-20,g.waterTop+16,Math.pow(t,0.85));const spread=W*(0.44-0.18*t);
  return {x:W/2+X*spread,y,scale:1-0.55*t};}

function panelWaiting(){
  const m=G.float.method;
  if(m==="Spinning"){
    $("#panel").innerHTML=`<div class="hint">Keep the lure moving. <b>Hold to retrieve</b>; a fish can hit it any moment.</div>
    <div class="controls"><button class="big ghost" id="btnCut" type="button">Reel in</button><button class="big reel" id="btnReel" type="button">Hold to retrieve</button></div>`;
    bindReel();$("#btnCut").addEventListener("click",()=>toReady());return;}
  const txt={Float:"Watch the float. Little dips are <b>nibbles</b>; wait for it to <b>go under</b>, then strike.",
    Ledger:"Watch the rod tip. Small taps are <b>nibbles</b>; strike when it <b>pulls right round</b>.",
    Fly:"Watch your fly. Little rings are fish <b>nosing it</b>; strike the instant one <b>takes it</b>."}[m];
  $("#panel").innerHTML=`<div class="hint">${txt}</div><div class="controls"><button class="big strike" id="btnStrike" type="button">Strike</button></div>`;

}
function bindReel(){const rb=$("#btnReel");
  const down=e=>{e.preventDefault();G.reeling=true;rb.classList.add("on");try{rb.setPointerCapture(e.pointerId);}catch(_){}};
  const up=()=>{G.reeling=false;rb.classList.remove("on");};
  rb.addEventListener("pointerdown",down);rb.addEventListener("pointerup",up);rb.addEventListener("pointercancel",up);rb.addEventListener("lostpointercapture",up);}
function panelFight(){
  $("#panel").innerHTML=`
  <div class="meter"><span>Tension</span><div class="bar tension"><div class="needle" id="mT"></div></div><span id="mTv">0%</span></div>

  <div class="controls"><button class="big ghost" id="btnCut" type="button" aria-label="Cut the line">✂</button><button class="big net" id="btnNet" type="button">Net</button><button class="big reel" id="btnReel" type="button">Hold to reel</button></div>
  <div class="hint" style="font-size:12px">Drag left and right on the water to move the rod. Move <b>with</b> a run to ease tension, <b>against</b> it to tire the fish.</div>`;
  bindReel();
  $("#btnNet").addEventListener("pointerdown",e=>{e.preventDefault();tryNet();});
  $("#btnCut").addEventListener("click",()=>{if(G.state==="fight")toReady("Line cut. Recast when ready.");});
}

/* ---------- Fishing flow ---------- */
function toReady(msg,warn){
  hideOverlay();headerButtons(true);
  G.state="ready";G.fish=null;G.cast=null;G.float=null;G.reeling=false;G.R=0;G.aim=null;
  setCondsEnabled(true);fillMethods();panelReady();if(msg)toast(msg,warn,2200);
}
function rodFor(m){if(!run)return GEAR.willow;return GEAR[m==="Fly"?run.equip.fly:run.equip.rod]||GEAR.willow;}
function reelNow(){return run?GEAR[run.equip.reel]||GEAR.tin:GEAR.tin;}
function castRange(m){const b={Float:[6,24],Ledger:[10,28],Spinning:[8,26],Fly:[4,14]}[m];return [b[0],b[1]+rodFor(m).cast];}
function startCast(q,power,aim){
  const cb=conds().bait;
  if(run&&!have(cb)){toast(`You're out of ${cb.toLowerCase()}. Restock at the Willowmere Arms.`,true,2400);return;}
  if(run&&LURES[cb]===undefined){run.inv.bait[cb]--;}
  if(run){run.needs.stam=Math.max(0,run.needs.stam-1.5);if(run.needs.stam<20)power*=0.75;}
  const m=conds().method,[d0,dr]=castRange(m);const D=d0+power*dr;
  G.cast={q,D,aim,t:0,from:rodTip(),method:m};
  G.state="flight";setCondsEnabled(false);
  $("#panel").innerHTML=`<div class="hint">Casting…</div>`;
  const pct=Math.round(q*100);
  if(pct>=99)toast("PERFECT CAST · 100%",false,1800);
  else if(q<0.35)toast(`Messy cast · ${pct}%. The splash spooks the swim.`,true,2000);
  else toast(`Cast · ${pct}%`,false,1200);
}
function landFloat(){
  const c=G.cast;const s=toScreen(c.D,c.aim);
  G.ripples.push({x:s.x,y:s.y,r:2,a:0.9,sc:s.scale});
  const q=c.q;let wait=rand(2.5,7)*(1.35-0.6*q)*(q<0.35?1.5:1);
  if(c.method==="Spinning")wait=rand(1.5,6)*(1.25-0.5*q);
  const f=pickFish(conds(),q);
  const n=Math.floor(rand(f.nibbles[0],f.nibbles[1]+0.999));
  const nib=[];let t=wait;for(let i=0;i<n;i++){nib.push(t);t+=rand(0.7,1.5);}
  let win=f.strikeWin;if(c.method==="Ledger")win*=1.3;if(c.method==="Fly")win=Math.min(win,0.6);
  G.float={method:c.method,D:c.D,X:c.aim,t:0,nibbles:nib,take:t,fish:f,dip:0,under:false,win};G.lastNibble=-9;
  G.state="waiting";panelWaiting();
}
function strike(){
  if(G.state!=="waiting")return;const fl=G.float;
  if(fl.method==="Spinning")return;
  if(fl.under){if(fl.t-fl.take<=fl.win){hook(fl.fish);return;}}
  if(fl.t-G.lastNibble<0.5){toReady(fl.method==="Fly"?"Too early. It saw you and bolted.":"Struck too early. You spooked it.",true);return;}
  toReady("Nothing on. Recast.");
}
function hook(f){
  const r=Math.random();const w=f.min+(f.max-f.min)*Math.pow(r,2);const s=(w-f.min)/(f.max-f.min);
  const fl=G.float;const side=spot().snagSide;
  G.fish={f,w,s,D:fl.D,X:fl.X,S:1,T:0.3,dir:Math.random()<0.5?-1:1,mode:"rest",modeT:0.4,modePull:0.3,
    pullScale:f.pull*(0.75+0.5*s),stamPool:f.stam*(0.75+0.6*s)*diff().stam,snapT:0,slackT:0,tangle:0,air:0,t:0,with:0,ang:0,vx:0,vd:0};
  if(f.dash){Object.assign(G.fish,{mode:"dash",dir:side,modeT:2.1,modePull:1.25});}
  G.state="fight";G.float=null;G.R=0;G.reeling=false;panelFight();
  const p=toScreen(fl.D,fl.X);G.ripples.push({x:p.x,y:p.y,r:4,a:1,sc:1});
  toast(f.dash?`Fish on! It's heading for the ${spot().snagName}!`:fl.method==="Spinning"?"Whack! Fish on!":"Fish on!",f.dash,1500);
}
function nextMode(F){
  const f=F.f;
  if(f.jump&&Math.random()<f.jump*(0.4+F.S)){F.mode="jump";F.modeT=1.1;F.modePull=0.65;toast("It's jumping! Ease off!",true,1100);return;}
  if(f.twist&&Math.random()<0.35){F.mode="twist";F.modeT=rand(1,1.8);F.modePull=0.8;toast("It's turning side-on in the current!",true,1100);return;}
  if(f.roll&&Math.random()<0.35){F.mode="roll";F.modeT=rand(1.2,2);F.modePull=0.7;toast("It's rolling! Keep the line tight",true,1100);return;}
  if(f.surges&&Math.random()<0.25){F.mode="run";F.modeT=rand(0.5,0.9);F.modePull=1.3;toast("Sudden surge!",true,900);return;}
  if(f.shaky&&Math.random()<0.45){F.mode="shake";F.modeT=rand(0.6,1.2);F.modePull=0.75;return;}
  if(Math.random()<0.55*(0.35+0.65*F.S)){F.mode="run";F.modeT=f.dives?rand(0.4,0.9):rand(0.8,2.4);F.modePull=rand(0.7,1.05);
    if(Math.random()<f.switchy)F.dir=-F.dir;return;}
  if(Math.random()<0.35){F.mode="shake";F.modeT=rand(0.5,1);F.modePull=0.6;return;}
  F.mode="rest";F.modeT=rand(0.6,1.6);F.modePull=0.25;
}
function lose(msg){
  const f=G.fish&&G.fish.f;const lx=Math.max(1,Math.round(3*diff().xp));if(run)run.xp+=lx;renderLevel();
  const bt=conds().bait,lures=["Spinner","Soft lure","Big lure","Feathers","Dry fly","Nymph"];
  const gone=lures.includes(bt)&&/snap|Snag|spool|tangle|weed|rocks/i.test(msg);
  if(gone&&run)run.inv.lures[bt]=Math.max(0,(run.inv.lures[bt]||0)-1);
  const lure=gone?` Your ${bt.toLowerCase()} went with it${run?` (${run.inv.lures[bt]} left)`:""}.`:"";
  G.state="result";G.reeling=false;
  showOverlay(`<h2>${msg}</h2><p>${f?"You never got a proper look at it.":""}${lure}</p>
  <p class="note">+${lx} XP for the experience.</p>
  <div class="controls"><button class="big strike" id="again" type="button">Cast again</button></div>`);
  $("#again").addEventListener("click",()=>toReady());
}
function tryNet(){
  const F=G.fish;if(!F||G.state!=="fight")return;
  if(F.D>3.2){toast("Too far out to net.",true,900);return;}
  const p=clamp(1-F.S*1.7,0.05,0.97);
  if(Math.random()<p){landed();return;}
  if(F.S>0.45){lose("It thrashed free at the net");return;}
  F.D+=4;F.mode="run";F.modeT=1.6;F.modePull=1;F.dir=-F.dir;F.T=Math.min(1,F.T+0.25);

function landed(){

  const lbBest=lbOn()&&lb.share&&lbRecord(f,F.w,len,st);

  <div class="stats"><div><small>Weight</small><b>${lbOz(F.w)}</b></div><div><small>Length</small><b>${len} cm</b></div><div><small>XP</small><b>+${xp}</b></div></div>
  <p class="note">${f.fights}. ${c.method} with ${c.bait.toLowerCase()} at ${spot().name}, ${c.time.toLowerCase()}.${after>before?` <b style="color:var(--brass)">Fishing level ${after}!${unlocked.length?" "+unlocked.join(", ")+" unlocked.":""}</b>`:""} Added to your keep net.${lbBest?` <b style="color:var(--brass)">Your best ${f.name.toLowerCase()} yet, posted to the leaderboard.</b>`:""}</p>
  <div class="controls"><button class="big strike" id="again" type="button">Cast again</button></div>`);
  $("#again").addEventListener("click",()=>toReady());

/* ---------- Simulation ---------- */
let lastWarn=0;
function update(dt){
  G.t+=dt;
  if(run&&["ready","flight","waiting","fight"].includes(G.state)&&$("#overlay").hidden){
    advance(dt*TIME_RATE);if(checkDeath())return;
    if(G.state==="ready"&&condKey()!==oddsKey)panelReady();}
  if(G.t-hudT>0.25){hudT=G.t;renderHud();}
  const kx=(G.keys.right?1:0)-(G.keys.left?1:0);
  if(kx&&G.state==="fight")G.R=clamp(G.R+kx*dt*2.2,-1,1);
  G.ripples.forEach(r=>{r.r+=dt*28;r.a-=dt*0.7;});G.ripples=G.ripples.filter(r=>r.a>0);

  if(G.state==="flight"){G.cast.t+=dt/0.7;if(G.cast.t>=1)landFloat();return;}
  if(G.state==="waiting"){const fl=G.float;
    if(fl.method==="Spinning"){
      if(G.reeling){fl.t+=dt;fl.D-=1.6*dt*(run&&run.needs.stam<20?0.7:1);}
      while(fl.nibbles.length&&fl.t>=fl.nibbles[0]){fl.nibbles.shift();fl.dip=1;const s=toScreen(fl.D,fl.X);G.ripples.push({x:s.x,y:s.y,r:1,a:0.5,sc:s.scale});toast("Something's following it…",false,900);}
      fl.dip=Math.max(0,fl.dip-dt*3);
      if(fl.t>=fl.take){hook(fl.fish);return;}
      if(fl.D<2.5)toReady("Nothing followed it in. Recast.");
      return;}
    fl.t+=dt;fl.dip=Math.max(0,fl.dip-dt*3);
    if(fl.method==="Fly"&&spot().flow){fl.X+=0.05*dt;if(fl.X>0.95){toReady("Your fly drifted out of the swim. Recast.");return;}}
    while(fl.nibbles.length&&fl.t>=fl.nibbles[0]){fl.nibbles.shift();fl.dip=1;G.lastNibble=fl.t;
      const s=toScreen(fl.D,fl.X);G.ripples.push({x:s.x,y:s.y,r:1,a:0.5,sc:s.scale});}
    if(!fl.under&&fl.t>=fl.take){fl.under=true;const s=toScreen(fl.D,fl.X);G.ripples.push({x:s.x,y:s.y,r:2,a:1,sc:s.scale});
      if(fl.method==="Fly")G.ripples.push({x:s.x,y:s.y,r:5,a:1,sc:s.scale});}
    if(fl.under&&fl.t-fl.take>fl.win)toReady(fl.method==="Fly"?"Too slow. It spat the fly.":"Too slow. It stole your bait.",true);
    return;}
  if(G.state!=="fight")return;

  const F=G.fish,f=F.f;F.t+=dt;const side=spot().snagSide;
  F.modeT-=dt;if(F.modeT<=0){if(F.mode==="dash")toast("It's tiring",false,900);nextMode(F);}
  let modePull=F.modePull;
  if(F.mode==="shake"){modePull*=0.6+0.4*Math.abs(Math.sin(F.t*22));if(Math.random()<dt*3)F.dir=-F.dir;}
  if(F.mode==="twist"){if(Math.random()<dt*4)F.dir=-F.dir;if(F.dir>0)modePull+=0.25;}
  if(f.waves)modePull+=0.2*Math.max(0,Math.sin(F.t*1.6));
  if(F.mode==="roll"){if(Math.random()<dt*5)F.dir=-F.dir;F.tangle+=dt*(F.T<0.4?0.75:-0.25);}else F.tangle=Math.max(0,F.tangle-dt*0.3);
  if(F.tangle>1){lose("It rolled and tangled your line");return;}
  if(F.tangle>0.6&&G.t-lastWarn>1.2){toast("Line's tangling! More tension",true,900);lastWarn=G.t;}
  const P=modePull*F.pullScale*(0.35+0.65*F.S)*(F.S<=0.01&&F.D<3.2?0.2:1);
  const w=clamp(G.R*F.dir,-1,1);F.with=w;
  F.air=0;if(F.mode==="jump"){const k=1-F.modeT/1.1;if(k>0.25&&k<0.8)F.air=Math.sin((k-0.25)/0.55*Math.PI);}
  let lat=F.dir*0.45*f.speed*F.modePull*(0.4+0.6*F.S)*(1+0.75*Math.min(w,0));
  if(F.mode==="rest")lat*=0.3;if(f.sluggish)lat*=0.5;
  F.X+=lat*dt;
  if(F.mode==="dash"){if(w<-0.35)F.modeT-=dt*1.4;if(F.X*side>0.9&&F.t>0.6){lose(spot().snagLose);return;}}
  if(F.X>1){F.X=1;F.dir=-1;}if(F.X<-1){F.X=-1;F.dir=1;}
  let pullT=P*0.92*(1-0.37*Math.max(w,0))*(1+0.42*Math.max(-w,0));
  if(F.air>0.05)pullT+=G.reeling?0.95*F.air:-0.2;
  const RD=rodFor(conds().method),RL=reelNow();
  const target=(pullT+(G.reeling?0.5:0))*(LINES[conds().line]||LINES.Medium).k*RD.tm*diff().tension*save.settings.strict;
  const dragLim=RL.drag;
  const capped=target>dragLim?dragLim+(target-dragLim)*0.54:target;
  F.T+=(Math.max(0,capped)-F.T)*Math.min(1,dt*9);
  let runOut=P*2.4*(0.4+0.6*F.S)*(F.mode==="rest"?0.2:1)*(f.longRuns&&F.mode==="run"?1.6:1);
  if(f.sluggish)runOut*=0.5;if(f.deep&&F.D<12)runOut*=1.5;
  const reelIn=G.reeling?RL.speed*(1-Math.min(1,P)*0.55)*(run&&run.needs.stam<20?0.65:1):0;
  if(run)run.needs.stam=Math.max(0,run.needs.stam-dt*(G.reeling?0.1:0.05));
  const dragOut=target>dragLim?(target-dragLim)*3:0;
  const prevD=F.D;F.D=clamp(F.D+(runOut*0.5+dragOut-reelIn)*dt,0.6,RL.cap+2);F.vd=(F.D-prevD)/dt;F.vx=lat;
  if(F.D>=RL.cap){lose("Spooled. It ran off all your line");return;}
  const drain=(0.018+F.T*0.07+Math.max(-w,0)*P*0.09+(G.reeling?0.01:0))/F.stamPool;
  F.S=clamp(F.S-drain*dt+(F.T<0.15?0.01*dt:0)+(f.stubborn&&F.mode==="rest"&&F.S>0.08?0.035*dt:0),0,1);
  if(F.T>1){F.snapT+=dt;if(F.snapT>0.24){lose("Snap! The line broke");return;}}else F.snapT=Math.max(0,F.snapT-dt*1.5);
  if(F.air>0.5&&G.reeling&&Math.random()<dt*0.9){lose("It threw the hook mid-jump");return;}
  if(F.T<0.14&&F.D>1.2){F.slackT+=dt;if(F.slackT>1.6){lose("Too much slack. The hook slipped out");return;}}else F.slackT=Math.max(0,F.slackT-dt);
  if(Math.random()<dt*0.8&&F.mode!=="rest"){const s=toScreen(F.D,F.X);G.ripples.push({x:s.x,y:s.y,r:2,a:0.5,sc:s.scale});}
  updateMeters();
}
function updateMeters(){
  const F=G.fish;if(!F)return;const mT=$("#mT");if(!mT)return;
  mT.style.left=clamp(F.T,0,1.1)/1.1*100+"%";$("#mTv").textContent=Math.round(F.T*100)+"%";
  $("#mS").style.width=F.S*100+"%";$("#mSv").textContent=Math.round(F.S*100)+"%";
  $("#mD").style.width=clamp(F.D/reelNow().cap,0,1)*100+"%";$("#mDv").textContent=F.D.toFixed(1)+" m";
  const net=$("#btnNet");const ready=F.D<=3.2;net.classList.toggle("ready",ready&&F.S<0.3);
  net.textContent=ready?(F.S<0.3?"Net it!":"Net (lively)"):"Net";
  if(G.t-lastWarn>1.2){
    if(F.T>0.9){toast("Line's about to go! Ease off",true,900);lastWarn=G.t;}
    else if(F.slackT>1.1){toast("Slack line! Keep some pressure on",true,900);lastWarn=G.t;}}
}

/* ---------- Drawing ---------- */
function draw(){
  const g=geom(),c=conds(),pal=PALETTES[c.time],sk=spotKey();
  let gr=ctx.createLinearGradient(0,0,0,g.waterTop);gr.addColorStop(0,pal.sky[0]);gr.addColorStop(1,pal.sky[1]);
  ctx.fillStyle=gr;ctx.fillRect(0,0,W,g.waterTop+2);
  if(c.time==="Dusk"){ctx.fillStyle="rgba(255,190,120,.85)";ctx.beginPath();ctx.arc(W*0.78,g.waterTop-H*0.04,H*0.035,0,Math.PI*2);ctx.fill();}
  if(c.time==="Night"){ctx.fillStyle="rgba(240,240,225,.9)";ctx.beginPath();ctx.arc(W*0.7,g.waterTop-H*0.09,H*0.025,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="rgba(255,255,255,.7)";for(let i=0;i<24;i++)ctx.fillRect((i*97.3)%W,(i*37)%(g.waterTop*0.8),1.2,1.2);}
  if(c.time==="Dawn"){ctx.fillStyle="rgba(255,236,210,.8)";ctx.beginPath();ctx.arc(W*0.2,g.waterTop-H*0.02,H*0.03,0,Math.PI*2);ctx.fill();}
  if(c.weather!=="Clear"){ctx.fillStyle=c.weather==="Rain"?"rgba(70,80,90,.45)":"rgba(120,125,130,.35)";ctx.fillRect(0,0,W,g.waterTop+2);}
  // far shore
  if(sk==="coast"){ctx.fillStyle=pal.far;ctx.beginPath();ctx.moveTo(W*0.62,g.waterTop+2);ctx.quadraticCurveTo(W*0.8,g.waterTop-H*0.05,W+10,g.waterTop-H*0.03);ctx.lineTo(W+10,g.waterTop+2);ctx.closePath();ctx.fill();}
  else if(sk==="lake"){ctx.fillStyle=pal.far;ctx.beginPath();ctx.moveTo(-10,g.waterTop+4);for(const p of scen.hills)ctx.lineTo(p[0],p[1]);ctx.lineTo(W+10,g.waterTop+4);ctx.closePath();ctx.fill();
    ctx.fillStyle=pal.trees;ctx.beginPath();ctx.moveTo(-10,g.waterTop+4);for(const p of scen.pts)ctx.lineTo(p[0],g.waterTop-(g.waterTop-p[1])*0.45);ctx.lineTo(W+10,g.waterTop+4);ctx.closePath();ctx.fill();}
  else{ctx.fillStyle=pal.trees;ctx.beginPath();ctx.moveTo(-10,g.waterTop+4);for(const p of scen.pts)ctx.lineTo(p[0],p[1]);ctx.lineTo(W+10,g.waterTop+4);ctx.closePath();ctx.fill();
    ctx.fillStyle=pal.far;ctx.fillRect(0,g.waterTop-4,W,8);}
  // water
  const wc=sk==="coast"?pal.sea:pal.water;
  gr=ctx.createLinearGradient(0,g.waterTop,0,g.nearY);gr.addColorStop(0,wc[0]);gr.addColorStop(1,wc[1]);
  ctx.fillStyle=gr;ctx.fillRect(0,g.waterTop+2,W,g.nearY-g.waterTop);
  ctx.strokeStyle=pal.streak;ctx.lineWidth=1.2;
  if(sk==="river"){
    for(const s of scen.streaks){const y=lerp(g.waterTop+10,g.nearY-8,((s.x*7.3)%1+1)%1);
      const depth=(y-g.waterTop)/(g.nearY-g.waterTop);const x=((s.x+G.t*(14+40*depth))%(W+60))-30;
      ctx.globalAlpha=0.4+0.6*depth;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+s.l*(0.5+depth),y);ctx.stroke();}
  }else if(sk==="lake"){
    for(const s of scen.streaks){const y=lerp(g.waterTop+10,g.nearY-8,((s.x*7.3)%1+1)%1);const depth=(y-g.waterTop)/(g.nearY-g.waterTop);
      const x=s.x+Math.sin(G.t*0.3+s.l)*6;ctx.globalAlpha=(0.25+0.4*depth)*(0.5+0.5*Math.sin(G.t*0.8+s.x));ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+s.l*0.6*(0.5+depth),y);ctx.stroke();}
  }else{
    for(let i=0;i<14;i++){const k=((G.t*0.06+i/14)%1);const y=lerp(g.waterTop+6,g.nearY-6,Math.pow(k,1.6));const depth=k;
      ctx.globalAlpha=0.2+0.5*depth;ctx.lineWidth=1+depth*1.5;ctx.beginPath();
      for(let x=0;x<=W;x+=16){const yy=y+Math.sin(x*0.03+i*1.7+G.t*0.8)*(2+depth*3);if(x===0)ctx.moveTo(x,yy);else ctx.lineTo(x,yy);}ctx.stroke();}
    ctx.lineWidth=1.2;
  }
  ctx.globalAlpha=1;
  drawSnag(g,pal,sk);
  if(c.weather==="Rain"){ctx.strokeStyle="rgba(210,225,235,.35)";ctx.lineWidth=1;ctx.beginPath();
    for(let i=0;i<90;i++){const x=((i*71.7+G.t*60)%(W+40))-20,y=((i*131.3+G.t*420)%(H+40))-20;ctx.moveTo(x,y);ctx.lineTo(x-3,y+12);}ctx.stroke();}
  if(pal.mist>0){gr=ctx.createLinearGradient(0,g.waterTop-10,0,g.waterTop+H*0.18);gr.addColorStop(0,`rgba(255,250,245,${pal.mist})`);gr.addColorStop(1,"rgba(255,250,245,0)");ctx.fillStyle=gr;ctx.fillRect(0,g.waterTop-10,W,H*0.2);}

function advance(mins,opt){
  if(!run||mins<=0)return;opt=opt||{};
  while(mins>0){const m=Math.min(mins,10);mins-=m;const h=m/60;const N=run.needs;
    run.min+=m;if(run.min>=1440){run.min-=1440;run.day++;if((run.day-1)%10===0)toast(`A new season: ${conds().season}`,false,2200);}
    run.weatherIn-=m;if(run.weatherIn<=0){run.weather=pickWeather(conds().season);run.weatherIn=rand(180,480);}
    run.away+=m;
    const NM=diff().needs;
    if(NM===0){Object.assign(N,{food:100,warm:100,stam:100,health:100,thirst:100});run.water=maxWater();run.ill=0;
      if(run.fire>0)run.fire=Math.max(0,run.fire-m);for(const id in run.market){run.market[id]=Math.max(0,run.market[id]-m/720);}continue;}
    const c=conds();
    let dw={Dawn:-2,Day:4,Dusk:-2,Night:-7}[c.time];
    if(c.weather==="Rain")dw-=5;else if(c.weather==="Overcast")dw-=1;
    dw+={Spring:-1,Summer:2,Autumn:-1,Winter:-4}[c.season];
    if(run.loc==="coast")dw-=1;
    if(run.fire>0){dw+=18;run.fire=Math.max(0,run.fire-m);}
    if(dw<0){dw*=NM;if(run.inv.gear.jacket)dw*=0.7;if(opt.sleep&&run.inv.gear.bedroll)dw*=0.55;}
    N.warm=clamp(N.warm+dw*h,0,100);
    for(const id in run.market){run.market[id]=Math.max(0,run.market[id]-m/720);}
    N.food=clamp(N.food-(opt.sleep?2.8:4.5)*NM*(run.ill>0?1.3:1)*h,0,100);
    if(opt.sleep)N.stam=clamp(N.stam+13*h,0,100);
    else if(opt.rest)N.stam=clamp(N.stam+15*h,0,100);
    else N.stam=clamp(N.stam-(N.food<25?3:1.2)*NM*h,0,100);
    run.water=Math.max(0,run.water-m/1440*NM);
    if(run.water<=0)N.thirst=clamp(N.thirst-6*NM*h,0,100);
    if(run.ill>0)run.ill=Math.max(0,run.ill-m);
    let dmg=0;if(N.food<=0)dmg+=6;if(N.warm<=0)dmg+=8;if(N.thirst<=0)dmg+=8;if(run.ill>0)dmg+=2;
    if(dmg)N.health=clamp(N.health-dmg*h,0,100);
    else if(N.food>40&&N.warm>40&&N.thirst>40)N.health=clamp(N.health+1.5*h,0,100);
    if(N.health<=0){run.cause=N.warm<=0?"the cold":N.thirst<=0?"thirst":N.food<=0?"hunger":"illness";break;}
  }
}
function checkDeath(){if(run&&run.needs.health<=0&&G.state!=="dead"){die();return true;}return false;}

let warnT=0;
function renderHud(){
  const c=conds();
  $("#cSpot").textContent=run&&run.loc==="tavern"?"The Willowmere Arms":spot().name;
  $("#cDay").textContent=`${c.season} · Day ${run?((run.day-1)%10)+1:1}`;
  $("#cTime").textContent=`${clock(run?run.min:390)} ${c.time}`;
  $("#cWeather").textContent=c.weather;
  $("#bucks").textContent=run?run.bucks:0;
  $("#who").textContent=run?`${run.name} · ${diff().name}${run.hardcore?" · Hardcore":""}`:"Kralnu Games";
  if(!run){$("#needs").innerHTML="";return;}
  if(diff().needs===0){$("#needs").innerHTML='<div class="need" style="grid-column:1/-1">Easy mode · needs are off. Just fish.</div>';return;}
  const N=run.needs;
  const items=[["Food",N.food],["Warmth",N.warm],["Energy",N.stam],["Health",N.health],[run.water>0?"Water":"Thirst",run.water>0?run.water/maxWater()*100:N.thirst]];
  $("#needs").innerHTML=items.map(([n,v])=>`<div class="need ${v<25?"low":v<50?"mid":""}">${n}${n==="Health"&&run.ill>0?" · ill":""}<div class="nb"><i style="width:${clamp(v,0,100)}%"></i></div></div>`).join("");
  if(["ready","waiting"].includes(G.state)&&G.t-warnT>20){
    const w=N.health<30?"You're in a bad way. Head back to the tavern.":N.warm<25?"You're shivering. Light a fire at camp.":N.food<20?"You're starving. Eat something.":run.water<=0&&N.thirst<40?"You need water.":N.stam<20?"You're exhausted. Rest at camp.":"";
    if(w){toast(w,true,2600);warnT=G.t;}}
}

/* ---------- Camp ---------- */
function fishAge(k){return (absMin()-k.caught)/1440;}
function travelTo(dest){
  const from=run.loc,mins=(SPOTS[from]&&SPOTS[from].travel[dest])||(SPOTS[dest]?SPOTS[dest].travel.tavern:60);
  advance(mins);run.fire=0;renderHud();if(checkDeath())return;
  if(dest==="tavern"){goTavern();return;}
  run.loc=dest;run.lastSpot=dest;hideOverlay();toReady(`${SPOTS[dest].name}. Tight lines.`);
}
function travelButtons(prefix){
  const here=run.loc,opts=[];
  if(here!=="tavern")opts.push(["tavern","Walk back to the Willowmere Arms","Bed, a hot meal and a save."]);
  for(const k of Object.keys(SPOTS))if(k!==here)opts.push([k,`${here==="tavern"?"Head to":"Move on to"} ${SPOTS[k].name}`,{river:"Willows, snags and running water.",lake:"Still water, weed beds and big fish.",coast:"Surf, rocks and sea fish. Salt water only."}[k]]);
  return opts.map(([k,t,d])=>{const mins=here==="tavern"?SPOTS[k].travel.tavern:(SPOTS[here].travel[k]);
    return `<button class="act" data-${prefix}="${k}" type="button"><span>${t}<small>${d}</small></span><em>${mins>=60?(mins/60)+" h":mins+" min"}</em></button>`;}).join("");
}
function campMenu(){
  if(G.state!=="ready")return;
  const N=run.needs,fire=run.fire>0,night=run.min>=18*60||run.min<5*60,salt=spot().salt,wname=spot().water.toLowerCase();
  const fishRows=run.keep.map((k,i)=>{const age=fishAge(k),spoiled=age>3;
    return `<div class="act" style="cursor:default"><span>${k.name} · ${lbOz(k.w)}<small>${spoiled?"Spoiled. Only good for chum.":`Fresh for ${Math.max(0,(3-age)).toFixed(1)} more days`}</small></span>
    <span style="display:flex;gap:6px">${spoiled?`<button class="iconbtn" data-dump="${i}" type="button">Throw away</button>`:
    `<button class="iconbtn" data-raw="${i}" type="button">Eat raw</button><button class="iconbtn" data-cook="${i}" type="button" ${fire?"":"disabled"}>Cook</button>`}</span></div>`;}).join("");
  showOverlay(`<h2>Camp</h2>
  <p class="note">${spot().name} · ${clock(run.min)}, ${conds().time.toLowerCase()} · ${conds().weather.toLowerCase()}. ${fire?`Fire burning for ${Math.ceil(run.fire/60)} more hours.`:"No fire."} Camping never saves your game.</p>
  <div class="acts">
    <button class="act" id="aFire" type="button"><span>${fire?"Add wood":"Light a campfire"}<small>Warms you and lets you cook and boil water. Burns about 3 hours.</small></span><em>30 min</em></button>
    <button class="act" id="aRest" type="button"><span>Rest a while<small>Get your energy back.</small></span><em>1 hour</em></button>
    <button class="act" id="aSleep" type="button" ${night?"":"disabled"}><span>Sleep until dawn<small>${night?(fire?"The fire will keep you warm for a while.":"No fire. It will be a cold night."):"Only after dusk."}</small></span><em>to 06:00</em></button>
    ${salt?`<div class="act" style="cursor:default"><span>No fresh water here<small>Sea water is salt. You can't drink it. ${run.water>0?`You carry ${run.water.toFixed(1)} days of water.`:"Head inland to a river or lake."}</small></span></div>`:`
    <button class="act" id="aBoil" type="button" ${fire?"":"disabled"}><span>Boil ${wname} water and drink<small>${fire?"Safe to drink.":"Needs a fire."} ${run.water>0?`You still carry ${run.water.toFixed(1)} days of water.`:""}</small></span><em>30 min</em></button>
    <button class="act" id="aDrink" type="button"><span>Drink straight from the ${wname}<small>Quick, but it could make you ill.</small></span><em>5 min</em></button>`}
  </div>
  <h3>Keep net</h3><div class="acts">${fishRows||'<p class="note">Empty. Catch something to eat.</p>'}</div>
  <h3>Travel</h3><div class="acts">${travelButtons("go")}</div>
  <div class="controls"><button class="big ghost" id="closeO" type="button" style="flex:1">Back to fishing</button></div>`);
  const act=(mins,fn,opt)=>{advance(mins,opt);if(fn)fn();renderHud();if(checkDeath())return;campMenu();};
  $("#aFire").onclick=()=>act(30,()=>{run.fire=Math.min(run.fire+180,480);toast(fire?"You stack on more wood.":"The fire crackles into life.");});
  $("#aRest").onclick=()=>act(60,null,{rest:true});
  $("#aSleep").onclick=()=>{let m=run.min>=18*60?(1440-run.min)+360:360-run.min;advance(m,{sleep:true});renderHud();if(checkDeath())return;
    toast(run.needs.warm<30?"You wake up frozen and stiff.":"You wake at first light, rested.",run.needs.warm<30,2400);campMenu();};
  if($("#aBoil"))$("#aBoil").onclick=()=>act(30,()=>{run.needs.thirst=100;toast("Boiled and safe.");});
  if($("#aDrink"))$("#aDrink").onclick=()=>act(5,()=>{run.needs.thirst=100;if(Math.random()<0.35){run.ill=Math.max(run.ill,12*60);toast("That water was bad. You feel ill.",true,2400);}else toast("Cold and clear. You got away with it.");});
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>travelTo(b.dataset.go));
  document.querySelectorAll("[data-raw]").forEach(b=>b.onclick=()=>{const k=run.keep.splice(+b.dataset.raw,1)[0];
    act(10,()=>{run.needs.food=clamp(run.needs.food+6+k.w*4,0,100);if(Math.random()<0.15){run.ill=Math.max(run.ill,8*60);toast("Raw fish didn't agree with you.",true,2200);}else toast(`You eat the ${k.name.toLowerCase()} raw.`);});});
  document.querySelectorAll("[data-cook]").forEach(b=>b.onclick=()=>{const k=run.keep.splice(+b.dataset.cook,1)[0];
    act(30,()=>{run.needs.food=clamp(run.needs.food+12+k.w*8,0,100);run.needs.stam=clamp(run.needs.stam+8,0,100);toast(`Campfire ${k.name.toLowerCase()}. Proper food.`);});});
  document.querySelectorAll("[data-dump]").forEach(b=>b.onclick=()=>{run.keep.splice(+b.dataset.dump,1);campMenu();});
  $("#closeO").onclick=()=>{hideOverlay();panelReady();};
}

/* ---------- Economy: Fish Bucks, selling, shop, kit ---------- */
const ROOM=6,MEAL=3;
function withKit(r){
  if(r.bucks===undefined)r.bucks=25;
  if(!r.inv)r.inv={gear:{willow:1,tin:1},bait:{Maggots:20,Bread:10,Worm:10},lures:{Spinner:1},lines:{Medium:1}};
  if(!r.equip)r.equip={rod:"willow",fly:null,reel:"tin",line:"Medium"};
  if(!r.market)r.market={};
  if(!r.diff)r.diff="medium";
  if(!r.shop)r.shop={day:0,stock:[]};
  return r;}
function maxWater(){return 3+(run&&run.inv.gear.waterskin?1.5:0);}
function fishPrice(k){
  const f=FISH.find(x=>x.id===k.id);const b={Common:[4,1.5],Uncommon:[12,2],Rare:[30,3],"Very rare":[60,4]}[f.rarity];
  const age=fishAge(k),fr=age<1?1:age<2?0.8:age<3?0.55:0;
  const reg={Lake:1.3,River:0.8,Coast:1}[f.water]||1;
  const sat=1/(1+0.15*(run.market[k.id]||0));
  const p=(b[0]+b[1]*k.w)*[0,0.8,0.9,1,1.15,1.35][k.stars||3]*fr*reg*sat;
  return {p:Math.max(0,Math.round(p)),fr,reg,sat,water:f.water};}
function sellScreen(){
  const rows=run.keep.map((k,i)=>{const q=fishPrice(k);const tags=[];
    tags.push(q.fr===0?"spoiled":q.fr<1?(q.fr>0.6?"day-old":"stale"):"fresh");
    if(q.reg>1)tags.push("lake fish +30%");else if(q.reg<1)tags.push("river fish −20%");
    if(q.sat<0.95)tags.push(`market −${Math.round((1-q.sat)*100)}%`);
    return `<div class="act" style="cursor:default"><span>${k.name} · ${lbOz(k.w)} <span class="stars" style="font-size:12px">${stars(k.stars||3)}</span><small>${tags.join(" · ")}</small></span>
    ${q.p>0?`<button class="iconbtn" data-sell="${i}" type="button">Sell ${q.p} FB</button>`:`<button class="iconbtn" data-dump="${i}" type="button">Bin it</button>`}</div>`;}).join("");
  const total=run.keep.reduce((a,k)=>a+fishPrice(k).p,0);
  showOverlay(`<h2>Sell your catch</h2><p class="note">The landlord buys for the kitchen and the market. Willowmere is a riverside village: lake fish fetch more, river fish less. Flood him with one kind and the price drops for a while.</p>
  <p class="note"><b style="color:var(--brass)">${run.bucks} Fish Bucks</b></p>
  <div class="acts">${rows||'<p class="note">Nothing to sell. Go and catch something.</p>'}</div>
  <div class="controls"><button class="big ghost" id="sBackT" type="button" style="flex:1">Back</button>${total?`<button class="big strike" id="sAll" type="button">Sell all</button>`:""}</div>`);
  const sell=i=>{const k=run.keep[i];const q=fishPrice(k);run.bucks+=q.p;run.market[k.id]=(run.market[k.id]||0)+1;run.keep.splice(i,1);return q.p;};
  document.querySelectorAll("[data-sell]").forEach(b=>b.onclick=()=>{const p=sell(+b.dataset.sell);toast(`+${p} Fish Bucks`);renderHud();sellScreen();});
  document.querySelectorAll("[data-dump]").forEach(b=>b.onclick=()=>{run.keep.splice(+b.dataset.dump,1);sellScreen();});
  if($("#sAll"))$("#sAll").onclick=()=>{let got=0;for(let i=run.keep.length-1;i>=0;i--){if(fishPrice(run.keep[i]).p>0)got+=sell(i);}toast(`+${got} Fish Bucks`);renderHud();sellScreen();};
  $("#sBackT").onclick=tavernMenu;
}
function shopStock(){
  if(run.shop.day!==run.day){
    const pool=Object.keys(GEAR).filter(id=>GEAR[id].price>0&&id!=="hazelfly");
    for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
    run.shop={day:run.day,stock:pool.slice(0,4)};}
  return ["hazelfly",...run.shop.stock].filter((id,i,a)=>a.indexOf(id)===i);
}
function shopScreen(tab){
  const B=run.bucks,tabs=[["bait","Bait"],["lures","Lures"],["lines","Line"],["gear","Gear"]];
  let body="";
  if(tab==="bait")body=Object.entries(BAITS).map(([b,[p,n]])=>`<div class="act" style="cursor:default"><span>${b} · ×${n}<small>You have ${run.inv.bait[b]||0}</small></span><button class="iconbtn" data-bb="${b}" type="button" ${B>=p?"":"disabled"}>${p} FB</button></div>`).join("");
  if(tab==="lures")body=Object.entries(LURES).map(([l,p])=>`<div class="act" style="cursor:default"><span>${l}<small>Lost if the line breaks or snags. You have ${run.inv.lures[l]||0}</small></span><button class="iconbtn" data-bl="${l}" type="button" ${B>=p?"":"disabled"}>${p} FB</button></div>`).join("");
  if(tab==="lines")body=Object.entries(LINES).filter(([k,L])=>L.price>0).map(([k,L])=>`<div class="act" style="cursor:default"><span>${L.name}<small>${k==="Light"?"Breaks easily, but shy fish don't mind it.":L.all?"Very strong. Most fish are wary of it.":"Stronger. Shy fish notice it."}</small></span>${run.inv.lines[k]?'<em>Owned</em>':`<button class="iconbtn" data-bn="${k}" type="button" ${B>=L.price?"":"disabled"}>${L.price} FB</button>`}</div>`).join("");
  if(tab==="gear")body=`<p class="note">Today's gear. The stock changes every day.</p>`+shopStock().map(id=>{const g=GEAR[id];
    return `<div class="act" style="cursor:default"><span>${g.name} <small style="display:inline;color:${GRADES[g.grade]}">${g.grade}</small><small>${g.desc}${gearStats(g)}</small></span>${run.inv.gear[id]?'<em>Owned</em>':`<button class="iconbtn" data-bg="${id}" type="button" ${B>=g.price?"":"disabled"}>${g.price} FB</button>`}</div>`;}).join("");
  showOverlay(`<h2>Tackle shop</h2><p class="note"><b style="color:var(--brass)">${B} Fish Bucks</b></p>
  <div class="controls" style="flex-wrap:wrap">${tabs.map(([k,n])=>`<button class="iconbtn" data-tab="${k}" type="button" style="flex:1;${k===tab?"border-color:var(--brass);color:var(--brass)":""}">${n}</button>`).join("")}</div>
  <div class="acts">${body}</div>
  <div class="controls"><button class="big ghost" id="shBack" type="button" style="flex:1">Back</button></div>`);
  const buy=(p,fn,msg)=>{if(run.bucks<p)return;run.bucks-=p;fn();renderHud();toast(msg);shopScreen(tab);};
  document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>shopScreen(b.dataset.tab));
  document.querySelectorAll("[data-bb]").forEach(b=>b.onclick=()=>{const k=b.dataset.bb,[p,n]=BAITS[k];buy(p,()=>run.inv.bait[k]=(run.inv.bait[k]||0)+n,`+${n} ${k.toLowerCase()}`);});
  document.querySelectorAll("[data-bl]").forEach(b=>b.onclick=()=>{const k=b.dataset.bl;buy(LURES[k],()=>run.inv.lures[k]=(run.inv.lures[k]||0)+1,`Bought a ${k.toLowerCase()}`);});
  document.querySelectorAll("[data-bn]").forEach(b=>b.onclick=()=>{const k=b.dataset.bn;buy(LINES[k].price,()=>run.inv.lines[k]=1,`Spooled up with ${LINES[k].name}`);});
  document.querySelectorAll("[data-bg]").forEach(b=>b.onclick=()=>{const id=b.dataset.bg,g=GEAR[id];buy(g.price,()=>{run.inv.gear[id]=1;
    const cur=g.type==="rod"?GEAR[run.equip.rod]:g.type==="flyrod"?GEAR[run.equip.fly]:g.type==="reel"?GEAR[run.equip.reel]:null;
    if(g.type!=="kit"&&(!cur||g.price>cur.price))run.equip[g.type==="flyrod"?"fly":g.type]=id;
    if(id==="waterskin")run.water=Math.min(maxWater(),run.water+1.5);},`${g.name} bought${g.type!=="kit"?" and set up":""}`);});
  $("#shBack").onclick=tavernMenu;
}
function gearStats(g){
  if(g.type==="rod"||g.type==="flyrod")return ` <br>Strain ${Math.round((1-g.tm)*100)?"−"+Math.round((1-g.tm)*100)+"%":"normal"} · cast +${g.cast} m`;
  if(g.type==="reel")return ` <br>Drag ${Math.round(g.drag*100)} · reel speed ${g.speed} · ${g.cap} m of line`;
  return "";}
function kitScreen(onBack){
  const slot=(label,key,type)=>{const owned=Object.keys(GEAR).filter(id=>GEAR[id].type===type&&run.inv.gear[id]);
    const cur=run.equip[key];
    return `<div class="act" style="cursor:default;flex-wrap:wrap"><span>${label}<small>${cur?GEAR[cur].name+gearStats(GEAR[cur]):"None. Buy one at the tackle shop."}</small></span>
    ${owned.length>1?`<select data-eq="${key}" style="background:var(--panel);color:var(--cream);border:1px solid var(--rule);border-radius:8px;padding:6px">${owned.map(id=>`<option value="${id}" ${id===cur?"selected":""}>${GEAR[id].name}</option>`).join("")}</select>`:""}</div>`;};
  const bait=Object.entries(run.inv.bait).filter(([,n])=>n>0).map(([b,n])=>`${b} ${n}`).join(" · ")||"None";
  const lures=Object.entries(run.inv.lures).filter(([,n])=>n>0).map(([b,n])=>`${b} ${n}`).join(" · ")||"None";
  const lines=Object.keys(run.inv.lines).map(k=>LINES[k].short).join(", ");
  const kit=Object.keys(run.inv.gear).filter(id=>GEAR[id].type==="kit").map(id=>`<div class="act" style="cursor:default"><span>${GEAR[id].name}<small>${GEAR[id].desc}</small></span></div>`).join("");
  showOverlay(`<h2>Kit</h2><p class="note"><b style="color:var(--brass)">${run.bucks} Fish Bucks</b></p>
  <h3>Tackle</h3><div class="acts">${slot("Rod","rod","rod")}${slot("Fly rod","fly","flyrod")}${slot("Reel","reel","reel")}</div>
  <h3>Bag</h3><p class="note"><b>Bait:</b> ${bait}<br><b>Lures and flies:</b> ${lures}<br><b>Line:</b> ${lines}</p>
  ${kit?`<h3>Kit</h3><div class="acts">${kit}</div>`:""}
  <div class="controls"><button class="big ghost" id="kBack" type="button" style="flex:1">Back</button></div>`);
  document.querySelectorAll("[data-eq]").forEach(sel=>sel.onchange=()=>{run.equip[sel.dataset.eq]=sel.value;kitScreen(onBack);});
  $("#kBack").onclick=onBack;
}

/* ---------- Tavern ---------- */

/* ---------- Death ---------- */
function die(){
  const r=run,sl=store.slots[r.slot];G.state="dead";G.fish=null;G.float=null;G.reeling=false;setCondsEnabled(false);headerButtons(false);
  $("#panel").innerHTML='<div class="hint">…</div>';
  const best=r.log.reduce((m,e)=>e.w>m.w?e:m,{w:0,name:""});
  if(r.hardcore){

async function lbJSON(url,opt){const r=await fetch(url,opt);let j=null;try{j=await r.json();}catch(e){}
  if(!r.ok){const err=new Error((j&&j.error&&(j.error.message||j.error.status))||("HTTP "+r.status));err.status=r.status;throw err;}return j;}
async function lbAuth(){
  if(lb.token&&Date.now()<lb.exp-60000)return lb.token;
  if(lb.refresh){try{
    const j=await lbJSON(`https://securetoken.googleapis.com/v1/token?key=${FIREBASE.apiKey}`,{method:"POST",
      headers:{"Content-Type":"application/x-www-form-urlencoded"},body:"grant_type=refresh_token&refresh_token="+encodeURIComponent(lb.refresh)});
    lb.token=j.id_token;lb.refresh=j.refresh_token;lb.uid=j.user_id;lb.exp=Date.now()+(+j.expires_in)*1000;lbSave();return lb.token;
  }catch(e){if(e.status!==400)throw e;lb.refresh=null;}}
  const j=await lbJSON(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${FIREBASE.apiKey}`,{method:"POST",

function lbRecord(f,w,len,st){
  const rid=lbRunId();if(!rid)return false;const k=rid+"_"+f.id;
  if(w<=(lb.best[k]||0))return false;

  lbSave();lbFlush();return true;}
let lbBusy=false;
async function lbFlush(){
  if(!lbOn()||!lb.share||lbBusy||!Object.keys(lb.queue).length)return;
  if(navigator.onLine===false)return;
  lbBusy=true;
  try{const tok=await lbAuth();
    for(const k of Object.keys(lb.queue)){const e=lb.queue[k];
      const body={fields:{name:{stringValue:e.name},w:{doubleValue:e.w},len:{integerValue:String(e.len)},stars:{integerValue:String(e.stars)},
        hc:{booleanValue:e.hc},day:{integerValue:String(e.day)},at:{timestampValue:e.at}}};
      try{await lbJSON(`${lbBase()}/lb_${e.sp}/${lb.uid}_${e.rid}`,{method:"PATCH",headers:{"Content-Type":"application/json","Authorization":"Bearer "+tok},body:JSON.stringify(body)});
        delete lb.queue[k];
      }catch(err){if(err.status===403||err.status===400){delete lb.queue[k];}else throw err;}
      lbSave();}
  }catch(e){/* offline or blocked: keep the queue for next time */}
  lbBusy=false;}
async function lbTop(sp){
  const tok=await lbAuth();

  const v=x=>x?(x.stringValue??(x.doubleValue!=null?+x.doubleValue:x.integerValue!=null?+x.integerValue:x.booleanValue??x.timestampValue)):undefined;
  return (j||[]).filter(r=>r.document).map(r=>{const F=r.document.fields,id=r.document.name.split("/").pop();
    return {me:id.startsWith(lb.uid+"_"),name:v(F.name),w:v(F.w),len:v(F.len),stars:v(F.stars),hc:v(F.hc),day:v(F.day)};});}

  <h3>Fish Bucks and gear</h3><p>Sell your catch at the Willowmere Arms for Fish Bucks. Bigger, fresher, better-starred fish pay more, and Willowmere is a riverside village, so lake fish fetch more and river fish less. Sell too many of one kind and the price drops for a while. Spend your bucks on bait, lures, line, rods, reels and kit. The shop's gear changes every day.</p>
  <h3>Staying alive</h3><p>Watch food, warmth, energy, health and water. Light fires, cook your catch and boil water at camp. Only a night at the Willowmere Arms saves your game.</p>
  <h3>Keyboard</h3><p>Space or W to strike and reel, A and D to move the rod, N to net, Esc for the menu.</p>
  </div><div class="controls"><button class="big ghost" id="hBack" type="button" style="flex:1">Back</button></div>`);
  $("#hBack").onclick=onBack;
}
function settingsScreen(onBack){
  showOverlay(`<h2>Settings</h2>
  <div class="row"><label for="sens">Rod sensitivity</label><input id="sens" type="range" min="0.6" max="1.8" step="0.1" value="${save.settings.sens}"></div>
  ${run?`<div class="row"><label for="diffSel">Difficulty</label><select id="diffSel" style="background:var(--panel-2);color:var(--cream);border:1px solid var(--rule);border-radius:8px;padding:6px">${DORDER.slice(0,DORDER.indexOf(run.diff||"medium")+1).map(k=>`<option value="${k}" ${k===(run.diff||"medium")?"selected":""}>${DIFFS[k].name}</option>`).join("")}</select></div>
  <p class="note" id="diffNote">${diff().desc} You can lower the difficulty, but never raise it again.</p>`:""}
  <div class="row"><label for="unl">All methods unlocked (testing)</label><input id="unl" type="checkbox" ${save.settings.unlockAll?"checked":""}></div>
  <p class="note">Normally ledgering unlocks at fishing level 5, spinning at 10 and fly fishing at 15.</p>
  <div class="row"><label for="dbg">Show test numbers</label><input id="dbg" type="checkbox" ${save.settings.debug?"checked":""}></div>
  ${run&&!run.hardcore?`<div class="row"><span class="note">Switch this save to hardcore: permanent death, no going back.</span><button class="danger-btn" id="toHC" type="button">Go hardcore</button></div>`:""}
  <h3>Testing</h3>
  <div class="row"><label for="strict">Tension strictness <b id="strictv">${Math.round(save.settings.strict*100)}%</b></label><input id="strict" type="range" min="0.8" max="1.4" step="0.05" value="${save.settings.strict}"></div>
  ${run?`<div class="row"><button class="iconbtn" id="skip1" type="button">Skip 1 hour</button><button class="iconbtn" id="skip6" type="button">Skip 6 hours</button></div>`:""}
  <div class="row"><label for="lbShare">Post my best catches to the online leaderboard</label><input id="lbShare" type="checkbox" ${lb.share?"checked":""}></div>
  <p class="note">Shares your angler name and each species' heaviest fish. No account or code needed.</p>
  <p class="note">Tilt controls will come with the app build.</p>
  <div class="controls"><button class="big ghost" id="closeO" type="button" style="flex:1">Back</button></div>`);
  $("#sens").oninput=e=>{save.settings.sens=+e.target.value;persist();};
  $("#dbg").onchange=e=>{save.settings.debug=e.target.checked;persist();};
  $("#unl").onchange=e=>{save.settings.unlockAll=e.target.checked;persist();if(G.state==="ready")fillMethods();};
  const ds=$("#diffSel");if(ds)ds.onchange=()=>{const k=ds.value;if(k===run.diff)return;
    $("#diffNote").innerHTML=`Lower to <b>${DIFFS[k].name}</b>? You won't be able to raise it again. <button class="danger-btn" id="diffOk" type="button">Confirm</button>`;
    $("#diffOk").onclick=()=>{run.diff=k;const sl=store.slots[run.slot];if(sl){sl.diff=k;if(sl.tavern)sl.tavern.diff=k;saveStore();}renderHud();toast(`Difficulty: ${DIFFS[k].name}`);settingsScreen(onBack);};};
  $("#strict").oninput=e=>{save.settings.strict=+e.target.value;$("#strictv").textContent=Math.round(save.settings.strict*100)+"%";persist();};
  const hc=$("#toHC");if(hc){let armed=false;hc.onclick=()=>{
    if(!armed){armed=true;hc.textContent="Tap again: lock in permadeath";return;}
    run.hardcore=true;const sl=store.slots[run.slot];if(sl){sl.hardcore=true;if(sl.tavern)sl.tavern.hardcore=true;saveStore();}
    hc.textContent="Hardcore on";hc.disabled=true;renderHud();toast("This save is now hardcore. Good luck.",true,2200);};}
  if($("#skip1")){$("#skip1").onclick=()=>{advance(60);renderHud();toast("1 hour passes");checkDeath();};
    $("#skip6").onclick=()=>{advance(360);renderHud();toast("6 hours pass");checkDeath();};}
  $("#lbShare").onchange=e=>{lb.share=e.target.checked;lbSave();if(lb.share)lbFlush();};
  $("#closeO").onclick=()=>{if(G.state==="ready")fillMethods();onBack();};
}
$("#btnLog").addEventListener("click",()=>{
  if(["fight","waiting","flight"].includes(G.state))return toast("Not while fishing!",true,900);
  if(G.state==="result")toReady();
  logBook(()=>{if(G.state==="tavern")tavernMenu();else hideOverlay();});
});
$("#btnMenu").addEventListener("click",pauseMenu);

/* ---------- Loop ---------- */
let last=performance.now(),loopFail=false;
function frame(now){const dt=Math.min(0.05,(now-last)/1000);last=now;
  if(scen){try{update(dt);draw();}catch(err){console.error(err);
    if(!loopFail&&run&&["flight","waiting","fight"].includes(G.state)){loopFail=true;toReady("Something went wrong. Reset to a fresh cast.",true);setTimeout(()=>loopFail=false,2000);}}}
  requestAnimationFrame(frame);}
function startupNotice(){
  G.state="menu";setCondsEnabled(false);headerButtons(false);
  $("#panel").innerHTML='<div class="hint">Welcome to Willowmere.</div>';
  showOverlay(`<span class="tag" style="background:var(--danger);color:#fff">Experimental build · v${VERSION}</span>
  <h2>Heads up, angler</h2>
  <p>Tight Lines is in an early, experimental phase. Expect bugs, glitches and things that change between updates, and saves may occasionally need to be cleared.</p>
  <p class="note">Found something broken? Let me know on Ko-fi or GitHub. Every report helps.</p>
  <div class="controls"><button class="big strike" id="nOk" type="button">Got it, let's fish</button></div>`);
  $("#nOk").onclick=()=>{noticeDone=true;titleScreen();
    if(canInstall()&&!installSnoozed())setTimeout(()=>{if(G.state==="menu")installPrompt();},400);};
}
fillMethods();renderLevel();resize();renderHud();startupNotice();requestAnimationFrame(frame);setTimeout(lbFlush,1500);
})();
</script>

</body>
</html>
