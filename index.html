};
// The city is a neutral hub: a fair price for everything, top money for rare fish and cooked dishes.
const CITY_RARE=1.5,CITY_DISH=1.25;
function wantText(T){return T.city?"pays a fair price for everything, and top money for rare fish and dishes":`pays well for ${T.want.toLowerCase()} fish`;}
const MAP_SPOTS={river:{x:58,y:84},lake:{x:170,y:66},coast:{x:262,y:248}};
const SPOT_BLURB={river:"Willows, snags and running water.",lake:"Still water, weed beds and big fish.",coast:"Surf, rocks and sea fish. Salt water only."};
const isTown=k=>!!TOWNS[k];
const innMid=k=>TOWNS[k].inn.replace(/^The /,"the "); // "the Lantern and Gull" mid-sentence
function town(){return TOWNS[run&&run.loc]||TOWNS[run&&run.lastTown]||TOWNS.tavern;}
function townId(){return isTown(run&&run.loc)?run.loc:(run&&run.lastTown)||"tavern";}
function placeName(k){return isTown(k)?TOWNS[k].n:SPOTS[k].name;}
function travelMins(a,b){const t=(TOWNS[a]||SPOTS[a]).travel[b]||(TOWNS[b]||SPOTS[b]).travel[a]||120;return Math.round(t*(hurtBy("sprain")?1.5:1));}
function fmtMins(m){return m>=60?(m%60?(m/60).toFixed(1):m/60)+" h":m+" min";}
// market saturation is per town; Willowmere keeps its old keys
function mkKey(id){const t=townId();return t==="tavern"?id:t+":"+id;}
function mapScreen(onBack){
  const here=run.loc,nodes=[...Object.keys(TOWNS).map(k=>({k,x:TOWNS[k].x,y:TOWNS[k].y,town:1})),...Object.keys(MAP_SPOTS).map(k=>({k,...MAP_SPOTS[k]}))];
  const P=k=>isTown(k)?TOWNS[k]:MAP_SPOTS[k];
  const roads=[["tavern","river"],["tavern","lake"],["river","lake"],["tavern","coast"],["tavern","saltwick"],["coast","saltwick"],["lake","saltwick"],["lake","thornmere"],["river","thornmere"],["river","city"],["tavern","city"],["coast","city"],["saltwick","city"]];
  const svg=`<svg viewBox="0 0 340 300" class="map" role="img" aria-label="Map of the region">
    <rect width="340" height="300" fill="#2e4a2c"/>
    <path d="M232 0 C 250 60, 236 120, 268 150 S 250 230, 214 300 L 340 300 L 340 0 Z" fill="#244d5e"/>
    <path d="M232 0 C 250 60, 236 120, 268 150 S 250 230, 214 300" fill="none" stroke="#c9b98a" stroke-width="5" opacity=".7"/>
    <path d="M20 0 C 40 40, 70 70, 60 110 S 80 170, 120 190 S 190 220, 240 262" fill="none" stroke="#3f7891" stroke-width="7" stroke-linecap="round"/>
    <ellipse cx="172" cy="62" rx="40" ry="22" fill="#3f7891"/>
    ${[[30,200],[60,250],[140,250],[150,120],[200,150],[20,140],[110,40]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="9" fill="#264227"/><circle cx="${x+10}" cy="${y+4}" r="7" fill="#264227"/>`).join("")}
    ${roads.map(([a,b])=>{const A=P(a),B=P(b),mx=(A.x+B.x)/2,my=(A.y+B.y)/2;
      return `<line x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}" stroke="#d9c79a" stroke-width="1.5" stroke-dasharray="4 4" opacity=".75"/><text x="${mx}" y="${my-3}" class="mt">${fmtMins(travelMins(a,b))}</text>`;}).join("")}
    ${nodes.map(n=>{const cur=n.k===here;return `<g data-go="${n.k}" class="mnode ${cur?"cur":""}" tabindex="0" role="button" aria-label="${placeName(n.k)}">
      ${n.town?(TOWNS[n.k].city?`<rect x="${n.x-13}" y="${n.y-11}" width="26" height="22" rx="3" fill="#e8d9a8" stroke="#3a2a14" stroke-width="2"/><path d="M${n.x-10} ${n.y+5} v-8 l4 -4 l4 4 v8 M${n.x} ${n.y+5} v-11 l4 -4 l4 4 v11" fill="#8a3b26"/>`:`<rect x="${n.x-9}" y="${n.y-9}" width="18" height="18" rx="3" fill="#e8d9a8" stroke="#3a2a14" stroke-width="2"/><path d="M${n.x-6} ${n.y+2} l6 -7 l6 7 z" fill="#8a3b26"/>`):
        `<circle cx="${n.x}" cy="${n.y}" r="9" fill="#e3593c" stroke="#3a2a14" stroke-width="2"/><circle cx="${n.x}" cy="${n.y-2}" r="3" fill="#fff"/>`}
      ${cur?`<circle cx="${n.x}" cy="${n.y}" r="15" fill="none" stroke="#f1c75b" stroke-width="2.5"/>`:""}
      <text x="${n.x}" y="${["saltwick","river","thornmere"].includes(n.k)?n.y-16:n.y+24}" class="ml">${placeName(n.k)}</text></g>`;}).join("")}
  </svg>`;
  const list=nodes.filter(n=>n.k!==here).map(n=>`<button class="act" data-go="${n.k}" type="button"><span>${isTown(n.k)?TOWNS[n.k].inn+", "+TOWNS[n.k].n:placeName(n.k)}<small>${isTown(n.k)?`${capF(TOWNS[n.k].kind)}: ${wantText(TOWNS[n.k])}.`:SPOT_BLURB[n.k]}</small></span><em>${fmtMins(travelMins(here,n.k))}</em></button>`).join("");
  showOverlay(`<h2>Map</h2><p class="note">You're at ${isTown(here)?innMid(here):placeName(here)}. Tap a place to travel there.${hurtBy("sprain")?" Your sprained ankle slows you down.":""}</p>${svg}
    <div class="acts">${list}</div><div class="controls"><button class="big ghost" id="mapBack" type="button" style="flex:1">Back</button></div>`);
  document.querySelectorAll("[data-go]").forEach(b=>{if(b.dataset.go===here)return;const go=()=>travelTo(b.dataset.go);b.onclick=go;b.onkeydown=e=>{if(e.key==="Enter")go();};});
  $("#mapBack").onclick=onBack;
}

/* ---------- Request boards and reputation ---------- */
// run.rep[town]: standing from -100 to 100. run.boards[town]: {day,reqs}, refreshed every 2 days.
// run.jobs: accepted requests (up to 3). Kinds: catch (fresh fish), size (over a weight), stars (quality),
// rare (a rare fish), preserved (salted or smoked), dish (a recipe dish with a given fish), deliver (a parcel to another town).
const JOB_MAX=3,REP_GAIN=[0,4,7,10],REP_FAIL=[0,5,8,12],REP_DROP=[0,3,5,8];
function repOf(t){return Math.round((run.rep&&run.rep[t])||0);}
function addRep(t,n){if(!run.rep)run.rep={};run.rep[t]=clamp((run.rep[t]||0)+n,-100,100);}
function repName(r){return r<=-20?"Distrusted":r<10?"Stranger":r<30?"Known":r<60?"Regular":r<90?"Friend":"Local legend";}
function repNext(r){return r<10?10:r<30?30:r<60?60:r<90?90:null;}
// Standing changes the price the inn pays: up to +20% for a local legend, down to −20% if they distrust you.
function repMul(t){return 1+clamp(repOf(t),-100,100)/500;}
function repPerks(r){return r<=-20?"They pay you less and hold back their better orders.":r<10?"Do a few jobs and they'll get to know you.":
  r<30?"Harder, better-paid orders on the board.":r<60?"Better rewards on the board.":r<90?"An extra piece of gear in the shop every day.":"The best prices in town, and they'd name a pub after you.";}
function fishById(id){return FISH.find(f=>f.id===id);}
function basePrice(f){const b={Common:[4,1.5],Uncommon:[12,2],Rare:[30,3],"Very rare":[60,4]}[f.rarity];return b[0]+b[1]*(f.min+f.max)/2;}
function due(mins){return absMin()+mins;}
function fmtDue(m){const left=m-absMin();if(left<=0)return "overdue";const d=Math.floor(m/1440)+1;
  return `by day ${d}, ${clock(m%1440)} · ${left>=120?Math.floor(left/60)+" h":Math.max(1,Math.round(left))+" min"} left`;}
function jobFish(rarity){
  const s=conds().season,L=level();
  return FISH.filter(f=>(!rarity||rarity.includes(f.rarity))&&f.seasons.includes(s)&&f.methods.some(m=>m==="Pot"?L>=20:methodOk(m)));}
function makeReq(t,tier){
  const r=repOf(t),bonus=1+Math.max(0,r)/200,ck=skLv("cook"),opts=[];
  const id=()=>Math.random().toString(36).slice(2,8);
  const pay=v=>Math.round(v*bonus);
  if(tier===1){
    const com=jobFish(["Common"]);
    if(com.length){const f=pick(com),n=f.max<1?3:f.max<4?2:1;
      opts.push({kind:"catch",fish:f.id,n,due:due(1440*2),bucks:pay(basePrice(f)*n*1.7+5),txt:`${n>1?n+" fresh ":"A fresh "}${n>1?f.name.toLowerCase():f.name.toLowerCase()}`,sub:"Caught in the last day, any size."});}
    const others=Object.keys(TOWNS).filter(x=>x!==t),to=pick(others),hrs=travelMins(t,to)/60;
    opts.push({kind:"deliver",to,due:due(travelMins(t,to)+rand(6,14)*60|0),bucks:pay(6+hrs*5),txt:`A parcel for ${innMid(to)}, ${TOWNS[to].n}`,sub:pick(["Wrapped in brown paper and smells faintly of pipe smoke.","A crate of empty jars. It rattles.","A letter and a pair of mended boots.","Fresh-baked bread. Try not to eat it."])});
  }
  if(tier===2){
    const unc=jobFish(["Common","Uncommon"]).filter(f=>f.max>=1);
    if(unc.length){const f=pick(unc),w=+(f.min+(f.max-f.min)*rand(0.35,0.55)).toFixed(1);
      opts.push({kind:"size",fish:f.id,w,due:due(1440*3),bucks:pay(basePrice(f)*2.6+10),txt:`A ${f.name.toLowerCase()} of ${lbOz(w)} or more`,sub:"Not spoiled. Any freshness the cook will take."});}
    const any=jobFish(["Common","Uncommon"]);
    if(any.length){const f=pick(any);opts.push({kind:"stars",fish:f.id,s:4,due:due(1440*3),bucks:pay(basePrice(f)*2.2+10),txt:`A 4-star ${f.name.toLowerCase()} or better`,sub:"Quality matters to this buyer. Raw and not spoiled."});}
    if(ck>=15){const sm=ck>=25&&run.inv.gear.smoker&&Math.random()<0.5,n=sm?1:2;
      opts.push({kind:"preserved",form:sm?"smoked":"salted",n,due:due(1440*3),bucks:pay(sm?40:34),txt:`${n} ${sm?"smoked":"salted"} fish, any kind`,sub:"For the larder. Must still be good."});}
  }
  if(tier===3){
    const rare=jobFish(["Rare","Very rare"]);
    if(rare.length){const f=pick(rare);opts.push({kind:"rare",fish:f.id,due:due(1440*4),bucks:pay(basePrice(f)*2.5+25),txt:`A ${f.name.toLowerCase()}, any size`,sub:"A collector's order. Raw and not spoiled."});}
    const dishes=Object.keys(RECIPES).filter(k=>run.recipes.includes(k)&&!RECIPES[k].feast&&ck>=RECIPES[k].lv);
    if(dishes.length){const d=pick(dishes),R=RECIPES[d],f=R.fishId?fishById(R.fishId):pick(jobFish(R.water?null:["Common","Uncommon"]).filter(x=>!R.water||x.water===R.water))||null;
      if(f)opts.push({kind:"dish",dish:d,fish:R.fishId||null,due:due(1440*2),bucks:pay(basePrice(f)*R.mult*1.6+20),txt:recipeTitle(d),sub:"Cooked fresh for a private dinner. Must still be good."});}
    const big=jobFish(["Uncommon","Rare"]).filter(f=>f.max>=8);
    if(big.length){const f=pick(big),w=+(f.min+(f.max-f.min)*rand(0.6,0.75)).toFixed(1);
      opts.push({kind:"size",fish:f.id,w,due:due(1440*4),bucks:pay(basePrice(f)*4+25),txt:`A specimen ${f.name.toLowerCase()} of ${lbOz(w)} or more`,sub:"For a glass case over the bar. Not spoiled."});}
  }
  if(!opts.length)return null;
  const o=pick(opts);o.id=id();o.tier=tier;o.town=t;
  // things money can't buy, sometimes
  if(Math.random()<[0,0.1,0.3,0.6][tier]){const x=pick(["recipe","lures","kit","bait"]);
    if(x==="recipe"&&learnable().length)o.extra={recipe:1};
    else if(x==="kit"){const k=["lantern","bell","bedroll","jacket","waterskin"].filter(g=>!run.inv.gear[g]);if(k.length)o.extra={kit:pick(k)};}
    else if(x==="lures")o.extra={lure:pick(["Big lure","Soft lure","Dry fly","Nymph"]),n:3};
    else o.extra={bait:pick(["Peeler crab","Squid","Boilies","Deadbait"]),n:10};}
  return o;}
function learnable(){return Object.keys(RECIPES).filter(r=>!RECIPES[r].region&&!RECIPES[r].feast&&!run.recipes.includes(r));}
function extraText(x){if(!x)return "";return x.recipe?"a recipe":x.kit?GEAR[x.kit].name.toLowerCase():x.lure?`${x.n} ${x.lure.toLowerCase()}s`:`${x.n} ${x.bait.toLowerCase()}`;}
function board(t){
  if(!run.boards)run.boards={};let B=run.boards[t];
  if(!B||run.day>=B.day+2){
    const tiers=[1,1,2];if(repOf(t)>-20)tiers.push(repOf(t)>=10?3:2);
    B=run.boards[t]={day:run.day,reqs:tiers.map(x=>makeReq(t,x)).filter(Boolean)};}
  return B;}
// does keep-net item k count towards job j?
function fitsJob(j,k){const f=k.form||"raw";if(isSpoiled(k))return false;
  if(j.kind==="catch")return k.id===j.fish&&f==="raw"&&itemAge(k)<1;
  if(j.kind==="size")return k.id===j.fish&&f==="raw"&&k.w>=j.w;
  if(j.kind==="stars")return k.id===j.fish&&f==="raw"&&(k.stars||3)>=j.s;
  if(j.kind==="rare")return k.id===j.fish&&f==="raw";
  if(j.kind==="preserved")return f===j.form;
  if(j.kind==="dish")return f==="dish"&&k.dish===j.dish;
  return false;}
function jobReady(j){if(j.kind==="deliver")return false;const n=j.n||1;return run.keep.filter(k=>fitsJob(j,k)).length>=n;}
function payJob(j){
  const out=[`+${j.bucks} Fish Bucks`];run.bucks+=j.bucks;const x=j.extra;
  if(x){if(x.recipe){const r=learnRecipe();if(r)out.push(`recipe: ${recipeTitle(r)}`);else{run.bucks+=15;out.push("+15 Fish Bucks");}}
    if(x.kit){if(!run.inv.gear[x.kit]){run.inv.gear[x.kit]=1;out.push(GEAR[x.kit].name);if(x.kit==="waterskin")run.water=Math.min(maxWater(),run.water+1.5);}else{run.bucks+=20;out.push("+20 Fish Bucks");}}
    if(x.lure){run.inv.lures[x.lure]=(run.inv.lures[x.lure]||0)+x.n;out.push(`${x.n} ${x.lure.toLowerCase()}s`);}
    if(x.bait){run.inv.bait[x.bait]=(run.inv.bait[x.bait]||0)+x.n;out.push(`${x.n} ${x.bait.toLowerCase()}`);}}
  const t=j.kind==="deliver"?j.to:j.town;addRep(j.town,REP_GAIN[j.tier]);if(t!==j.town)addRep(t,1);
  run.jobs=run.jobs.filter(o=>o.id!==j.id);
  return out.join(" · ");}
function handIn(j){
  const n=j.n||1,idx=run.keep.map((k,i)=>({k,i})).filter(o=>fitsJob(j,o.k)).sort((a,b)=>fishPrice(a.k).p-fishPrice(b.k).p).slice(0,n).map(o=>o.i).sort((a,b)=>b-a);
  if(idx.length<n)return null;idx.forEach(i=>run.keep.splice(i,1));return payJob(j);}
// overdue jobs fail and cost standing; called as time passes
function checkJobs(){if(!run||!run.jobs||!run.jobs.length)return;const now=absMin();
  for(const j of run.jobs.slice())if(now>j.due){run.jobs=run.jobs.filter(o=>o.id!==j.id);addRep(j.town,-REP_FAIL[j.tier]);
    if(j.kind==="deliver")addRep(j.to,-2);
    toast(`Request failed: ${j.txt.toLowerCase()} for ${TOWNS[j.town].n}. Your standing there drops.`,true,3200);}}
function deliverHere(t){if(!run.jobs)return;for(const j of run.jobs.slice())if(j.kind==="deliver"&&j.to===t&&absMin()<=j.due){
  const msg=payJob(j);toast(`Parcel delivered to ${innMid(t)}. ${msg}`,false,3200);}}
function jobRow(j,here){
  const ready=jobReady(j),handable=here===j.town&&ready;
  const where=j.kind==="deliver"?`Deliver to ${TOWNS[j.to].n}`:here===j.town?(ready?"You have it":`Bring it here${j.n>1?` (${run.keep.filter(k=>fitsJob(j,k)).length}/${j.n})`:""}`):`Hand in at ${TOWNS[j.town].n}`;
  return `<div class="act" style="cursor:default"><span>${j.txt}<small>${TOWNS[j.town].n} · ${fmtDue(j.due)} · ${where}<br>Reward ${j.bucks} FB${j.extra?" and "+extraText(j.extra):""}</small></span>
    <span style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">${handable?`<button class="iconbtn" data-hand="${j.id}" type="button">Hand in</button>`:""}${here===j.town?`<button class="iconbtn" data-drop="${j.id}" type="button">Give up</button>`:""}</span></div>`;}
function boardScreen(){
  const t=townId(),T=TOWNS[t],B=board(t),r=repOf(t),nx=repNext(r);if(!run.jobs)run.jobs=[];
  const full=run.jobs.length>=JOB_MAX;
  const reqs=B.reqs.map(q=>`<div class="act" style="cursor:default"><span>${q.txt} <small style="display:inline;color:${["","var(--muted)","var(--safe)","var(--brass)"][q.tier]}">${["","Easy","Medium","Hard"][q.tier]}</small><small>${q.sub} ${q.kind==="deliver"?"Due "+fmtDue(q.due).replace(/ ·.*/,"")+".":`Allows ${Math.round((q.due-absMin())/1440)} days.`}<br>Reward ${q.bucks} FB${q.extra?" and "+extraText(q.extra):""}</small></span>
    <button class="iconbtn" data-take="${q.id}" type="button" ${full?"disabled":""}>Accept</button></div>`).join("");
  const L=level();
  showOverlay(`<span class="tag">${T.n}</span><h2>Request board</h2>
    <p class="note">Notices pinned up by ${T.city?"merchants, chefs and collectors":"locals, the kitchen and passing traders"}. New ones go up every two days. You can take on ${JOB_MAX} at a time. Miss a deadline and ${T.n} won't forget it.</p>
    <div class="stats"><div><small>Standing</small><b>${repName(r)}</b></div><div><small>Reputation</small><b>${r>0?"+":""}${r}</b></div><div><small>Prices</small><b>${repMul(t)>=1?"+":"−"}${Math.abs(Math.round((repMul(t)-1)*100))}%</b></div></div>
    <p class="note">${repPerks(r)}${nx!==null?` Next standing at ${nx}.`:""}</p>
    ${run.jobs.length?`<h3>Your requests (${run.jobs.length}/${JOB_MAX})</h3><div class="acts">${run.jobs.map(j=>jobRow(j,t)).join("")}</div>`:""}
    <h3>On the board</h3><div class="acts">${reqs||'<p class="note">Nothing pinned up right now. Check back in a day or two.</p>'}
    <div class="act" style="cursor:default;opacity:.75"><span>Legendary hunt · a sealed notice<small>${L<30?`Only for anglers of fishing level 30 and above. You're level ${L}.`:"The seal's unbroken and the notice is blank for now. Word in the bar is the big hunts start soon."}</small></span></div></div>
    <div class="controls"><button class="big ghost" id="bdBack" type="button" style="flex:1">Back</button></div>`);
  document.querySelectorAll("[data-take]").forEach(b=>b.onclick=()=>{const i=B.reqs.findIndex(q=>q.id===b.dataset.take);if(i<0||run.jobs.length>=JOB_MAX)return;
    const q=B.reqs.splice(i,1)[0];run.jobs.push(q);toast(q.kind==="deliver"?`You take the parcel for ${TOWNS[q.to].n}.`:"Request accepted.",false,1800);boardScreen();});
  document.querySelectorAll("[data-hand]").forEach(b=>b.onclick=()=>{const j=run.jobs.find(o=>o.id===b.dataset.hand);if(!j)return;const msg=handIn(j);if(msg){renderHud();toast(`Request done! ${msg}`,false,3000);}boardScreen();});
  document.querySelectorAll("[data-drop]").forEach(b=>b.onclick=()=>{const j=run.jobs.find(o=>o.id===b.dataset.drop);if(!j)return;
    run.jobs=run.jobs.filter(o=>o.id!==j.id);addRep(j.town,-REP_DROP[j.tier]);toast("You take the notice down. They'll remember that.",true,2200);boardScreen();});
  $("#bdBack").onclick=tavernMenu;}

/* ---------- Market news: seasonal prices, festivals, price events, gossip and the newspaper ---------- */
// Fish that only run in some seasons sell for less while everyone's catching them and more out of season.
function seasonMul(f){if(f.seasons.length>=4)return 1;return f.seasons.includes(conds().season)?0.9:1.3;}
// Festivals are fixed in the calendar (day 1–10 of a season), never random, so you can plan for them.
const FESTIVALS=[
  {id:"springfair",town:"tavern",season:"Spring",day:6,len:2,n:"Willowmere Spring Fair",water:"River",mult:1.5,dish:1.3,desc:"River fish pay 50% more at the Arms, and dishes 30% more."},
  {id:"mackerel",town:"saltwick",season:"Summer",day:4,len:2,n:"Saltwick Mackerel Festival",fish:["mackerel"],mult:2,dish:1.3,desc:"Mackerel in any form fetches double, and dishes 30% more."},
  {id:"foodfair",town:"city",season:"Summer",day:8,len:2,n:"Kingsbridge Food Fair",dish:1.5,desc:"Every dish sells for 50% more at the Crown."},
  {id:"pikefair",town:"thornmere",season:"Autumn",day:7,len:2,n:"Thornmere Pike and Perch Fair",fish:["pike","perch"],mult:1.8,dish:1.2,desc:"Pike and perch pay 80% more at the Heron's Rest."},
  {id:"midwinter",town:"city",season:"Winter",day:5,len:2,n:"Kingsbridge Midwinter Market",preserved:1.4,dish:1.5,desc:"Salted and smoked fish pay 40% more and dishes 50% more."}
];
function seasonIdx(day){return Math.floor((day-1)/10)%4;}
// absolute day a festival next starts, from today (or today if it's on)
function festStart(F){const today=run.day;for(let d=today-F.len+1;d<today+40;d++){if(d<1)continue;if(SEASONS[seasonIdx(d)]===F.season&&((d-1)%10)+1===F.day)return d;}return null;}
function festOn(F){const s=festStart(F);return s!==null&&run.day>=s&&run.day<s+F.len;}
function festsHere(t){return FESTIVALS.filter(F=>F.town===t&&festOn(F));}
function festMul(f,k,t){let m=1;const form=k.form||"raw";
  for(const F of festsHere(t)){

// Price events come and go each day. They change prices whether you've heard of them or not.
function mktMul(f,k,t){let m=1;for(const e of (run.mkt||[])){if(e.until<run.day)continue;if(e.town&&e.town!==t)continue;
  if((e.water&&f.water===e.water)||(e.fish&&e.fish===f.id)||(e.dish&&(k.form||"raw")==="dish"))m*=e.mult;}return m;}
function dailyMarket(){
  if(!run.mkt)run.mkt=[];run.mkt=run.mkt.filter(e=>e.until>=run.day);
  if(run.mkt.length>=3||Math.random()>0.55)return;
  const s=conds().season,V=["tavern","saltwick","thornmere"],len=2+Math.floor(Math.random()*3),until=run.day+len-1;
  const inSeason=r=>FISH.filter(f=>r.includes(f.rarity)&&f.seasons.includes(s)&&f.methods[0]!=="Pot");
  const W={River:"river",Lake:"lake",Coast:"sea"};
  const opts=[
    ()=>({town:"saltwick",water:"Coast",mult:1.4,text:"A storm's keeping the Saltwick fleet in harbour. Sea fish are scarce there, and the Lantern and Gull is paying well for them."}),
    ()=>{const f=pick(inSeason(["Common"]));return f&&{fish:f.id,mult:0.7,text:`A bumper year for ${f.name.toLowerCase()}. Every market from here to Kingsbridge is full of them, and prices are down.`};},
    ()=>{const f=pick(inSeason(["Uncommon","Rare"]));return f&&{town:"city",fish:f.id,mult:1.6,text:`Henri at the Crown wants ${f.name.toLowerCase()} for a merchants' banquet, and he's paying over the odds.`};},
    ()=>{const t=pick(V);return {town:t,dish:1,mult:1.4,text:`There's a wedding in ${TOWNS[t].n}, and ${innMid(t)} is buying every fish dish it can get.`};},
    ()=>{const t=pick(V),w=pick(Object.keys(W).filter(x=>x!==TOWNS[t].want));return {town:t,water:w,mult:1.35,text:`${TOWNS[t].n}'s usual supplier has let them down. They're short of ${W[w]} fish.`};},
    ()=>{const t=pick(Object.keys(TOWNS)),w=pick(Object.keys(W));return {town:t,water:w,mult:0.75,text:`A fishing club cleaned out the ${W[w]} spots and sold the lot in ${TOWNS[t].n}. ${capF(W[w])} fish are cheap there for now.`};}
  ];
  const e=pick(opts)();if(!e)return;
  if(run.mkt.some(o=>o.town===e.town&&o.water===e.water&&o.fish===e.fish&&!!o.dish===!!e.dish))return;
  Object.assign(e,{id:Math.random().toString(36).slice(2,8),until,heard:false});run.mkt.push(e);}
function mktTag(e){const pct=Math.round((e.mult-1)*100);return `${e.town?TOWNS[e.town].n:"Everywhere"}: ${e.water?{River:"river",Lake:"lake",Coast:"sea"}[e.water]+" fish":e.fish?fishById(e.fish).name.toLowerCase():"dishes"} ${pct>0?"+":"−"}${Math.abs(pct)}%, until the end of day ${e.until}`;}
function festDays(F){const s=festStart(F);return s===null?null:s-run.day;}
function festLine(F){const d=festDays(F),when=festOn(F)?`<b style="color:var(--brass)">On now</b>, until the end of day ${festStart(F)+F.len-1}`:d===1?"Starts tomorrow":`In ${d} days (day ${festStart(F)})`;
  return `<div class="act" style="cursor:default"><span>${F.n}<small>${when} · ${TOWNS[F.town].n}. ${F.desc}</small></span></div>`;}
// Rare fish tips from the regulars: where and when a rare fish has been seen
function fishTip(){const f=pick(FISH.filter(x=>["Rare","Very rare"].includes(x.rarity)&&x.methods[0]!=="Pot"));
  const sp=Object.values(SPOTS).find(s=>s.water===f.water);
  return `"${f.name}? ${pick(["My cousin had one","I saw one landed","Old Tom swears he hooked one"])} at ${sp.name}. ${f.seasons.length>=4?"Any time of year":"In "+f.seasons.join(" or ").toLowerCase()}, ${f.times.map(t=>t.toLowerCase()).join(" or ")}${f.weather?`, and only when it's ${f.weather.map(w=>w.toLowerCase()).join(" or ")}`:""}. ${f.methods.join(" or ")} with ${f.baits.map(b=>b.toLowerCase()).join(" or ")}. Bring strong line."`;}
function newsScreen(msg){

    const unheard=run.mkt.filter(e=>e.until>=run.day&&!e.heard&&e.town!==t),soon=FESTIVALS.filter(F=>{const d=festDays(F);return d!==null&&d<=10&&F.town!==t&&!(run.news.fest||[]).includes(F.id);});

/* ---------- Storage: keep net slots and tavern lockers ---------- */
// Bigger fish take more slots. Salted and smoked fish pack down a slot smaller.
// Lockers are rented per town and hold what you leave there: no shared storage, so items stay where you left them.
const NET_SLOTS=12,BIGNET=8,LOCKER_SLOTS=24,LOCKER_RENT=10,LOCKER_DAYS=10;
function slotsOf(k){const w=k.w,s=w<2?1:w<6?2:w<15?3:w<30?4:5,f=k.form||"raw";return f==="salted"||f==="smoked"?Math.max(1,s-1):s;}
function used(list){return list.reduce((a,k)=>a+slotsOf(k),0);}
function netCap(){return NET_SLOTS+(run.inv.gear.bignet?BIGNET:0)+veh().boot;}
function netUsed(){return used(run.keep);}
function netFits(k){return netUsed()+slotsOf(k)<=netCap();}
function netLabel(){return `${netUsed()}/${netCap()} slots`;}
function locker(t){if(!run.lockers)run.lockers={};return run.lockers[t];}
function lockerPaid(t){const L=locker(t);return !!L&&L.until>=run.day;}
function itemRow(k,i,btns){const sp=isSpoiled(k);
  return `<div class="act" style="cursor:default"><span>${prodName(k)} · ${lbOz(k.w)} <small style="display:inline">${slotsOf(k)} slot${slotsOf(k)>1?"s":""}</small><small>${sp?"Spoiled":`Good for ${Math.max(0,keepDays(k)-itemAge(k)).toFixed(1)} more days`}${qTag(k)&&!sp?" · "+qTag(k):""}</small></span><span style="display:flex;gap:6px">${btns(k,i)}</span></div>`;}
// When the net is full: let fish go to make room. back() returns to wherever you came from.
function netManage(back,need,giveUp){
  showOverlay(`<span class="tag">Keep net</span><h2>Make room</h2><p class="note">Your keep net (${NET_SLOTS+(run.inv.gear.bignet?BIGNET:0)}) and ${veh().n.toLowerCase().replace(/^old /,"")} (${veh().boot}) hold ${netCap()} slots and you're using ${netUsed()}.${need?` You need ${need} free for this one.`:""} Fish under 2 lb take 1 slot, up to 6 lb 2, up to 15 lb 3, up to 30 lb 4, and anything bigger 5. Salted and smoked fish take one less.${run.inv.gear.bignet?"":" A big keep net from the tackle shop holds 8 more."}</p>
    <div class="acts">${run.keep.map((k,i)=>itemRow(k,i,(k,i)=>`<button class="iconbtn" data-rel="${i}" type="button">Let it go</button>`)).join("")||'<p class="note">Empty.</p>'}</div>
    <div class="controls">${giveUp?`<button class="big ghost" id="nmGive" type="button" style="flex:1">Let the new one go</button>`:""}<button class="big" id="nmBack" type="button" style="flex:1">Done</button></div>`);

  document.querySelectorAll("[data-rel]").forEach(b=>b.onclick=()=>{const k=run.keep.splice(+b.dataset.rel,1)[0];toast(isSpoiled(k)?"Binned.":`The ${k.name.toLowerCase()} goes back in.`,false,1400);netManage(back,need,giveUp);});

function lockerScreen(){

/* ---------- Vehicles: the car, van and campervan ---------- */

// Bought at Kingsbridge Motors in the city; your old vehicle goes in part exchange for half its price.
const VEH={

const COOLBOX=30;
function veh(){return VEH[(run&&run.car&&run.car.kind)||"estate"];}

function camperHere(){return !!(run&&veh().bed&&!isTown(run.loc));}
function garageScreen(){

/* ---------- Travel scenes: a short drive between places ---------- */
// The clock, sky, weather and your vehicle all match the trip. Tap to skip. Settings, Travel scenes, turns it off.
function travelScene(from,dest,m0,mins,done){
  const dur=clamp(1800+mins*14,2200,4500),kind=(run.car&&run.car.kind)||"estate",V=VEH[kind];
  const salt=[from,dest].some(k=>k==="coast"||k==="saltwick"),lake=[from,dest].some(k=>k==="lake"||k==="thornmere"),city=[from,dest].includes("city");
  showOverlay(`<span class="tag">On the road</span><h2>${placeName(dest)}</h2>
    <p class="note">${placeName(from)} → ${placeName(dest)} · ${fmtMins(mins)} in your ${V.n.toLowerCase()}</p>
    <canvas id="trCv" width="680" height="380" style="width:100%;border-radius:10px;display:block;background:#1d3a4a"></canvas>
    <p class="note" style="text-align:center;opacity:.7">Tap to skip</p>`,"event");
  const cv=$("#trCv"),c=cv.getContext("2d"),Wc=cv.width,Hc=cv.height,t0=performance.now();let over=false;
  const wx=run.weather,seed=[...Array(40)].map((_,i)=>({x:Math.random()*Wc,y:Math.random()*Hc*0.45,s:Math.random()}));
  const finish=()=>{if(over)return;over=true;$("#overlay").onclick=null;done();};
  $("#overlay").onclick=finish;
  const lerp=(a,b,t)=>a+(b-a)*t;
  const mix=(c1,c2,t)=>{const p=s=>[1,3,5].map(i=>parseInt(s.slice(i,i+2),16));const A=p(c1),B=p(c2);return `rgb(${A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(",")})`;};
  const skyAt=m=>{const h=(m%1440)/60;
    if(h<5||h>=21)return ["#0b1630","#1c2b4a",0];
    if(h<7){const t=(h-5)/2;return [mix("#0b1630","#e89a5c",t),mix("#1c2b4a","#f3c98a",t),t];}
    if(h<17)return ["#5d9fd0","#bfe0ef",1];
    if(h<19){const t=(h-17)/2;return [mix("#5d9fd0","#7a4f8a",t),mix("#bfe0ef","#e89a5c",t),1-t*0.5];}
    const t=(h-19)/2;return [mix("#7a4f8a","#0b1630",t),mix("#e89a5c","#1c2b4a",t),0.5-t*0.5];};
  const hill=(off,base,amp,f,col,yScale)=>{c.fillStyle=col;c.beginPath();c.moveTo(0,Hc);
    for(let x=0;x<=Wc;x+=8){const X=x+off;c.lineTo(x,base-amp*(Math.sin(X*f)*0.6+Math.sin(X*f*2.3+1.7)*0.4)*yScale);}c.lineTo(Wc,Hc);c.fill();};
  function frame(now){if(over)return;const t=clamp((now-t0)/dur,0,1),m=m0+mins*t,ph=(now-t0)/1000;
    const [top,bot,light]=skyAt(m),night=light<0.35,dark=1-light;
    const g=c.createLinearGradient(0,0,0,Hc*0.7);g.addColorStop(0,top);g.addColorStop(1,bot);c.fillStyle=g;c.fillRect(0,0,Wc,Hc);
    if(night){c.fillStyle="#fff";seed.forEach(s=>{c.globalAlpha=0.3+0.6*Math.abs(Math.sin(ph*2+s.s*9));c.fillRect(s.x,s.y,2,2);});c.globalAlpha=1;
      c.fillStyle="#f3efd8";c.beginPath();c.arc(Wc*0.8,70,20,0,7);c.fill();}
    else{const h=(m%1440)/60,sx=Wc*clamp((h-6)/12,0,1),sy=200-150*Math.sin(Math.PI*clamp((h-6)/12,0,1));c.fillStyle="#fff3c4";c.beginPath();c.arc(sx,sy,24,0,7);c.fill();}
    // clouds
    c.fillStyle=wx==="Clear"?"rgba(255,255,255,.55)":"rgba(200,205,210,.75)";

/* ---------- Tilt controls: tilt the phone left and right to move the rod in a fight ---------- */
// Uses the phone's orientation sensor (works in the browser over https and in the app).
// tiltRange: degrees of tilt for full rod travel. tiltZero: the "level" angle saved by Calibrate.
const TILT={now:null,seen:false,want:0};
function tiltAngle(e){const a=(screen.orientation&&screen.orientation.angle)||window.orientation||0;
  if(a===90)return e.beta;if(a===-90||a===270)return -e.beta;return e.gamma;}
function onTilt(e){if(e.gamma==null&&e.beta==null)return;TILT.seen=true;TILT.now=tiltAngle(e);TILT.beta=e.beta;
  if(save.settings.tilt&&G.state==="fight"){TILT.want=clamp((TILT.now-(save.settings.tiltZero||0))/(save.settings.tiltRange||25),-1,1);}
  const el=document.getElementById("tiltNow");if(el)el.textContent=`${Math.round(TILT.now-(save.settings.tiltZero||0))}°`;}
function startTilt(){
  const go=()=>window.addEventListener("deviceorientation",onTilt);

    return DeviceOrientationEvent.requestPermission().then(r=>{if(r==="granted"){go();return true;}return false;}).catch(()=>false);}

/* ---------- Motion casting: hold Cast, swing the phone back, flick it forward and let go ---------- */
// Power: how fast the flick was (peak turning speed vs flickMax, in degrees a second).
// Timing: letting go just after the fastest point of the flick is a clean cast; much earlier or later is messy.
// Aim: the phone's left-right tilt when you let go.
const MC={seen:false,rate:0};
function onMotion(e){const r=e.rotationRate;if(!r)return;MC.seen=true;
  MC.rate=Math.hypot(r.alpha||0,r.beta||0,r.gamma||0);
  const m=G.mcast;if(m){const t=performance.now();if(MC.rate>m.peak){m.peak=MC.rate;m.tPeak=t;}
    if(TILT.beta!=null){m.swing=Math.max(m.swing,Math.abs(TILT.beta-m.beta0));}}}

  const go=()=>{window.addEventListener("devicemotion",onMotion);startTilt();};

function lbRecord(f,w,len,st){
  const rid=lbRunId();if(!rid)return false;const k=rid+"_"+f.id;
  if(w<=(lb.best[k]||0))return false;
  lb.best[k]=w;
  lb.queue[k]={sp:f.id,rid,name:run.name.slice(0,20),w:+w.toFixed(3),len,stars:st,hc:!!run.hardcore,day:run.day,at:new Date().toISOString()};
  lbSave();lbFlush();return true;}
let lbBusy=false;
async function lbFlush(){
  if(!lbOn()||!lb.share||lbBusy||!Object.keys(lb.queue).length)return;
  if(navigator.onLine===false)return;
  lbBusy=true;
  try{const tok=await lbAuth();
    for(const k of Object.keys(lb.queue)){const e=lb.queue[k];
      const body={fields:{name:{stringValue:e.name},w:{doubleValue:e.w},len:{integerValue:String(e.len)},stars:{integerValue:String(e.stars)},
        hc:{booleanValue:e.hc},day:{integerValue:String(e.day)},at:{timestampValue:e.at}}};
      try{await lbJSON(`${lbBase()}/lb_${e.sp}/${lb.uid}_${e.rid}`,{method:"PATCH",headers:{"Content-Type":"application/json","Authorization":"Bearer "+tok},body:JSON.stringify(body)});
        delete lb.queue[k];
      }catch(err){if(err.status===403||err.status===400){delete lb.queue[k];}else throw err;}
      lbSave();}
  }catch(e){/* offline or blocked: keep the queue for next time */}
  lbBusy=false;}
async function lbTop(sp){
  const tok=await lbAuth();
  const j=await lbJSON(`${lbBase()}:runQuery`,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+tok},
    body:JSON.stringify({structuredQuery:{from:[{collectionId:"lb_"+sp}],orderBy:[{field:{fieldPath:"w"},direction:"DESCENDING"}],limit:10}})});
  const v=x=>x?(x.stringValue??(x.doubleValue!=null?+x.doubleValue:x.integerValue!=null?+x.integerValue:x.booleanValue??x.timestampValue)):undefined;
  return (j||[]).filter(r=>r.document).map(r=>{const F=r.document.fields,id=r.document.name.split("/").pop();
    return {me:id.startsWith(lb.uid+"_"),name:v(F.name),w:v(F.w),len:v(F.len),stars:v(F.stars),hc:v(F.hc),day:v(F.day)};});}

function howTo(onBack){
  showOverlay(`<h2>How to play</h2><div class="howto">
  <h3>Casting</h3><p>Drag down on the water to swing back; drag sideways to aim. A marker swings along the bar. Release at the gold end for a clean cast, and hit it exactly for a perfect cast.</p>
  <h3>Methods</h3><dl>
    <dt>Float</dt><dd>Watch the float. Strike when it goes under, not on the little dips.</dd>
    <dt>Ledger</dt><dd>Bait on the bottom, cast further. Strike when the rod tip pulls right round.</dd>
    <dt>Spinning</dt><dd>Hold to retrieve. Fish hit a moving lure, and the hook sets itself.</dd>
    <dt>Fly</dt><dd>Short casts. Strike the instant a fish rises. On the river the fly drifts downstream.</dd></dl>
  <h3>Motion casting</h3><p>Turn it on in Settings and a Hold to cast button appears. Hold it, swing the phone back over your shoulder, then flick it forward and let go. The faster the flick, the further it goes; let go just as the flick peaks for a clean cast; tilt the phone left or right to aim. Use Practise in Settings to see your power and timing and set full power to suit your wrist. Hold on tight!</p>
  <h3>Tilt</h3><p>Prefer to steer with the phone? Turn on tilt controls in Settings, hold the phone how you like and tap Calibrate. In a fight, tilting left and right moves the rod instead of dragging.</p>
  <h3>The fight</h3><p>Fish fight longer than they used to and recover if you let the line go slack. When one <b>bolts away from you</b>, the line jolts tight: stop reeling and move the rod with it, then get back to work when it slows. Hold Reel to bring it in; let go to let it run. Drag left and right to move the rod: with a run eases tension, against it tires the fish. Too much tension snaps the line; too little and the hook slips. Net it when it's close and tired.</p>
  <h3>Towns and trade</h3><p>Sell your catch in town for Fish Bucks. Bigger, fresher, better-starred fish pay more. Each village wants something different, like rock, paper, scissors: Willowmere (riverside) pays well for lake fish, Thornmere (lakeside) for sea fish and Saltwick (seaside) for river fish. Each pays less for its own kind. Kingsbridge, the city, pays a fair price for everything, 50% more for rare fish and 25% more for dishes. Regional dishes sell for 30% more away from home. Open the map to see how far everything is. Sell too many of one kind and the price drops for a while. Spend your bucks on bait, lures, line, rods, reels and kit. The shop's gear changes every day.</p><h3>Requests, news and storage</h3><p>Every inn has a request board with new orders every two days. Take on up to three, beat the deadline and get paid, sometimes with a recipe or gear on top. Each town remembers you: good standing means better prices and better orders, and missed deadlines cost you. Other towns' prices are hidden, so read the Kingsbridge Courier or buy a round at the bar to hear what's paying where, when the festivals are on, and where rare fish have been seen. Seasonal fish sell for less in season and more out of it. Your keep net holds 12 slots, and bigger fish take more. Rent a locker at any inn to store fish there, but it stays in that town. Your vehicle's boot adds slots too. Kingsbridge Motors in the city sells cool boxes, a fishing van and a campervan you can sleep in safely anywhere.</p>
  <h3>Reading the float</h3><p>Fish don't all bite the same. The float can dip, shake, bob or slide, and some fish fake it with a dip that nearly goes under and pops back up. Strike on any of those and you'll spook it. Strike when it goes under, slides away and sinks, or lifts and lies flat on the surface: tench and bream often lift the bait instead of pulling it down.</p>
  <h3>Weather</h3><p>Rain, wind and fog change what bites. Wind drifts your float and fly, catches the line in gusts during a fight and chills you; bass love a blow, fly fishing doesn't. Fog brings out the predators, pike and zander especially, and makes the float harder to see. Rain makes the reel slippery.</p>
  <h3>Staying alive</h3><p>Watch food, warmth, energy, health and water. Light fires, cook your catch and boil water at camp. Only a night at the Willowmere Arms saves your game.</p>
  <h3>Injuries</h3><p>Animals, falls and rusty tins can leave you hurt, and it lasts. An open wound stops your health coming back until you clean it on the fire or dress it with a bandage, and left for 12 hours it may get infected. A sprained ankle slows your travel and tires you; rest and strapping help. Cracked ribs slow your reeling and your healing. Hours at zero warmth leave you chilled to the bone. A room at the Willowmere Arms dresses everything and halves the time left to heal.</p>
  <h3>Events</h3><p>Things happen while you travel, rest and sleep out: wolves, boar, bears, foxes, strangers and finds. Pick a choice, roll a d20 and add your bonuses to beat the number. Skills add +1 for every 10 levels, a campfire scares animals off, a storm lantern helps after dark, and being exhausted or hurt counts against you. A natural 20 always works and a natural 1 always fails.</p>
  <h3>Hunting and foraging</h3><p>At camp you can forage for herbs, berries, wild veg and mushrooms, dig for bait (foraging level 5), set snares and check back after a few hours, or go tracking (hunting level 5). A hunting bow from the tackle shop gives +5 when tracking once you reach hunting level 10, and deer, boar and stags really need one. Game and foraged food go in your larder, spoil over time, and are for eating, not selling.</p>
  <h3>Cooking</h3><p>Tap Cook on a fish at camp. Everything starts with gutting and filleting, a d20 roll that gets better with cooking level: a good job sells for more and feeds you more, a botched one less. Cook and eat on the spot, or cook, salt (level 15) or smoke (level 25, portable smoker) to keep and sell. Campfire fish sells for a little more than raw, salted 1.5×, smoked 1.8×, and recipe dishes with foraged ingredients 2× to 5×. You start knowing two recipes; learn more from Maggie, the cook at the Willowmere Arms, strangers at your fire and abandoned camps. Spoiled fish makes chum: throw it in at camp and bites come much quicker for two hours.</p>
  <h3>Skills</h3><p>Fishing, hunting, foraging and cooking each level from 1 to 50. Cooking your catch at camp trains cooking, and events train hunting and foraging. See them all under Menu, Skills.</p>
  <h3>Keyboard</h3><p>Space or W to strike and reel, A and D to move the rod, N to net, Esc for the menu.</p>
  </div><div class="controls"><button class="big ghost" id="hBack" type="button" style="flex:1">Back</button></div>`);
  $("#hBack").onclick=onBack;
}

  <h3>Testing</h3>

  ${run?`<div class="row"><button class="iconbtn" id="skip1" type="button">Skip 1 hour</button><button class="iconbtn" id="skip6" type="button">Skip 6 hours</button></div>`:""}
  <div class="row"><label for="lbShare">Post my best catches to the online leaderboard</label><input id="lbShare" type="checkbox" ${lb.share?"checked":""}></div>
  <p class="note">Shares your angler name and each species' heaviest fish. No account or code needed.</p>
  <h3>Motion casting</h3>
  <div class="row"><label for="mcOn">Cast by flicking the phone</label><input id="mcOn" type="checkbox" ${save.settings.motionCast?"checked":""}></div>
  <p class="note" id="mcMsg">Hold the Cast button, swing the phone back, flick it forward and let go. A faster flick casts further, letting go as the flick peaks makes a clean cast, and tilting left or right aims. Swiping still works too. Keep a firm grip.</p>
  <div class="row"><button class="iconbtn" id="mcPrac" type="button">Practise and set your flick</button></div>
  <h3>Tilt controls</h3>
  <div class="row"><label for="tiltOn">Tilt the phone to move the rod</label><input id="tiltOn" type="checkbox" ${save.settings.tilt?"checked":""}></div>
  <p class="note" id="tiltMsg">In a fight, tilt left and right instead of dragging. Hold the phone how you normally would and tap Calibrate first. Right now: <b id="tiltNow">${TILT.seen?Math.round(TILT.now-(save.settings.tiltZero||0))+"°":"no reading yet"}</b></p>
  <div class="row"><label for="tiltRange">Tilt needed for full rod <b id="tiltRv">${save.settings.tiltRange||25}°</b></label><input id="tiltRange" type="range" min="10" max="45" step="1" value="${save.settings.tiltRange||25}"></div>
  <div class="row"><button class="iconbtn" id="tiltCal" type="button">Calibrate: hold level, then tap</button></div>
  <div class="controls"><button class="big ghost" id="closeO" type="button" style="flex:1">Back</button></div>`);
  $("#sens").oninput=e=>{save.settings.sens=+e.target.value;persist();};
  $("#mcOn").onchange=e=>{const on=e.target.checked;if(!on){save.settings.motionCast=false;persist();return;}
    startMotion().then(ok=>{if(!ok){e.target.checked=false;$("#mcMsg").textContent="Your phone didn't allow motion access, so motion casting can't work. Check your browser's motion sensor permission.";return;}
      save.settings.motionCast=true;persist();setTimeout(()=>{if(!MC.seen)$("#mcMsg").textContent="No motion sensor reading. This device may not have one (most computers don't). Give the phone a little shake and check again.";},1500);});};
  $("#mcPrac").onclick=()=>{startMotion();flickPractice(()=>settingsScreen(onBack));};
  $("#tiltOn").onchange=e=>{const on=e.target.checked;
    if(!on){save.settings.tilt=false;persist();return;}
    startTilt().then(ok=>{if(!ok){e.target.checked=false;$("#tiltMsg").textContent="Your phone didn't allow motion access, so tilt can't work. Check your browser's motion sensor permission.";return;}
      save.settings.tilt=true;persist();setTimeout(()=>{if(!TILT.seen)$("#tiltMsg").textContent="No tilt sensor reading. This device may not have one (most computers don't).";},1500);});};
  $("#tiltRange").oninput=e=>{save.settings.tiltRange=+e.target.value;$("#tiltRv").textContent=e.target.value+"°";persist();};
  $("#tiltCal").onclick=()=>{if(!TILT.seen){startTilt();toast("No tilt reading yet. Turn tilt on and try again.",true,2000);return;}save.settings.tiltZero=TILT.now;persist();toast("Calibrated. That's level.",false,1600);};
  $("#dbg").onchange=e=>{save.settings.debug=e.target.checked;persist();};
  $("#evts").onchange=e=>{save.settings.events=e.target.checked;persist();};
  $("#trAnim").onchange=e=>{save.settings.travelAnim=e.target.checked;persist();};
  $("#unl").onchange=e=>{save.settings.unlockAll=e.target.checked;persist();if(G.state==="ready")fillMethods();};
  const ds=$("#diffSel");if(ds)ds.onchange=()=>{const k=ds.value;if(k===run.diff)return;
    $("#diffNote").innerHTML=`Lower to <b>${DIFFS[k].name}</b>? You won't be able to raise it again. <button class="danger-btn" id="diffOk" type="button">Confirm</button>`;
    $("#diffOk").onclick=()=>{run.diff=k;const sl=store.slots[run.slot];if(sl){sl.diff=k;if(sl.tavern)sl.tavern.diff=k;saveStore();}renderHud();toast(`Difficulty: ${DIFFS[k].name}`);settingsScreen(onBack);};};
  $("#strict").oninput=e=>{save.settings.strict=+e.target.value;$("#strictv").textContent=Math.round(save.settings.strict*100)+"%";persist();};
  const hc=$("#toHC");if(hc){let armed=false;hc.onclick=()=>{
    if(!armed){armed=true;hc.textContent="Tap again: lock in permadeath";return;}
    run.hardcore=true;const sl=store.slots[run.slot];if(sl){sl.hardcore=true;if(sl.tavern)sl.tavern.hardcore=true;saveStore();}
    hc.textContent="Hardcore on";hc.disabled=true;renderHud();toast("This save is now hardcore. Good luck.",true,2200);};}
  if($("#skip1")){$("#skip1").onclick=()=>{advance(60);renderHud();toast("1 hour passes");checkDeath();};
    $("#skip6").onclick=()=>{advance(360);renderHud();toast("6 hours pass");checkDeath();};}
  $("#lbShare").onchange=e=>{lb.share=e.target.checked;lbSave();if(lb.share)lbFlush();};
  $("#closeO").onclick=()=>{if(G.state==="ready")fillMethods();onBack();};
}
$("#btnLog").addEventListener("click",()=>{
  if(["fight","waiting","flight"].includes(G.state))return toast("Not while fishing!",true,900);
  if(G.state==="result")toReady();
  logBook(()=>{if(G.state==="tavern")tavernMenu();else hideOverlay();});
});
$("#btnMenu").addEventListener("click",pauseMenu);

/* ---------- Loop ---------- */
let last=performance.now(),loopFail=false;
function frame(now){const dt=Math.min(0.05,(now-last)/1000);last=now;
  if(scen){try{update(dt);draw();}catch(err){console.error(err);
    if(!loopFail&&run&&["flight","waiting","fight"].includes(G.state)){loopFail=true;toReady("Something went wrong. Reset to a fresh cast.",true);setTimeout(()=>loopFail=false,2000);}}}
  requestAnimationFrame(frame);}
function startupNotice(){
  G.state="menu";setCondsEnabled(false);headerButtons(false);
  $("#panel").innerHTML='<div class="hint">Welcome to Willowmere.</div>';
  showOverlay(`<span class="tag" style="background:var(--danger);color:#fff">Experimental build · v${VERSION}</span>
  <h2>Heads up, angler</h2>
  <p>Tight Lines is in an early, experimental phase. Expect bugs, glitches and things that change between updates, and saves may occasionally need to be cleared.</p>
  <p class="note">Found something broken? Let me know on Ko-fi or GitHub. Every report helps.</p>
  <div class="controls"><button class="big strike" id="nOk" type="button">Got it, let's fish</button></div>`);
  $("#nOk").onclick=()=>{noticeDone=true;titleScreen();
    if(canInstall()&&!installSnoozed())setTimeout(()=>{if(G.state==="menu")installPrompt();},400);};
}
fillMethods();renderLevel();resize();renderHud();startupNotice();requestAnimationFrame(frame);setTimeout(lbFlush,1500);
window.kgBuild=VERSION;window.kgBeforeUpdate=()=>{try{if(run)suspend()}catch(_){}};
})();
</script>

<style id="kg-update-style">
.kg-upd{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translate(-50%,calc(-100% - 24px));transition:transform .35s ease;z-index:2147483001;width:min(440px,calc(100% - 20px));box-sizing:border-box;display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#16202b;color:#f1f4f8;border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:10px 10px 10px 14px;box-shadow:0 10px 28px rgba(0,0,0,.4);font:600 14px/1.35 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;text-align:left;letter-spacing:0;text-transform:none}
.kg-upd.on{transform:translate(-50%,0)}
.kg-upd span{flex:1 1 160px}
.kg-upd button{font:inherit;border-radius:999px;padding:8px 14px;cursor:pointer;border:1px solid rgba(255,255,255,.25);background:transparent;color:inherit;white-space:nowrap;width:auto;margin:0}
.kg-upd .kg-go{background:#f2c14e;border-color:#f2c14e;color:#1d1a0e}
.kg-upd button:focus-visible{outline:3px solid #f2c14e;outline-offset:2px}
@media (prefers-reduced-motion:reduce){.kg-upd{transition:none}}
</style>
<script id="kg-update">
// Kralnu Games update check. When you push an update, change the game's version
// AND version.json to the same new value; players then get a "new version" notice.
(function(){
  var NAME="Tight Lines",BUILD="0.12.1",CACHES=["tightlines-"],CHECK=true;
  var path=location.pathname,dir=path.replace(/[^/]*$/,''),last=0,bar=null,busy=false;
  if(/^\?v=\d+$/.test(location.search)){try{history.replaceState(history.state,'',path+location.hash)}catch(e){}}
  function build(){return String(window.kgBuild!=null?window.kgBuild:BUILD)}
  function skipped(v){try{return sessionStorage.getItem('kg-upd-skip')===v}catch(e){return false}}
  function hide(){if(!bar)return;var b=bar;bar=null;b.classList.remove('on');setTimeout(function(){b.remove()},400)}
  function note(html,buttons){hide();bar=document.createElement('div');bar.className='kg-upd';bar.setAttribute('role','status');
    bar.innerHTML='<span>'+html+'</span>'+buttons;document.body.appendChild(bar);
    var b=bar;requestAnimationFrame(function(){requestAnimationFrame(function(){b.classList.add('on')})});return b}
  function latest(){return fetch('version.json?t='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json()})}
  function now(){if(busy)return;busy=true;
    // Only clear the offline copy once we know the newest version can be downloaded.
    latest().then(function(){
      try{window.kgBeforeUpdate&&window.kgBeforeUpdate()}catch(e){}
      var jobs=[];
      try{if(navigator.serviceWorker&&navigator.serviceWorker.getRegistrations)jobs.push(navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.filter(function(r){return r.scope.indexOf(location.origin+dir)===0}).map(function(r){return r.unregister()}))}))}catch(e){}
      try{if(window.caches)jobs.push(caches.keys().then(function(ks){return Promise.all(ks.filter(function(k){return CACHES.some(function(p){return k.indexOf(p)===0})}).map(function(k){return caches.delete(k)}))}))}catch(e){}
      var done=false,go=function(){if(done)return;done=true;location.replace(path+'?v='+Date.now())};
      Promise.all(jobs).then(go,go);setTimeout(go,3000);
    },function(){busy=false;
      var b=note('No connection right now. Get online, then try again.','<button type="button" class="kg-later">OK</button>');
      b.querySelector('.kg-later').onclick=hide;setTimeout(function(){if(bar===b)hide()},6000);
    });
  }
  function show(v){if(bar||skipped(v))return;
    var b=note('A new version of '+NAME+' is ready.','<button type="button" class="kg-later">Later</button><button type="button" class="kg-go">Update</button>');
    b.querySelector('.kg-go').onclick=now;
    b.querySelector('.kg-later').onclick=function(){try{sessionStorage.setItem('kg-upd-skip',v)}catch(e){}hide()};
  }
  function check(force){if(!CHECK)return;var t=Date.now();if(!force&&t-last<6e5)return;last=t;
    latest().then(function(j){if(j&&j.version!=null&&String(j.version)!==build())show(String(j.version))}).catch(function(){})}
  document.addEventListener('click',function(e){var b=e.target&&e.target.closest&&e.target.closest('[data-get-latest]');if(!b)return;e.preventDefault();e.stopPropagation();now()},true);
  addEventListener('load',function(){setTimeout(function(){check(true)},4000)});
  document.addEventListener('visibilitychange',function(){if(!document.hidden)check(false)});
  setInterval(function(){if(!document.hidden)check(false)},18e5);
  window.KralnuUpdate={now:now,check:function(){check(true)},build:build};
})();
</script>
