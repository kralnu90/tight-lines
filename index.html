<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1c19">
<meta name="description" content="Tight Lines: a survival fishing adventure prototype by Kralnu Games.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tight Lines">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Tight Lines</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Alegreya+Sans:wght@400;500;700;800&display=swap">
<style>
/* Layout: one-screen game. Conditions strip, river canvas, angler's control panel underneath. Single committed riverbank look. */
:root{
  --ink:#0e1c19;
  --panel:#15302a;
  --panel-2:#1d3d35;
  --rule:#2e5a4e;
  --cream:#f0e7d0;
  --muted:#a7bbad;
  --brass:#dcaa48;
  --brass-deep:#9c6d24;
  --danger:#e3593c;
  --safe:#86b56f;
  --slack:#6f8a84;
  --display:"Alegreya SC", Georgia, "Times New Roman", serif;
  --body:"Alegreya Sans", "Trebuchet MS", Verdana, sans-serif;
  color-scheme: dark;
}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;background:var(--ink);color:var(--cream);font-family:var(--body);font-size:15px;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:8px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:8px}
.top{display:flex;align-items:center;gap:10px}
.brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.02em;color:var(--brass);line-height:1}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.lvl{margin-left:auto;white-space:nowrap;text-align:right;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:0}
.lvl b{color:var(--cream);font-weight:700}
.xpbar{height:4px;background:var(--panel-2);border-radius:2px;margin-top:3px;overflow:hidden;width:110px;margin-left:auto}
.xpbar i{display:block;height:100%;background:var(--brass);width:0}
.iconbtn{background:var(--panel);color:var(--cream);border:1px solid var(--rule);border-radius:10px;height:36px;padding:0 12px;font:600 13px var(--body);cursor:pointer}
.iconbtn:focus-visible,.big:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.conds{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:6px;align-items:end}
.cond.info b{line-height:1.2;font-size:12px;padding:4px 6px}
.cond{display:flex;flex-direction:column;gap:2px;min-width:0}
.cond label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.cond select{width:100%;background:var(--panel);color:var(--cream);border:1px solid var(--rule);border-radius:8px;padding:6px 6px;font:600 13px var(--body)}
.cond select:disabled{opacity:.55}
.cond .lab{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.cond.info b{display:block;background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:6px;font:600 13px var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.needs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.need{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.need .nb{height:6px;border-radius:3px;background:var(--panel-2);overflow:hidden;margin-top:3px}
.need .nb i{display:block;height:100%;background:var(--safe);width:100%}
.need.low{color:#ffb8a8}.need.low .nb i{background:var(--danger)}
.need.mid .nb i{background:#c9a34a}
.acts{display:flex;flex-direction:column;gap:6px}
.act{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--panel-2);border:1px solid var(--rule);border-radius:10px;padding:10px 12px;color:var(--cream);font:600 15px var(--body);text-align:left;cursor:pointer;width:100%}
.act small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:2px}
.act em{font-style:normal;color:var(--brass);font-size:12px;white-space:nowrap}
.act:disabled{opacity:.45;cursor:default}
.slot{background:var(--panel-2);border:1px solid var(--rule);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.slot b{font-size:16px}.slot small{color:var(--muted)}
.slot .controls .big{padding:10px;font-size:14px}
.hc{color:#ffb8a8;font-weight:700}
.mem{border-left:3px solid var(--brass-deep);padding:6px 10px;background:var(--panel-2);border-radius:0 8px 8px 0}
.mem b{display:block}.mem small{color:var(--muted)}
input[type=text]{width:100%;background:var(--panel-2);color:var(--cream);border:1px solid var(--rule);border-radius:8px;padding:10px;font:600 15px var(--body)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mode{display:flex;flex-direction:column;justify-content:flex-start;background:var(--panel-2);border:1px solid var(--rule);border-radius:10px;padding:10px;color:var(--cream);text-align:left;font:600 15px var(--body);cursor:pointer}
.mode small{display:block;color:var(--muted);font-weight:400;font-size:12px;margin-top:3px}
.mode.on{border-color:var(--brass);box-shadow:inset 0 0 0 1px var(--brass)}
.mode.hard.on{border-color:var(--danger);box-shadow:inset 0 0 0 1px var(--danger)}
.stage{position:relative;flex:1;min-height:200px;border-radius:14px;overflow:hidden;border:1px solid var(--rule);background:#22413f}
canvas{display:block;width:100%;height:100%;touch-action:none}
.toast{position:absolute;left:50%;top:14%;transform:translate(-50%,0);background:rgba(14,28,25,.82);border:1px solid var(--brass-deep);
  color:var(--cream);padding:8px 14px;border-radius:10px;font:700 16px var(--body);text-align:center;max-width:86%;pointer-events:none;
  opacity:0;transition:opacity .25s}
.toast.on{opacity:1}
.toast.warn{border-color:var(--danger);color:#ffd9cf}
.panel{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px}
.hint{color:var(--muted);font-size:14px;line-height:1.35}
.hint b{color:var(--cream)}
.odds{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--panel-2);border-radius:999px;padding:3px 10px;font-size:12px;font-variant-numeric:tabular-nums;color:var(--cream)}
.chip em{font-style:normal;color:var(--muted)}
.meter{display:grid;grid-template-columns:64px 1fr 56px;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.meter span:last-child{text-align:right;color:var(--cream)}
.bar{position:relative;height:12px;border-radius:6px;background:var(--panel-2);overflow:hidden}
.bar.tension{background:linear-gradient(90deg,var(--slack) 0 10%,var(--safe) 10% 82%,#c9a34a 82% 90%,var(--danger) 90%)}
.bar .fill{position:absolute;inset:0 auto 0 0;background:var(--brass);width:0}
.bar .needle{position:absolute;top:-2px;bottom:-2px;width:4px;margin-left:-2px;background:var(--cream);border-radius:2px;box-shadow:0 0 0 2px var(--ink);left:0}
.controls{display:flex;gap:8px}
.big{flex:1;border:0;border-radius:12px;padding:14px 10px;font:800 18px var(--body);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;touch-action:none}
.big.reel{background:var(--brass);color:#2a1d07;flex:1.4}
.big.reel.on{background:#f2c463;box-shadow:inset 0 3px 0 rgba(0,0,0,.25)}
.big.net{background:var(--panel-2);color:var(--muted);border:1px solid var(--rule)}
.big.net.ready{background:var(--safe);color:#10230c;border-color:var(--safe)}
.big.strike{background:var(--brass);color:#2a1d07}
.big.ghost{background:var(--panel-2);color:var(--cream);border:1px solid var(--rule);flex:0 0 auto;padding:14px 16px}
.overlay{position:fixed;inset:0;z-index:20;background:rgba(9,18,16,.78);display:flex;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.card{background:var(--panel);border:1px solid var(--brass-deep);border-radius:14px;padding:16px;width:100%;max-width:420px;display:flex;flex-direction:column;gap:10px;max-height:100%;overflow:auto}
.card h2{margin:0;font-family:var(--display);font-size:26px;color:var(--brass);line-height:1.1;text-wrap:balance}
.card p{margin:0;color:var(--cream);line-height:1.4}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;font-variant-numeric:tabular-nums}
.dice{display:flex;gap:12px;align-items:center;background:var(--panel-2);border:1px solid var(--rule);border-radius:10px;padding:10px;margin:8px 0}
.dice .die{flex:none;width:52px;height:52px;border-radius:10px;display:grid;place-items:center;font:700 26px var(--display);background:var(--panel);border:2px solid var(--muted);font-variant-numeric:tabular-nums}
.dice.win .die{border-color:var(--safe);color:var(--safe)}.dice.lose .die{border-color:var(--danger);color:var(--danger)}
.dice small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
#overlay .skbar{min-height:7px;height:7px;box-sizing:border-box;background:var(--panel-2);border:1px solid var(--rule);border-radius:3px;overflow:hidden;margin:4px 0}#overlay .skbar i{display:block;height:100%;min-height:5px;background:var(--brass)}
.sktable{display:grid;gap:2px;margin-bottom:6px}
.skrow{display:grid;grid-template-columns:28px 1fr auto;gap:8px;font-size:13px;padding:4px 6px;border-radius:6px;color:var(--muted)}
.skrow b{color:var(--cream);font-variant-numeric:tabular-nums}.skrow em{font-style:normal;font-size:11px;color:var(--muted)}
.skrow.got{background:var(--panel-2);color:var(--cream)}
.map{width:100%;height:auto;border-radius:10px;border:1px solid var(--rule);margin:6px 0 4px;display:block}
.map .mt{font:600 9px var(--body);fill:#f4ead0;text-anchor:middle;paint-order:stroke;stroke:#1d2b1c;stroke-width:3px}
.map .ml{font:700 11px var(--body);fill:#fff8e6;text-anchor:middle;paint-order:stroke;stroke:#1d2b1c;stroke-width:3px}
.map .mnode{cursor:pointer}.map .mnode.cur{cursor:default}.map .mnode:focus{outline:none}.map .mnode:focus rect,.map .mnode:focus circle{stroke:#f1c75b}
.jgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin:8px 0}
.jtile{text-align:left;background:var(--panel-2);border:1px solid var(--rule);border-radius:8px;padding:8px;color:var(--cream);font:inherit;cursor:pointer}
.jtile b{display:block;font-size:13px}.jtile small{display:block;color:var(--muted);font-size:11px;margin-top:2px}.jtile.unk b{color:var(--muted)}
.jrows{display:grid;gap:4px}.jrow{display:grid;grid-template-columns:96px 1fr;gap:8px;font-size:13px;padding:5px 6px;background:var(--panel-2);border-radius:6px}
.jrow span{color:var(--muted)}.jrow b{font-weight:600}.jrow i{font-style:normal;color:var(--rule)}.skrow.got em{color:var(--safe)}
.stats div{background:var(--panel-2);border-radius:8px;padding:6px 8px}
.stats small{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.stats b{font-size:16px}
.stars{color:var(--brass);font-size:20px;letter-spacing:2px}
.stars i{font-style:normal;color:var(--rule)}
.tag{display:inline-block;align-self:flex-start;background:var(--brass);color:#2a1d07;border-radius:6px;padding:2px 8px;font-weight:800;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.log{display:flex;flex-direction:column;gap:6px}
.logrow{display:grid;grid-template-columns:1fr auto;gap:2px 8px;background:var(--panel-2);border-radius:8px;padding:8px 10px;font-variant-numeric:tabular-nums}
.logrow b{font-size:15px}
.logrow small{color:var(--muted);font-size:12px}
.logrow .stars{font-size:14px;text-align:right}
.pbs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.pbs div{background:var(--panel-2);border-radius:8px;padding:6px 8px;font-size:12px;color:var(--muted)}
.pbs b{display:block;color:var(--cream);font-size:14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.row label{color:var(--cream)}
input[type=range]{width:55%;accent-color:var(--brass)}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--brass)}
.note{font-size:12px;color:var(--muted);line-height:1.4}
.danger-btn{background:transparent;color:#ffb8a8;border:1px solid var(--danger);border-radius:10px;padding:8px 12px;font:700 13px var(--body);cursor:pointer}
h3{margin:4px 0 0;font:700 12px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
@media (max-height:640px){.brand{font-size:19px}.big{padding:11px 8px;font-size:16px}.panel{padding:8px;gap:6px}}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
.conds{grid-template-columns:1.1fr 1.2fr 0.8fr}
.status{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;align-items:baseline}
.status b{color:var(--cream);font-weight:700}
.cond select{padding:6px 4px;font-size:12px}
.title-card{text-align:center;gap:12px}
.title-card h1{margin:0;font-family:var(--display);font-weight:700;font-size:44px;line-height:1;color:var(--brass);letter-spacing:.02em}
.title-card .sub{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.title-card .rule{height:1px;background:linear-gradient(90deg,transparent,var(--brass-deep),transparent);margin:2px 0}
.menu{display:flex;flex-direction:column;gap:8px}
.menu button,.menu a{display:block;width:100%;padding:13px 12px;border-radius:12px;border:1px solid var(--rule);background:var(--panel-2);color:var(--cream);font:700 16px var(--body);letter-spacing:.04em;cursor:pointer;text-decoration:none;text-align:center}
.menu .primary{background:var(--brass);color:#2a1d07;border-color:var(--brass)}
.menu button:disabled{opacity:.4;cursor:default}
.menu small{display:block;font-weight:500;font-size:12px;letter-spacing:0;margin-top:2px;opacity:.8}
.howto p{font-size:14px}
.howto dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 10px;font-size:14px}
.howto dt{font-weight:700;color:var(--brass)}
.howto dd{margin:0;color:var(--cream)}
.top .iconbtn[hidden]{display:none}
.iconbtn:disabled{opacity:.4;cursor:default}
.lbrow{display:grid;grid-template-columns:22px minmax(0,1fr) auto;grid-template-areas:"r w t" "r w s";gap:0 10px;align-items:center;background:var(--panel-2);border-radius:8px;padding:8px 10px;font-variant-numeric:tabular-nums}
.lbrow.me{box-shadow:inset 0 0 0 1px var(--brass)}
.lbrow .rank{grid-area:r;font:700 16px var(--display);color:var(--brass);text-align:center}
.lbrow .who{grid-area:w;min-width:0}.lbrow .who b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbrow small{display:block;color:var(--muted);font-size:12px}
.lbrow .wt{grid-area:t;text-align:right}.lbrow .stars{grid-area:s;font-size:13px;text-align:right}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="brand">Tight Lines<small id="who">Kralnu Games</small></div>
    <div class="lvl"><div>Fishing <b id="lvl">Lv 1</b> · <b id="bucks">0</b> FB</div><div id="xptext">0 / 50 XP</div><div class="xpbar"><i id="xpfill"></i></div></div>
    <button class="iconbtn" id="btnLog" type="button">Log</button>
    <button class="iconbtn" id="btnMenu" type="button">Menu</button>
  </header>

  <div class="status"><b id="cSpot">Willowmere River</b><span id="cDay">Spring · Day 1</span><span id="cTime">06:00 Dawn</span><span id="cWeather">Clear</span></div>
  <div class="conds">
    <div class="cond"><label for="selMethod">Method</label><select id="selMethod"></select></div>
    <div class="cond"><label for="selBait">Bait</label><select id="selBait"></select></div>
    <div class="cond"><label for="selLine">Line</label><select id="selLine"></select></div>
  </div>

  <div class="needs" id="needs" aria-label="Survival needs"></div>

  <div class="stage" id="stage">
    <canvas id="river" aria-label="Fishing scene. Drag down on the water to cast; during a fight drag left and right to move the rod."></canvas>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>

  <div class="panel" id="panel"></div>
</div>
<div class="overlay" id="overlay" hidden></div>

<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rand=(a,b)=>a+Math.random()*(b-a);
const lerp=(a,b,t)=>a+(b-a)*t;
const ALL=["Spring","Summer","Autumn","Winter"];

/* ---------- Data (matches Tight_Lines_Game_Data.xlsx) ---------- */
const RARITY={Common:100,Uncommon:30,Rare:8,"Very rare":2};
const SPOTS={
  river:{name:"Willowmere River",water:"River",travel:{tavern:60,lake:60,coast:120,saltwick:120},snagSide:-1,snagName:"snags",snagLose:"Snagged in the tree roots",flow:1},
  lake:{name:"Willowmere Lake",water:"Lake",travel:{tavern:60,river:60,coast:150,saltwick:150},snagSide:1,snagName:"weed",snagLose:"Lost in the weed bed",flow:0},
  coast:{name:"Saltmarsh Point",water:"Coast",travel:{tavern:120,river:120,lake:150,saltwick:30},snagSide:-1,snagName:"rocks",snagLose:"Cut off on the rocks",flow:0,salt:true}
};
const METHODS={
  Float:{lvl:1,baits:["Maggots","Bread","Worm","Sweetcorn","Ragworm"]},
  Ledger:{lvl:5,baits:["Worm","Pellets","Boilies","Sweetcorn","Deadbait","Lugworm","Ragworm","Squid","Peeler crab"]},
  Spinning:{lvl:10,baits:["Spinner","Soft lure","Big lure","Feathers"]},
  Fly:{lvl:15,baits:["Dry fly","Nymph"]}
};
const F_=(o)=>Object.assign({jump:0,switchy:0.5,nibbles:[0,2],strikeWin:1,speed:1},o);
const FISH=[
  // River
  F_({id:"dace",name:"Dace",water:"River",rarity:"Common",seasons:ALL,times:["Day"],methods:["Float"],baits:["Maggots"],min:0.1,max:0.5,lenK:31,pull:0.55,stam:0.9,speed:1.15,switchy:0.75,strikeWin:0.7,nibbles:[1,3],fights:"Quick little darts, easy"}),
  F_({id:"chub",name:"Chub",water:"River",rarity:"Common",seasons:["Summer"],times:["Day","Dusk"],methods:["Float","Ledger"],baits:["Bread"],min:1,max:5,lenK:31,pull:0.88,stam:1.6,speed:0.95,switchy:0.3,dash:true,strikeWin:1.1,fights:"One hard dash for the snags, then tires"}),
  F_({id:"trout",name:"Brown trout",water:"River",rarity:"Uncommon",seasons:["Spring","Summer"],times:["Dawn","Dusk"],methods:["Spinning","Fly"],baits:["Spinner","Dry fly"],min:0.5,max:4,lenK:32,pull:0.82,stam:1.8,speed:1.25,jump:0.28,strikeWin:0.9,nibbles:[0,1],spooky:true,fights:"Darting runs and the odd jump"}),
  F_({id:"grayling",name:"Grayling",water:"River",rarity:"Uncommon",seasons:["Autumn","Winter"],times:["Day"],weather:["Clear"],methods:["Fly","Float"],baits:["Nymph","Worm"],min:0.5,max:2,lenK:33,pull:0.72,stam:1.2,switchy:0.85,twist:true,strikeWin:0.6,spooky:true,fights:"Twists and uses its big fin against the current"}),

/* ---------- Settings (per browser) ---------- */
const KEY="tightlines-proto-v1";
let save={settings:{sens:1,debug:false,strict:1,unlockAll:false}};
try{const raw=localStorage.getItem(KEY);if(raw){const s=JSON.parse(raw);save.settings=Object.assign(save.settings,s.settings||{});
  if(s.tuneV!==4){save.settings.unlockAll=false;}}}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify({settings:save.settings,tuneV:4}));}catch(e){}}

let run=null;
function levelInfo(xp){let L=1,acc=0;while(L<50&&xp>=acc+xpToNext(L)){acc+=xpToNext(L);L++;}return {L,into:xp-acc,need:L<50?xpToNext(L):0};}
function level(){return levelInfo(run?run.xp:0).L;}
function renderLevel(){const i=levelInfo(run?run.xp:0);$("#lvl").textContent="Lv "+i.L;
  $("#xptext").textContent=i.need?`${i.into} / ${i.need} XP`:"Max level";$("#xpfill").style.width=(i.need?i.into/i.need*100:100)+"%";}

/* ---------- Conditions & bite odds ---------- */
function tod(min){const h=min/60;return h>=5&&h<8?"Dawn":h>=8&&h<18?"Day":h>=18&&h<21?"Dusk":"Night";}
function spotKey(){return run&&SPOTS[run.loc]?run.loc:(run&&run.lastSpot)||"river";}
function spot(){return SPOTS[spotKey()];}

function have(b){if(!run)return 99;return LURES[b]!==undefined?(run.inv.lures[b]||0):(run.inv.bait[b]||0);}
function fillBaits(){const sel=$("#selBait"),cur=sel.value;const list=METHODS[$("#selMethod").value].baits;

function biteWeights(c,q){return FISH.filter(f=>f.water===c.water&&!f.methods.includes("Pot")).map(f=>{let w=RARITY[f.rarity];
  w*=f.seasons.includes(c.season)?2:0.1;
  if(f.times.includes(c.time))w*=1.5;
  const mOk=f.methods.includes(c.method),bOk=f.baits.includes(c.bait);
  w*=mOk&&bOk?2:mOk?0.4:bOk?0.3:0.05;
  if(f.weather&&f.weather.includes(c.weather))w*=1.5;
  const WX={Windy:{bass:1.6,pollock:1.3,mackerel:1.3,pike:1.2},Fog:{pike:1.4,zander:1.5,perch:1.3,carp:1.3,eel:1.3}};
  if(WX[c.weather]&&WX[c.weather][f.id])w*=WX[c.weather][f.id];

function pickFish(c,q){const ws=biteWeights(c,q);const tot=ws.reduce((a,b)=>a+b.w,0);let r=Math.random()*tot;
  for(const x of ws){if((r-=x.w)<=0)return x.f;}return ws[0].f;}

  for(let x=-20;x<=W+20;x+=rand(9,16))canopy.push([x,g.waterTop-rand(H*0.025,H*0.07),rand(8,15)]);

  for(let i=0;i<70;i++)streaks.push({x:rand(0,W),t:Math.random(),l:rand(10,34)});
  for(let i=0;i<5;i++)clouds.push({x:rand(0,W),y:rand(H*0.025,g.waterTop*0.62),w:rand(45,95),s:rand(3,7)});

    for(let k=0;k<n;k++){const an=Math.PI+k/(n-1)*Math.PI;q.push([Math.cos(an)*r*rand(0.8,1.05),Math.sin(an)*r*rand(0.45,0.95)]);}q.push([r,r*0.12]);rocks.push({t,r,pts:q,dx:rand(-0.04,0.05)});}
  for(let i=0;i<12;i++){const t=rand(0.03,0.85);reedBed.push({t,n:Math.floor(rand(5,10)),h:lerp(72,26,t)*rand(0.8,1.2),off:rand(0.03,0.22),ph:rand(0,6)});}

  for(let i=0;i<12;i++){const t=rand(0.03,0.9);weed.push({t,off:rand(0,0.2),r:lerp(46,16,t)*rand(0.7,1.3)});}
  for(let i=0;i<26;i++)glints.push({x:rand(0,W),y:Math.random(),ph:rand(0,6.28)});
  for(let i=0;i<Math.floor(W/9);i++)tufts.push([rand(0,W),Math.random(),rand(6,14)]);
  scen={pts,hills,reeds,streaks,pads,clouds,canopy,fronds,roots,rocks,reedBed,weed,glints,tufts};

const MAXD=40;
function toScreen(D,X){const g=geom();const t=clamp(D/MAXD,0,1);
  const y=lerp(g.nearY-20,g.waterTop+16,Math.pow(t,0.85));const spread=W*(0.44-0.18*t);
  return {x:W/2+X*spread,y,scale:1-0.55*t};}
function rodBase(){return {x:W/2,y:H+12};}
function rodTip(){return {x:W/2+G.R*W*0.24,y:H*0.7};}

/* ---------- Fishing flow ---------- */
function toReady(msg,warn){
  hideOverlay();headerButtons(true);
  G.state="ready";G.fish=null;G.cast=null;G.float=null;G.reeling=false;G.R=0;G.aim=null;
  setCondsEnabled(true);fillMethods();panelReady();if(msg)toast(msg,warn,2200);
}
function rodFor(m){if(!run)return GEAR.willow;return GEAR[m==="Fly"?run.equip.fly:run.equip.rod]||GEAR.willow;}
function reelNow(){return run?GEAR[run.equip.reel]||GEAR.tin:GEAR.tin;}
function castRange(m){const b={Float:[6,24],Ledger:[10,28],Spinning:[8,26],Fly:[4,14]}[m];return [b[0],b[1]+rodFor(m).cast];}
function startCast(q,power,aim){
  const cb=conds().bait;
  if(run&&!have(cb)){toast(`You're out of ${cb.toLowerCase()}. Restock at a tackle shop in town.`,true,2400);return;}
  if(run&&LURES[cb]===undefined){run.inv.bait[cb]--;}
  if(run){run.needs.stam=Math.max(0,run.needs.stam-1.5);if(run.needs.stam<20)power*=0.75;}
  const m=conds().method,[d0,dr]=castRange(m);const D=d0+power*dr;
  G.cast={q,D,aim,t:0,from:rodTip(),method:m};
  G.state="flight";setCondsEnabled(false);
  $("#panel").innerHTML=`<div class="hint">Casting…</div>`;
  const pct=Math.round(q*100);
  if(pct>=99)toast("PERFECT CAST · 100%",false,1800);
  else if(q<0.35)toast(`Messy cast · ${pct}%. The splash spooks the swim.`,true,2000);
  else toast(`Cast · ${pct}%`,false,1200);
}
// What the float does before the take: a random run of dips, trembles, bobs, slides and false bites
// (which look nearly like a take), with uneven gaps. Takes can be a plunge, a slide-away or a lift (bottom feeders).
function floatPlan(f,start,method){
  const n=Math.floor(rand(f.nibbles[0],f.nibbles[1]+2.999));
  const types=method==="Fly"?[["nose",4],["swirl",2],["false",1.5]]:[["dip",4],["tremble",3],["bob",2],["false",1.6],["slide",1.2]];
  const DUR={dip:[.4,.8],tremble:[.7,1.6],bob:[.9,1.5],false:[.45,.75],slide:[1.2,2.4],nose:[.5,1],swirl:[.6,1]};
  let t=start;const moves=[];
  for(let i=0;i<n;i++){const ty=pickW(types.map(([k,w])=>({k,w}))).k,d=rand(DUR[ty][0],DUR[ty][1]);
    moves.push({t0:t,dur:d,type:ty,amp:ty==="false"?rand(.85,1):ty==="dip"?rand(.35,.9):1,dir:Math.random()<.5?-1:1});
    t+=d+(Math.random()<0.22?rand(2,5):rand(0.25,1.6));}
  let takeType="under";
  if(method==="Float"){const lifty=f.sluggish||["tench","bream"].includes(f.id),r=Math.random();
    takeType=r<(lifty?0.4:0.1)?"lift":r<(lifty?0.6:0.35)?"sail":"under";}
  if(takeType==="sail"){const d=rand(.7,1.4);moves.push({t0:t,dur:d,type:"slide",amp:1,dir:Math.random()<.5?-1:1});t+=d;}
  return {moves,take:t,takeType};}
function landFloat(){
  const c=G.cast;const s=toScreen(c.D,c.aim);
  G.ripples.push({x:s.x,y:s.y,r:2,a:0.9,sc:s.scale});
  const q=c.q;let wait=rand(2.5,7)*(1.35-0.6*q)*(q<0.35?1.5:1);
  if(c.method==="Spinning")wait=rand(1.5,6)*(1.25-0.5*q);
  if(run&&(run.chumUntil||0)>absMin())wait*=0.6;
  const f=pickFish(conds(),q);
  const n=Math.floor(rand(f.nibbles[0],f.nibbles[1]+0.999));
  const nib=[];let t=wait;for(let i=0;i<n;i++){nib.push(t);t+=rand(0.7,1.5);}
  let win=f.strikeWin;if(c.method==="Ledger")win*=1.3;if(c.method==="Fly")win=Math.min(win,0.6);
  if(c.method==="Spinning")G.float={method:c.method,D:c.D,X:c.aim,t:0,nibbles:nib,take:t,fish:f,dip:0,under:false,win};
  else{const plan=floatPlan(f,wait,c.method);
    G.float={method:c.method,D:c.D,X:c.aim,t:0,moves:plan.moves,take:plan.take,takeType:plan.takeType,fish:f,dip:0,under:false,win:win*(plan.takeType==="lift"?1.25:1)};}
  G.lastNibble=-9;
  G.state="waiting";panelWaiting();
}
function strike(){
  if(G.state!=="waiting")return;const fl=G.float;
  if(fl.method==="Spinning")return;
  if(fl.under){if(fl.t-fl.take<=fl.win){hook(fl.fish);return;}}
  if(fl.t-G.lastNibble<0.5){toReady(fl.method==="Fly"?"Too early. It saw you and bolted.":"Struck too early. You spooked it.",true);return;}
  toReady("Nothing on. Recast.");
}
function hook(f){
  const r=Math.random();const w=f.min+(f.max-f.min)*Math.pow(r,2);const s=(w-f.min)/(f.max-f.min);
  const fl=G.float;const side=spot().snagSide;
  G.fish={f,w,s,D:fl.D,X:fl.X,S:1,T:0.3,dir:Math.random()<0.5?-1:1,mode:"rest",modeT:0.4,modePull:0.3,
    pullScale:f.pull*(0.75+0.5*s)*1.1,stamPool:f.stam*(0.75+0.6*s)*diff().stam,snapT:0,slackT:0,tangle:0,air:0,t:0,with:0,ang:0,vx:0,vd:0};
  if(f.dash){Object.assign(G.fish,{mode:"dash",dir:side,modeT:2.1,modePull:1.25});}
  G.state="fight";G.float=null;G.R=0;G.reeling=false;panelFight();
  const p=toScreen(fl.D,fl.X);G.ripples.push({x:p.x,y:p.y,r:4,a:1,sc:1});
  toast(f.dash?`Fish on! It's heading for the ${spot().snagName}!`:fl.method==="Spinning"?"Whack! Fish on!":"Fish on!",f.dash,1500);
}
function nextMode(F){
  const f=F.f;
  if(f.jump&&Math.random()<f.jump*(0.4+F.S)){F.mode="jump";F.modeT=1.1;F.modePull=0.65;toast("It's jumping! Ease off!",true,1100);return;}
  if(f.twist&&Math.random()<0.35){F.mode="twist";F.modeT=rand(1,1.8);F.modePull=0.8;toast("It's turning side-on in the current!",true,1100);return;}
  if(f.roll&&Math.random()<0.35){F.mode="roll";F.modeT=rand(1.2,2);F.modePull=0.7;toast("It's rolling! Keep the line tight",true,1100);return;}
  if(f.surges&&Math.random()<0.25){F.mode="run";F.modeT=rand(0.5,0.9);F.modePull=1.3;toast("Sudden surge!",true,900);return;}
  if(f.shaky&&Math.random()<0.45){F.mode="shake";F.modeT=rand(0.6,1.2);F.modePull=0.75;return;}
  // bolting straight away from the angler: more likely once it's close and still has fight in it
  if(F.S>0.12&&Math.random()<0.28*(F.D<10?1.6:1)*(0.25+0.75*F.S)){F.mode="bolt";F.modeT=rand(1,2.4)*(f.longRuns?1.4:1);F.modePull=rand(1.15,1.45);F.kick=0.45;toast("It's bolting away from you!",true,1000);return;}
  if(Math.random()<0.55*(0.35+0.65*F.S)){F.mode="run";F.modeT=f.dives?rand(0.4,0.9):rand(0.8,2.4);F.modePull=rand(0.7,1.05);
    if(Math.random()<f.switchy)F.dir=-F.dir;return;}

/* ---------- Simulation ---------- */
let lastWarn=0;
function update(dt){

  const kx=(G.keys.right?1:0)-(G.keys.left?1:0);

  G.ripples.forEach(r=>{r.r+=dt*28;r.a-=dt*0.7;});G.ripples=G.ripples.filter(r=>r.a>0);

  if(G.state==="flight"){G.cast.t+=dt/0.7;if(G.cast.t>=1)landFloat();return;}
  if(G.state==="waiting"){const fl=G.float;
    if(fl.method==="Spinning"){
      if(G.reeling){fl.t+=dt;fl.D-=1.6*dt*(run&&run.needs.stam<20?0.7:1);}
      while(fl.nibbles.length&&fl.t>=fl.nibbles[0]){fl.nibbles.shift();fl.dip=1;const s=toScreen(fl.D,fl.X);G.ripples.push({x:s.x,y:s.y,r:1,a:0.5,sc:s.scale});toast("Something's following it…",false,900);}
      fl.dip=Math.max(0,fl.dip-dt*3);

    fl.t+=dt;

      if(m.type==="dip")dy=m.amp*Math.sin(Math.PI*p);

      else if(m.type==="bob")dy=0.55*Math.abs(Math.sin(p*Math.PI*3));
      else if(m.type==="false")dy=m.amp*1.35*(p<0.55?p/0.55:(1-p)/0.45);

      else dy=0.1;}
    fl.dip=Math.max(0,dy);
    if(!fl.under&&fl.t>=fl.take){fl.under=true;const s=toScreen(fl.D,fl.X);G.ripples.push({x:s.x,y:s.y,r:2,a:1,sc:s.scale});
      if(fl.method==="Fly")G.ripples.push({x:s.x,y:s.y,r:5,a:1,sc:s.scale});}
    if(fl.under&&fl.t-fl.take>fl.win)toReady(fl.method==="Fly"?"Too slow. It spat the fly.":"Too slow. It stole your bait.",true);
    return;}
  if(G.state!=="fight")return;

  const F=G.fish,f=F.f;F.t+=dt;const side=spot().snagSide;
  F.modeT-=dt;if(F.modeT<=0){if(F.mode==="dash")toast("It's tiring",false,900);nextMode(F);}
  let modePull=F.modePull;

  if(F.mode==="twist"){if(Math.random()<dt*4)F.dir=-F.dir;if(F.dir>0)modePull+=0.25;}

    if(F.f.id==="trout"){ctx.fillStyle="rgba(120,40,30,.8)";for(let k=0;k<6;k++)ctx.fillRect(-len*0.25+k*len*0.09,-th*0.3+(k%2)*th*0.4,1.6,1.6);}}
  ctx.restore();
  if(airborne)G.ripples.push({x:s.x,y:s.y,r:2,a:0.3,sc:s.scale});
  if(F.mode!=="rest"){ctx.fillStyle=["dash","roll","twist"].includes(F.mode)?"rgba(227,89,60,.9)":"rgba(240,231,208,.75)";const cx=s.x+F.dir*(len*0.75+10),cy=s.y-12*s.scale;
    ctx.beginPath();ctx.moveTo(cx+F.dir*7,cy);ctx.lineTo(cx-F.dir*3,cy-6);ctx.lineTo(cx-F.dir*3,cy+6);ctx.closePath();ctx.fill();}

function drawFloat(x,y,fs,bob,tilt){

  if(tilt){ctx.translate(x,y+bob-6*fs);ctx.rotate(tilt);ctx.translate(-x,-(y+bob-6*fs));}
  ctx.strokeStyle="#2b2b2b";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,y+bob);ctx.lineTo(x,y-16*fs+bob);ctx.stroke();
  ctx.fillStyle="#e3593c";ctx.beginPath();ctx.ellipse(x,y-15*fs+bob,1.8*fs+0.8,3*fs+1,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#c68a3c";ctx.beginPath();ctx.ellipse(x,y-6*fs+bob,2.6*fs+1,5*fs+1.5,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="rgba(255,255,255,.35)";ctx.fillRect(x-1.5*fs,y-9*fs+bob,1,4*fs);

function drawTackle(){
  const b=rodBase();let tip=rodTip();let end=null,tension=0.15,show=true;
  if(G.state==="ready"&&G.aim){const p=aimPower();tip={x:tip.x-G.aim.dx*0.08,y:tip.y+p*H*0.12};show=false;}
  if(G.state==="flight"){const c=G.cast,tgt=toScreen(c.D,c.aim),k=c.t;
    end={x:lerp(c.from.x,tgt.x,k),y:lerp(c.from.y,tgt.y,k)-Math.sin(k*Math.PI)*H*0.25};tension=0.1;}
  if(G.state==="waiting"){const fl=G.float,s=toScreen(fl.D,fl.X),fs=s.scale;end={x:s.x,y:s.y};tension=0.08;
    if(fl.method==="Float"&&(!fl.under||fl.takeType==="lift")){const k=fl.under?Math.min(1,(fl.t-fl.take)/0.35):0;

      if(Math.sin(G.t*14)>0.6){ctx.fillStyle="rgba(255,255,255,.9)";ctx.fillRect(s.x+wob-1,s.y-4,2,2);}
      if(fl.dip>0){ctx.fillStyle="rgba(10,22,20,.4)";ctx.beginPath();ctx.ellipse(s.x-14*fs,s.y+4,10*fs,3*fs,0,0,Math.PI*2);ctx.fill();}}
    if(fl.method==="Fly"&&!fl.under){const bob=Math.sin(G.t*3)*0.8;ctx.fillStyle="#f6e7b0";ctx.beginPath();ctx.arc(s.x,s.y-2+bob,2.2*fs+1,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle="rgba(246,231,176,.8)";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(s.x-5*fs,s.y-4+bob);ctx.lineTo(s.x+5*fs,s.y+bob);ctx.moveTo(s.x-5*fs,s.y+bob);ctx.lineTo(s.x+5*fs,s.y-4+bob);ctx.stroke();}}
  if(G.state==="fight"&&G.fish){const s=toScreen(G.fish.D,G.fish.X);end={x:s.x,y:s.y-G.fish.air*40*s.scale};tension=G.fish.T;}
  let ctrl={x:lerp(b.x,tip.x,0.5),y:lerp(b.y,tip.y,0.5)};
  if(end){tip={x:tip.x+(end.x-tip.x)*0.06*tension,y:tip.y+(end.y-tip.y)*0.05*tension+tension*18};ctrl.x+=(end.x-ctrl.x)*0.05*tension;}
  const at=k=>{const u=1-k;return {x:u*u*b.x+2*u*k*ctrl.x+k*k*tip.x,y:u*u*b.y+2*u*k*ctrl.y+k*k*tip.y};};
  if(end&&show){ctx.strokeStyle=tension>0.9?"rgba(255,170,150,.95)":"rgba(240,236,220,.8)";ctx.lineWidth=1;
    const mx=(tip.x+end.x)/2,my=(tip.y+end.y)/2+(1-clamp(tension,0,1))*40;ctx.beginPath();ctx.moveTo(tip.x,tip.y);ctx.quadraticCurveTo(mx,my,end.x,end.y);ctx.stroke();}
  ctx.lineCap="round";
  // blank, from thick butt to fine tip
  const segs=[[0,0.22,7,"#7a5a34"],[0.22,0.5,5,"#3a2716"],[0.5,0.78,3.6,"#4a3220"],[0.78,1,2.2,"#5b3a1c"]];
  for(const [a,z,wd,col] of segs){ctx.strokeStyle=col;ctx.lineWidth=wd;ctx.beginPath();const p0=at(a);ctx.moveTo(p0.x,p0.y);for(let k=a+0.04;k<=z+0.001;k+=0.04){const p=at(Math.min(k,z));ctx.lineTo(p.x,p.y);}ctx.stroke();}
  ctx.strokeStyle="rgba(255,255,255,.12)";ctx.lineWidth=1;ctx.beginPath();for(let k=0.24;k<=0.98;k+=0.04){const p=at(k);k<0.25?ctx.moveTo(p.x-1,p.y):ctx.lineTo(p.x-1,p.y);}ctx.stroke();
  // cork grip rings and line guides
  ctx.strokeStyle="rgba(60,40,20,.5)";ctx.lineWidth=1;for(let k=0.03;k<0.2;k+=0.035){const p=at(k);ctx.beginPath();ctx.moveTo(p.x-3.5,p.y);ctx.lineTo(p.x+3.5,p.y);ctx.stroke();}
  ctx.strokeStyle="#c9c3b5";ctx.lineWidth=1;for(const k of [0.5,0.66,0.8,0.91]){const p=at(k);ctx.beginPath();ctx.arc(p.x,p.y,1.8,0,Math.PI*2);ctx.stroke();}
  ctx.fillStyle="#e3593c";const tp=at(1);ctx.beginPath();ctx.arc(tp.x,tp.y,1.4,0,Math.PI*2);ctx.fill();
  if(G.state==="waiting"&&G.float.method==="Ledger"){ctx.strokeStyle="#e3593c";ctx.lineWidth=2.5;ctx.beginPath();const q=at(0.86);ctx.moveTo(q.x,q.y);ctx.lineTo(tp.x,tp.y);ctx.stroke();}
  // reel
  const rp=at(0.24);ctx.fillStyle="#2a2a2a";ctx.beginPath();ctx.arc(rp.x+7,rp.y+2,7,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle="#dcaa48";ctx.lineWidth=2;ctx.beginPath();ctx.arc(rp.x+7,rp.y+2,7,0,Math.PI*2);ctx.stroke();
  ctx.strokeStyle="#9a9a9a";ctx.lineWidth=1.5;const ra=G.reeling?G.t*14:0.6;ctx.beginPath();ctx.moveTo(rp.x+7,rp.y+2);ctx.lineTo(rp.x+7+Math.cos(ra)*8,rp.y+2+Math.sin(ra)*8);ctx.stroke();
  ctx.fillStyle="#d8d0bd";ctx.beginPath();ctx.arc(rp.x+7+Math.cos(ra)*8,rp.y+2+Math.sin(ra)*8,1.8,0,Math.PI*2);ctx.fill();
  ctx.lineCap="butt";
}
function aimPower(){return G.aim?clamp(G.aim.dy/(H*0.4),0,1):0;}
function aimTiming(){if(!G.aim)return 0;const e=(performance.now()-G.aim.t0)/1000;const per=run&&run.needs.warm<25?0.8:1.2;return (1-Math.cos(2*Math.PI*e/per))/2;}
function drawAim(){
  const p=Math.max(0.12,aimPower()),aim=clamp(-G.aim.dx/(W*0.35),-1,1)*0.9;const [d0,dr]=castRange(conds().method);const D=d0+p*dr;const tgt=toScreen(D,aim);const from=rodTip();
  ctx.setLineDash([4,6]);ctx.strokeStyle="rgba(255,255,255,.55)";ctx.lineWidth=1.5;ctx.beginPath();
  ctx.moveTo(from.x,from.y);ctx.quadraticCurveTo((from.x+tgt.x)/2,Math.min(from.y,tgt.y)-H*0.25,tgt.x,tgt.y);ctx.stroke();ctx.setLineDash([]);
  ctx.strokeStyle="rgba(220,170,72,.95)";ctx.beginPath();ctx.ellipse(tgt.x,tgt.y,10*tgt.scale+4,4*tgt.scale+2,0,0,Math.PI*2);ctx.stroke();
  const m=aimTiming(),bw=W*0.62,bx=(W-bw)/2,by=H-34;
  ctx.fillStyle="rgba(14,28,25,.75)";ctx.fillRect(bx-8,by-20,bw+16,36);
  ctx.fillStyle="#2e5a4e";ctx.fillRect(bx,by,bw,8);ctx.fillStyle="#dcaa48";ctx.fillRect(bx+bw*0.94,by,bw*0.06,8);
  ctx.fillStyle="#f0e7d0";ctx.fillRect(bx+bw*m-2,by-4,4,16);
  ctx.font="700 11px 'Alegreya Sans', sans-serif";ctx.fillStyle="#a7bbad";ctx.fillText(`SWING · ${Math.round(D)} m`,bx,by-7);
  ctx.textAlign="right";ctx.fillText("release here",bx+bw,by-7);ctx.textAlign="left";
}

  const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;

  if(G.state==="ready"){G.aim={x0:x,y0:y,dx:0,dy:0,t0:performance.now(),id:e.pointerId};}

cv.addEventListener("pointermove",e=>{
  const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
  if(G.state==="ready"&&G.aim&&G.aim.id===e.pointerId){G.aim.dx=x-G.aim.x0;G.aim.dy=y-G.aim.y0;}
  else if(G.state==="fight"&&!save.settings.tilt&&(e.buttons||e.pointerType==="touch")){G.R=clamp((x-W/2)/(W*0.32)*save.settings.sens,-1,1);}
});

  if(G.state==="ready"&&G.aim&&G.aim.id===e.pointerId){

/* ---------- Survival: clock, needs, saves ---------- */
const TIME_RATE=1; // in-game minutes per real second
const SKEY="tightlines-saves-v1";
let store={slots:[null,null,null],memorial:[]};
try{const raw=localStorage.getItem(SKEY);if(raw){const s=JSON.parse(raw);store=Object.assign(store,s);}}catch(e){}
function saveStore(){try{localStorage.setItem(SKEY,JSON.stringify(store));}catch(e){}}
let hudT=0,oddsKey="";
function condKey(){const c=conds();return c.season+c.time+c.weather+spotKey();}
function absMin(){return run?(run.day-1)*1440+run.min:0;}
function clock(m){const h=Math.floor(m/60)%24,mm=Math.floor(m%60);return String(h).padStart(2,"0")+":"+String(mm).padStart(2,"0");}
function pickWeather(season){const wet=season==="Autumn"||season==="Winter";
  return pickW([{k:"Clear",w:wet?34:50},{k:"Overcast",w:22},{k:"Rain",w:wet?20:12},{k:"Windy",w:wet?14:11},{k:"Fog",w:wet?10:5}]).k;}
function newRun(slot,name,hardcore){return withKit(newRunBase(slot,name,hardcore));}
function newRunBase(slot,name,hardcore){
  return {slot,name,hardcore,day:1,min:6*60,weather:"Clear",weatherIn:300,loc:"tavern",lastSpot:"river",
    needs:{food:90,warm:90,stam:100,health:100,thirst:100},water:3,ill:0,fire:0,keep:[],xp:0,log:[],away:0,cause:""};}
function snapshot(){return JSON.parse(JSON.stringify(run));}
function saveTavern(){if(!run)return;const sl=store.slots[run.slot];if(!sl)return;sl.tavern=snapshot();sl.hardcore=run.hardcore;sl.suspend=null;sl.played=Date.now();saveStore();}
function suspend(){if(!run||!store.slots[run.slot]||G.state==="dead"||G.state==="menu")return;
  const snap=snapshot();store.slots[run.slot].suspend=snap;store.slots[run.slot].played=Date.now();saveStore();}

  if(document.visibilityState==="hidden")suspend();
  else if(run&&store.slots[run.slot]&&store.slots[run.slot].suspend&&G.state!=="menu"){store.slots[run.slot].suspend=null;saveStore();}});

function advance(mins,opt){
  if(!run||mins<=0)return;opt=opt||{};
  while(mins>0){const m=Math.min(mins,10);mins-=m;const h=m/60;const N=run.needs;
    run.min+=m;if(run.min>=1440){run.min-=1440;run.day++;if((run.day-1)%10===0)toast(`A new season: ${conds().season}`,false,2200);dailyMarket();}
    run.weatherIn-=m;if(run.weatherIn<=0){run.weather=pickWeather(conds().season);if(run.weather==="Windy")run.windDir=Math.random()<0.5?-1:1;run.weatherIn=rand(180,480);}
    run.away+=m;
    const NM=diff().needs;
    if(NM===0){Object.assign(N,{food:100,warm:100,stam:100,health:100,thirst:100});run.water=maxWater();run.ill=0;if(run.inj)run.inj={};
      if(run.fire>0)run.fire=Math.max(0,run.fire-m);for(const id in run.market){run.market[id]=Math.max(0,run.market[id]-m/720);}continue;}
    const c=conds();
    let dw={Dawn:-2,Day:4,Dusk:-2,Night:-7}[c.time];
    if(c.weather==="Rain")dw-=4;else if(c.weather==="Windy")dw-=3;else if(c.weather==="Overcast"||c.weather==="Fog")dw-=1;
    dw+={Spring:-1,Summer:2,Autumn:-1,Winter:-4}[c.season];
    if(run.loc==="coast")dw-=1;
    if(run.fire>0){dw+=18;run.fire=Math.max(0,run.fire-m);}
    if(opt.camper)dw=Math.max(dw,6);
    if(dw<0){dw*=NM;if(run.inj&&run.inj.chill)dw*=1.3;if(run.inv.gear.jacket)dw*=0.7;if(opt.sleep&&run.inv.gear.bedroll)dw*=0.55;}
    N.warm=clamp(N.warm+dw*h,0,100);
    for(const id in run.market){run.market[id]=Math.max(0,run.market[id]-m/720);}
    N.food=clamp(N.food-(opt.sleep?2.2:3.6)*NM*(run.ill>0?1.3:1)*h,0,100);
    if(opt.sleep)N.stam=clamp(N.stam+13*h,0,100);
    else if(opt.rest)N.stam=clamp(N.stam+15*h,0,100);
    else N.stam=clamp(N.stam-(N.food<25?3.5:2)*NM*(run.inj&&run.inj.sprain?1.4:1)*h,0,100);
    run.water=Math.max(0,run.water-m/1440*NM);
    if(run.water<=0)N.thirst=clamp(N.thirst-6*NM*h,0,100);
    if(run.ill>0)run.ill=Math.max(0,run.ill-m);
    let dmg=0;if(N.food<=0)dmg+=6;if(N.warm<=0)dmg+=8;if(N.thirst<=0)dmg+=8;if(run.ill>0)dmg+=2;
    if(dmg)N.health=clamp(N.health-dmg*h,0,100);
    else if(N.food>40&&N.warm>40&&N.thirst>40&&!(run.inj&&run.inj.wound))N.health=clamp(N.health+2.2*(run.inj&&run.inj.ribs?0.5:1)*h,0,100);
    if(run.inj)tickInjuries(m,opt);
    if(N.health<=0){run.cause=N.warm<=0?"the cold":N.thirst<=0?"thirst":N.food<=0?"hunger":"illness";break;}
  }
  checkJobs();
}
function checkDeath(){if(run&&run.needs.health<=0&&G.state!=="dead"){die();return true;}return false;}

let warnT=0;
function renderHud(){
  const c=conds();
  $("#cSpot").textContent=run&&isTown(run.loc)?TOWNS[run.loc].inn:spot().name;
  $("#cDay").textContent=`${c.season} · Day ${run?((run.day-1)%10)+1:1}`;
  $("#cTime").textContent=`${clock(run?run.min:390)} ${c.time}`;
  $("#cWeather").textContent=c.weather;
  $("#bucks").textContent=run?run.bucks:0;
  $("#who").textContent=run?`${run.name} · ${diff().name}${run.hardcore?" · Hardcore":""}`:"Kralnu Games";
  if(!run){$("#needs").innerHTML="";return;}
  if(diff().needs===0){$("#needs").innerHTML='<div class="need" style="grid-column:1/-1">Easy mode · needs are off. Just fish.</div>';return;}
  const N=run.needs;
  const items=[["Food",N.food],["Warmth",N.warm],["Energy",N.stam],["Health",N.health],[run.water>0?"Water":"Thirst",run.water>0?run.water/maxWater()*100:N.thirst]];
  $("#needs").innerHTML=items.map(([n,v])=>`<div class="need ${v<25?"low":v<50?"mid":""}">${n}${n==="Health"&&run.ill>0?" · ill":""}${n==="Health"&&run.inj&&Object.keys(run.inj).length?" · hurt":""}<div class="nb"><i style="width:${clamp(v,0,100)}%"></i></div></div>`).join("");
  if(["ready","waiting"].includes(G.state)&&G.t-warnT>20){
    const w=N.health<30?"You're in a bad way. Head back to the tavern.":N.warm<25?"You're shivering. Light a fire at camp.":N.food<20?"You're starving. Eat something.":run.water<=0&&N.thirst<40?"You need water.":N.stam<20?"You're exhausted. Rest at camp.":"";
    if(w){toast(w,true,2600);warnT=G.t;}}
}

/* ---------- Camp ---------- */
function fishAge(k){return (absMin()-k.caught)/1440;}
function travelTo(dest){
  const from=run.loc,mins=travelMins(from,dest),m0=absMin();
  if(netUsed()>netCap()){toast("Your stuff won't all fit in the vehicle. Make some room first.",true,2400);return netManage(G.state==="tavern"?tavernMenu:campMenu);}
  advance(mins);run.fire=0;renderHud();if(checkDeath())return;
  const arrive=()=>{if(isTown(dest)){goTavern(dest);return;}
    run.loc=dest;run.lastSpot=dest;hideOverlay();toReady(`${SPOTS[dest].name}. Tight lines.`);};
  const go=()=>{if(!maybeEvent("road",0.25,arrive))arrive();};
  if(save.settings.travelAnim===false)return go();
  travelScene(from,dest,m0,mins,go);
}

/* ---------- Skills: hunting, foraging, cooking (fishing uses run.xp) ---------- */
// Each skill levels 1-50 on the same curve as fishing. live:false = shown as "coming soon".
const SKILLS={
  fish:{n:"Fishing",unl:[[1,"Float fishing",1],[5,"Ledgering",1],[10,"Spinning",1],[15,"Fly fishing",1],[20,"Traps and pots (crayfish, crab, lobster)",1],[25,"Boat hire"],[30,"Wreck and reef fishing"],[35,"Boat ownership"],[40,"Deep-sea fishing"],[45,"Big game (halibut, tuna, sharks)"],[50,"Master Angler title"]]},
  hunt:{n:"Hunting",unl:[[1,"Simple snares (rabbits)",1],[5,"Tracking (rabbits)",1],[10,"Bow use: +5 when tracking",1],[15,"Game birds (pheasant, pigeon)",1],[20,"Deer tracking",1],[25,"Hides and furs"],[30,"Wild boar",1],[35,"Bow add-ons"],[40,"Predator awareness: +3 in animal encounters",1],[45,"Red stag (trophy hunt)",1],[50,"Master Hunter title"]]},
  forage:{n:"Foraging",unl:[[1,"Common herbs and berries",1],[5,"Bait digging",1],[10,"Wild veg (wild garlic, sorrel, nettles)",1],[15,"Common mushrooms",1],[20,"Coastal finds (seaweed, samphire)",1],[25,"Prized mushrooms (ceps, chanterelles)",1],[30,"Clean springs: drinking straight is almost always safe",1],[35,"Wild spices (juniper, fennel seed)",1],[40,"Rare herbs for teas that boost needs",1],[45,"Truffles",1],[50,"Master Forager title"]]},
  cook:{n:"Cooking",unl:[[1,"Campfire cooking",1],[5,"Better gutting and filleting (+2)",1],[10,"Pan and pot dishes",1],[15,"Salting",1],[20,"Dutch oven dishes (stews, chowders)",1],[25,"Smoking",1],[30,"BBQ and grill specialties",1],[35,"Regional recipes from the tavern cook",1],[40,"Feasts",1],[45,"Master preserving: lasts twice as long",1],[50,"Head Chef title"]]}
};
function skXp(k){return k==="fish"?(run?run.xp:0):(run&&run.sk?run.sk[k]||0:0);}
function skLv(k){return levelInfo(skXp(k)).L;}
function gainSk(k,xp){if(!run||xp<=0)return 0;xp=Math.max(1,Math.round(xp*diff().xp));
  const before=skLv(k);if(k==="fish")run.xp+=xp;else run.sk[k]=(run.sk[k]||0)+xp;const after=skLv(k);
  if(k==="fish")renderLevel();
  if(after>before)setTimeout(()=>toast(`${SKILLS[k].n} level ${after}!`,false,2200),300);
  return xp;}
function skillsScreen(onBack){
  const card=k=>{const S=SKILLS[k],i=levelInfo(skXp(k));
    const rows=S.unl.map(([L,t,live])=>{const got=i.L>=L;
      return `<div class="skrow ${got&&live?"got":""}"><b>${L}</b><span>${t}</span><em>${live?(got?"✓":""):"Coming soon"}</em></div>`;}).join("");
    return `<h3>${S.n} · Lv ${i.L}</h3><div class="skbar"><i style="width:${i.need?i.into/i.need*100:100}%"></i></div>
      <p class="note">${i.need?`${i.into} / ${i.need} XP to level ${i.L+1}`:"Max level"}</p><div class="sktable">${rows}</div>`;};
  showOverlay(`<h2>Skills</h2><p class="note">Every skill levels from 1 to 50. Higher levels add to your dice rolls in events (+1 for every 10 levels in the skill being tested).</p>
    ${["fish","hunt","forage","cook"].map(card).join("")}
    <div class="controls"><button class="big ghost" id="skBack" type="button" style="flex:1">Back</button></div>`);
  $("#skBack").onclick=onBack;
}

/* ---------- Text events: a short scene, a few choices, a d20 roll ---------- */
// Roll d20 + bonuses; meet or beat the target to succeed. A natural 20 always works, a natural 1 always fails.
// Bonuses: the tested skill's level, a campfire against animals, a lantern in the dark, being rested, hurt or exhausted, kit.
const d20=()=>1+Math.floor(Math.random()*20);
function freshFish(){return run.keep.map((k,i)=>({k,i})).filter(o=>!isSpoiled(o.k));}
function takeFish(which){const f=freshFish();if(!f.length)return null;
  f.sort((a,b)=>a.k.w-b.k.w);const o=which==="big"?f[f.length-1]:which==="small"?f[0]:f[Math.floor(Math.random()*f.length)];
  run.keep.splice(o.i,1);return o.k;}
function evCtx(where){const c=conds();return {where,time:c.time,season:c.season,weather:c.weather,loc:run.loc,
  fire:run.fire>0&&where!=="road",dark:c.time==="Night"||where==="night",fish:freshFish().length,salt:!!(SPOTS[run.loc]&&SPOTS[run.loc].salt)};}
// small helpers that change the run and describe what happened
function fx(list){const out=[];const N=run.needs;
  for(const [k,v] of list){if(v===0)continue;
    if(k==="health"){N.health=clamp(N.health+v,diff().needs===0?1:0,100);out.push(`${v>0?"+":""}${v} health`);}
    else if(k==="warm"){N.warm=clamp(N.warm+v,0,100);out.push(`${v>0?"+":""}${v} warmth`);}
    else if(k==="stam"){N.stam=clamp(N.stam+v,0,100);out.push(`${v>0?"+":""}${v} energy`);}
    else if(k==="food"){N.food=clamp(N.food+v,0,100);out.push(`${v>0?"+":""}${v} food`);}
    else if(k==="bucks"){run.bucks+=v;out.push(`+${v} Fish Bucks`);}
    else if(k==="mins"){advance(v);out.push(`${v>=60?(v/60)+" h":v+" min"} lost`);}
    else if(k==="ill"){run.ill=Math.max(run.ill,v);out.push("you feel ill");}
    else if(k==="bait"){const [b,n]=v;run.inv.bait[b]=(run.inv.bait[b]||0)+n;out.push(`+${n} ${b.toLowerCase()}`);}
    else if(k==="lure"){run.inv.lures[v]=(run.inv.lures[v]||0)+1;out.push(`+1 ${v.toLowerCase()}`);}
    else if(k==="kit"){run.inv.gear[v]=1;out.push(`found: ${GEAR[v].name}`);if(v==="waterskin")run.water=Math.min(maxWater(),run.water+1.5);}
    else if(k==="fish"){const f=takeFish(v);if(f)out.push(`lost your ${prodName(f).toLowerCase()} (${lbOz(f.w)})`);}
    else if(k==="injure"){const had=!!run.inj[v];addInjury(v);out.push(had?`your ${INJ[v].n.toLowerCase()} is worse`:INJ[v].n.toLowerCase());}
    else if(k==="recipe"){const r=learnRecipe();if(r)out.push(`learned a recipe: ${recipeTitle(r)}`);else{run.bucks+=15;out.push("+15 Fish Bucks");}}
    else if(k==="allfish"){const n=freshFish().length;run.keep=run.keep.filter(x=>isSpoiled(x));if(n)out.push(`lost ${n} fish from the keep net`);}
    else if(k==="meat"){const [id,n]=v;larderAdd(id,n);out.push(`+${n>1?n+" ":""}${FOODS[id].n.toLowerCase()}${n>1?" portions":""}`);}
    else if(k==="arrow"){if(run.inv.arrows>0){run.inv.arrows--;out.push("lost an arrow");}}
    else if(k==="xp"){const [s,n]=v;const g=gainSk(s,n);if(g)out.push(`+${g} ${SKILLS[s].n.toLowerCase()} XP`);}
  }
  return out;}

function evOn(){return save.settings.events!==false;}
// where: "road" (travelling), "camp" (resting), "night" (sleeping out). Returns true if an event started.
function maybeEvent(where,chance,then){
  if(!run||!evOn()||Math.random()>chance)return false;
  const c=evCtx(where);const pool=EVENTS.map(e=>({e,w:e.w(c)})).filter(o=>o.w>0);if(!pool.length)return false;
  let r=Math.random()*pool.reduce((a,o)=>a+o.w,0);let ev=pool[0].e;for(const o of pool){r-=o.w;if(r<=0){ev=o.e;break;}}
  runEvent(ev,c,then);return true;}
function rollBonuses(ev,ch,c){const b=[],N=run.needs;
  if(ch.skill){const L=skLv(ch.skill),s=Math.floor(L/10);if(s)b.push([`${SKILLS[ch.skill].n} Lv ${L}`,s]);}
  if(ch.fireB&&c.fire)b.push(["Campfire",ch.fireB]);
  if(ch.bon)b.push(...ch.bon);
  if(ev.animal&&skLv("hunt")>=40)b.push(["Predator awareness",3]);
  if(ev.animal&&c.where==="road"&&run.inv.gear.bell)b.push(["Bear bell",1]);
  if(c.dark&&run.inv.gear.lantern)b.push(["Lantern",2]);
  if(ch.fit&&N.stam>60)b.push(["Rested",1]);
  if(ch.fit&&run.inj&&run.inj.sprain)b.push(["Sprained ankle",-2]);
  if(run.inj&&run.inj.ribs)b.push(["Cracked ribs",-1]);
  if(N.stam<25)b.push(["Exhausted",-2]);
  if(N.health<40)b.push(["Hurt",-2]);
  return b;}
const sgn=n=>(n>=0?"+":"−")+Math.abs(n);
function runEvent(ev,c,then){
  const chs=ev.ch(c).filter(Boolean);
  showOverlay(`<span class="tag">Event</span><h2>${ev.title}</h2><p>${ev.text(c)}</p><div class="acts">${chs.map((ch,i)=>{
    if(ch.auto)return `<button class="act" data-ev="${i}" type="button"><span>${ch.t}<small>${ch.sub}</small></span></button>`;
    const tot=rollBonuses(ev,ch,c).reduce((a,[,n])=>a+n,0);
    return `<button class="act" data-ev="${i}" type="button"><span>${ch.t}<small>${ch.sub}</small></span><em>🎲 ${ch.dc}+${tot?" · "+sgn(tot):""}</em></button>`;}).join("")}</div>
    <p class="note">Roll a d20 and add your bonuses. Meet the number to succeed.</p>`,"event");
  document.querySelectorAll("[data-ev]").forEach(b=>b.onclick=()=>{
    const ch=chs[+b.dataset.ev];let html="",res;
    if(ch.auto){res=ch.auto();html=`<p>${res[0]}</p>`;}
    else{const bon=rollBonuses(ev,ch,c),die=d20(),tot=die+bon.reduce((a,[,n])=>a+n,0);
      const win=die===20||(die!==1&&tot>=ch.dc);res=win?ch.ok():ch.bad();
      html=`<div class="dice ${win?"win":"lose"}"><div class="die">${die}</div><div><b>${win?(die===20?"Natural 20!":"Success"):(die===1?"Natural 1":"Failed")}</b>
        <small>${die}${bon.map(([l,n])=>` ${sgn(n)} ${l}`).join("")} = <b>${tot}</b> · needed ${ch.dc}</small></div></div><p>${res[0]}</p>`;}
    const out=fx(res[1]);renderHud();
    showOverlay(`<span class="tag">Event</span><h2>${ev.title}</h2><p class="note"><b>${ch.t}</b></p>${html}
      ${out.length?`<p class="note">${out.join(" · ")}</p>`:""}
      <div class="controls"><button class="big" id="evOk" type="button" style="flex:1">Carry on</button></div>`,"event");
    $("#evOk").onclick=()=>{if(checkDeath())return;then();};});
}

    return `<div class="act" style="cursor:default"><span>${F.n}${idx.length>1?" ×"+idx.length:""}<small>${F.kind} · ${sp?"Spoiled.":`Good for ${Math.max(0,left).toFixed(1)} more days`}${!F.eat&&!F.cook&&!F.tea&&!sp?" · For recipes (coming soon)":""}</small></span><span style="display:flex;gap:6px">${btns}</span></div>`;}).join("");

const COOK_PRICE={buy:20,region:60,feast:80};
function keepDays(k){const f=k.form||"raw";let d=FORMS[f].keep;if(f==="raw"&&cooled())d*=1.5;if((f==="salted"||f==="smoked")&&skLv("cook")>=45)d*=2;return d;}
function itemAge(k){return (absMin()-(k.made||k.caught))/1440;}
function isSpoiled(k){return itemAge(k)>keepDays(k);}
const capF=t=>t.charAt(0).toUpperCase()+t.slice(1);
function prodName(k){const f=k.form||"raw";if(f==="dish"){const R=RECIPES[k.dish];return R.n.replace("{F}",capF(k.name.toLowerCase())).replace("{f}",k.name.toLowerCase());}
  return f==="raw"?k.name:`${FORMS[f].pre} ${k.name.toLowerCase()}`;}
function qTag(k){return k.q===1?"well prepped":k.q===-1?"botched prep":"";}
// Gutting and filleting: d20 + 1 per 10 cooking levels (+2 from level 5) vs 8. 16+ is a good job.
function prepRoll(k){if(k.q!==undefined)return "";const L=skLv("cook"),die=d20(),tot=die+Math.floor(L/10)+(L>=5?2:0);
  k.q=die===20||(die!==1&&tot>=16)?1:die!==1&&tot>=8?0:-1;gainSk("cook",4);
  return k.q===1?"Clean, neat fillets. ":k.q===-1?"You make a hash of the filleting and lose some of it. ":"";}
function qMul(k){return k.q===1?1.15:k.q===-1?0.7:1;}
function eatFx(k){const f=k.form||"raw",m=qMul(k),base=12+k.w*8;
  if(f==="dish"){const R=RECIPES[k.dish];const o={food:Math.round(base*(R.fm||1.4)*m)};for(const [a,v] of Object.entries(R.eat))o[a]=Math.round(v*m);return o;}
  if(f==="salted")return {food:Math.round((10+k.w*5)*m),stam:4};
  if(f==="smoked")return {food:Math.round((12+k.w*6)*m),stam:6,warm:5};
  return {food:Math.round(base*m),stam:Math.round(8*m)};}
function freshLarder(id){return run.larder.findIndex(it=>it.id===id&&larderAge(it)<=FOODS[it.id].keep);}
function findIng(tag){for(const id of (ING[tag]||[tag])){const i=freshLarder(id);if(i>=0)return i;}return -1;}
function ingName(tag){return ING_N[tag]||FOODS[tag].n.toLowerCase();}
// Can this recipe be cooked with fish k right now? Returns "" if yes, or the reason.
function canCook(R,k,i){const L=skLv("cook");
  if(L<R.lv)return `Needs cooking level ${R.lv}`;
  if(run.fire<=0)return "Needs a fire";
  if(R.bbq&&!run.inv.gear.bbq)return "Needs a camp BBQ";
  if(R.form&&(k.form||"raw")!==R.form)return `Needs ${R.form} fish`;
  if(!R.form&&(k.form||"raw")!=="raw")return "Needs fresh, raw fish";
  if(R.fishId&&k.id!==R.fishId)return `Needs ${FISH.find(x=>x.id===R.fishId).name.toLowerCase()}`;
  if(R.water){const f=FISH.find(x=>x.id===k.id);if(f.water!==R.water)return `Needs a ${R.water.toLowerCase()} fish`;}
  if((R.fish||1)>1&&!run.keep.some((o,j)=>j!==i&&(o.form||"raw")==="raw"&&!isSpoiled(o)))return `Needs ${R.fish} fresh fish`;
  const miss=R.need.filter(t=>findIng(t)<0);if(miss.length)return "Needs "+miss.map(ingName).join(" and ");
  return "";}
function cookRecipe(id,i){const R=RECIPES[id];let k=run.keep[i];let note=prepRoll(k);
  const used=R.need.map(t=>{const j=findIng(t);const it=run.larder.splice(j,1)[0];return FOODS[it.id].n.toLowerCase();});
  if((R.fish||1)>1){const j=run.keep.findIndex((o,jj)=>jj!==i&&(o.form||"raw")==="raw"&&!isSpoiled(o));const o=run.keep[j];k.w=+(k.w+o.w).toFixed(3);k.stars=Math.max(k.stars||3,o.stars||3);run.keep.splice(j,1);}
  k.form="dish";k.dish=id;k.made=absMin();
  advance(R.feast?90:R.how?60:30);
  const g=gainSk("cook",R.feast?60:15+R.lv);
  return `${note}${prodName(k)}, made with ${used.join(" and ")}. +${g} cooking XP`;}
function kitchen(i,back){

  const recs=known.map(r=>{const R=RECIPES[r],why=canCook(R,k,i);const nm=R.n.replace("{F}",capF(k.name.toLowerCase())).replace("{f}",k.name.toLowerCase());

  showOverlay(`<span class="tag">Kitchen</span><h2>${prodName(k)}</h2><p class="note">${lbOz(k.w)} · ${isSpoiled(k)?"spoiled":`good for ${Math.max(0,keepDays(k)-itemAge(k)).toFixed(1)} more days`}${qTag(k)?" · "+qTag(k):""}. Cooking Lv ${L}. ${fire?"The fire's going.":"No fire."}</p>
    ${raw?`<p class="note">Anything you cook starts with gutting and filleting: a d20 roll, better with cooking level. A good job is worth more and feeds you more; a botched one less.</p>`:""}
    <div class="acts">
    ${raw?opt("eatcook","Cook and eat it now",fire?"Proper food, straight off the fire.":"Needs a fire.","30 min",fire):opt("eat","Eat it",(()=>{const e=eatFx(k);return Object.entries(e).map(([a,v])=>`+${v} ${({food:"food",stam:"energy",warm:"warmth",health:"health"})[a]}`).join(", ");})(),"10 min",true)}
    ${raw?opt("cook","Cook it to keep or sell",fire?"Sells for a little more than raw. Keeps about a day and a half.":"Needs a fire.","30 min",fire):""}
    ${raw?opt("salt","Salt it",L<15?"Needs cooking level 15.":run.inv.salt>0?`Keeps ${keepDays({form:"salted"})} days, sells for 1.5× raw. ${run.inv.salt} salt left.`:"No salt. Buy it at the tackle shop.","20 min",L>=15&&run.inv.salt>0):""}
    ${raw?opt("smoke","Smoke it",L<25?"Needs cooking level 25.":!run.inv.gear.smoker?"Needs a portable smoker.":!fire?"Needs a fire.":`Keeps ${keepDays({form:"smoked"})} days, sells for 1.8× raw.`,"2 hours",L>=25&&run.inv.gear.smoker&&fire):""}
    </div>

    <p class="note">You know ${known.length} of ${Object.keys(RECIPES).length} recipes. Learn more from the cooks at every inn, strangers at your fire and abandoned camps.${L<10?" Pan and pot dishes start at cooking level 10.":""}</p>
    <div class="controls"><button class="big ghost" id="kcBack" type="button" style="flex:1">Back</button></div>`,"event");
  const done=msg=>{renderHud();if(checkDeath())return;if(msg)toast(msg,false,2600);back();};
  document.querySelectorAll("[data-kc]").forEach(b=>b.onclick=()=>{const a=b.dataset.kc;
    if(a==="eat"){run.keep.splice(i,1);advance(10);fxObj(eatFx(k));return done(`You eat the ${prodName(k).toLowerCase()}.`);}
    if(a==="eatcook"){run.keep.splice(i,1);const n=prepRoll(k);k.form="cooked";advance(30);fxObj(eatFx(k));const g=gainSk("cook",8+Math.round(k.w*4));return done(`${n}Campfire ${k.name.toLowerCase()}. Proper food. +${g} cooking XP`);}
    if(a==="cook"){const n=prepRoll(k);k.form="cooked";k.made=absMin();advance(30);const g=gainSk("cook",8+Math.round(k.w*4));return done(`${n}${prodName(k)}, wrapped and in the net. +${g} cooking XP`);}
    if(a==="salt"){const n=prepRoll(k);run.inv.salt--;k.form="salted";k.made=absMin();advance(20);const g=gainSk("cook",10+Math.round(k.w*2));return done(`${n}Packed in salt. It'll keep for weeks. +${g} cooking XP`);}
    if(a==="smoke"){const n=prepRoll(k);k.form="smoked";k.made=absMin();advance(120);const g=gainSk("cook",20+Math.round(k.w*3));return done(`${n}Two hours over oak smoke. Golden and fragrant. +${g} cooking XP`);}
    if(a.startsWith("r:"))return done(cookRecipe(a.slice(2),i));});
  $("#kcBack").onclick=back;
}
function learnRecipe(pool){const opts=(pool||Object.keys(RECIPES).filter(r=>!RECIPES[r].region&&!RECIPES[r].feast)).filter(r=>!run.recipes.includes(r));
  if(!opts.length)return null;const r=pick(opts);run.recipes.push(r);return r;}

/* ---------- Fish journal: a page per species, built from your own catches ---------- */
function journalScreen(onBack){
  const L0=run?run.log:[];
  const tiles=FISH.map(f=>{const c=L0.filter(e=>e.id===f.id);
    return `<button class="jtile ${c.length?"":"unk"}" data-sp="${f.id}" type="button"><b>${c.length?f.name:"???"}</b><small>${f.water}${f.methods.includes("Pot")?" · pots":""} · ${c.length?c.length+" caught":f.rarity}</small></button>`;}).join("");
  const n=new Set(L0.map(e=>e.id)).size;
  showOverlay(`<h2>Fish journal</h2><p class="note">${n} of ${FISH.length} species. Each page fills in as you catch them: when, where, in what weather and on what.</p>
    <div class="jgrid">${tiles}</div><div class="controls"><button class="big ghost" id="jBack" type="button" style="flex:1">Back</button></div>`);
  document.querySelectorAll("[data-sp]").forEach(b=>b.onclick=()=>speciesPage(b.dataset.sp,()=>journalScreen(onBack)));
  $("#jBack").onclick=onBack;
}
function speciesPage(id,onBack){
  const f=FISH.find(x=>x.id===id),c=(run?run.log:[]).filter(e=>e.id===id);
  if(!c.length){showOverlay(`<h2>???</h2><p class="note">${f.rarity} · ${f.water.toLowerCase()} fish${f.methods.includes("Pot")?", caught in pots and traps":""}. You haven't caught one yet, so this page is blank.</p>
    <div class="controls"><button class="big ghost" id="spBack" type="button" style="flex:1">Back</button></div>`);$("#spBack").onclick=onBack;return;}
  const best=c.reduce((m,e)=>e.w>m.w?e:m,c[0]),first=c[c.length-1];
  const seen=key=>[...new Set(c.map(e=>e[key]).filter(Boolean))];
  const row=(label,key,all)=>{const got=seen(key);return `<div class="jrow"><span>${label}</span><b>${all?all.map(v=>got.includes(v)?v:`<i>${v}</i>`).join(" · "):got.join(" · ")||"—"}</b></div>`;};
  showOverlay(`<span class="tag">${f.rarity}</span><h2>${f.name}</h2>
    <div class="stats"><div><small>Caught</small><b>${c.length}</b></div><div><small>Best</small><b>${lbOz(best.w)}</b></div><div><small>Longest</small><b>${Math.max(...c.map(e=>e.len||0))} cm</b></div></div>
    <p class="note">${f.fights?`<b>How it fights:</b> ${f.fights}. `:""}First caught on day ${first.day||"?"}${first.spot?` at ${first.spot}`:""}. Usual size ${lbOz(f.min)} to ${lbOz(f.max)}.</p>
    <h3>What you've learned</h3><p class="note">Faded entries are ones you haven't caught it in yet. That doesn't mean it won't bite then.</p>
    <div class="jrows">${row("Seasons","season",ALL)}${row("Time of day","time",["Dawn","Day","Dusk","Night"])}${row("Weather","weather",["Clear","Overcast","Rain","Windy","Fog"])}${row("Method","method")}${row("Bait or lure","bait")}${row("Spot","spot")}</div>
    <div class="controls"><button class="big ghost" id="spBack" type="button" style="flex:1">Back</button></div>`);
  $("#spBack").onclick=onBack;
}

/* ---------- Pots and traps (fishing level 20): set like snares, catches go in the keep net ---------- */
const POT_WAIT=360,POT_MAX=2;
function potsHere(){return run.pots.filter(p=>p.loc===run.loc);}
function checkPots(done){const ready=potsHere().filter(p=>absMin()-p.at>=POT_WAIT);advance(20);
  if(!ready.length){toast("Nothing yet. Pots need about six hours.",false,2000);return done();}
  const got=[];const coast=!!spot().salt;
  for(const p of ready){p.at=absMin();if(Math.random()<0.25)continue;
    const id=coast?(Math.random()<0.12?"lobster":"crab"):"crayfish",f=FISH.find(x=>x.id===id);
    const n=id==="crayfish"?1+Math.floor(Math.random()*4):1;
    for(let i=0;i<n;i++){const r=Math.random(),w=+(f.min+(f.max-f.min)*Math.pow(r,2)).toFixed(3),st=r<0.3?2:r<0.6?3:r<0.85?4:5,len=Math.round(f.lenK*Math.pow(w,1/3));
      const it={id,name:f.name,w,stars:st,caught:absMin()};if(netFits(it))run.keep.push(it);else{got.full=(got.full||0)+1;}
      run.log.unshift({id,name:f.name,w,len,stars:st,season:conds().season,time:conds().time,weather:conds().weather,bait:"Pot",method:"Pot",spot:spot().name,day:run.day});got.push(f.name);}}
  run.log=run.log.slice(0,300);
  const xp=gainSk("fish",got.reduce((a,nm)=>a+(nm==="European lobster"?60:8),0)||3);
  const tally=Object.entries(got.reduce((m,n)=>(m[n]=(m[n]||0)+1,m),{})).map(([n,c])=>c>1?`${c} ${n.toLowerCase()}`:`a ${n.toLowerCase()}`).join(" and ");
  showOverlay(`<span class="tag">Pots</span><h2>Hauling your ${coast?"pots":"traps"}</h2><p>${got.length?`You've got ${tally}. ${got.full?`Your keep net is full, so you let ${got.full===got.length?"them":got.full+" of them"} go.`:"In the keep net."}`:"Empty this time. Re-baited and dropped back in."}</p>
    <p class="note">+${xp} fishing XP</p><div class="controls"><button class="big" id="ptOk" type="button" style="flex:1">Back to camp</button></div>`);
  $("#ptOk").onclick=done;}

/* ---------- Injuries: they last until they heal or you treat them ---------- */
// heal: in-game minutes. Wounds only heal once cleaned and dressed; left untreated for 12 hours they may get infected.
const INJ={
  wound:{n:"Open wound",heal:24*60,desc:"Stops your health coming back. Clean and dress it, or it may get infected."},
  sprain:{n:"Sprained ankle",heal:36*60,desc:"Travel takes half as long again, you tire faster, and it counts against you when you need to move quickly. Resting heals it faster."},
  ribs:{n:"Cracked ribs",heal:60*60,desc:"Reeling is slower and health comes back at half speed."},
  chill:{n:"Chilled to the bone",heal:12*60,desc:"You lose warmth 30% faster. It only eases while you're warm."}
};
function hurtBy(k){return !!(run&&run.inj&&run.inj[k]);}
function addInjury(k){const cur=run.inj[k];
  if(cur){cur.left=Math.min(INJ[k].heal*1.5,cur.left+INJ[k].heal*0.5);if(k==="wound")cur.treated=false;}
  else run.inj[k]={left:INJ[k].heal,treated:k!=="wound",open:0};}
// called from advance() every tick of m minutes
function tickInjuries(m,opt){const I=run.inj,N=run.needs;
  if(N.warm<=0){run.coldMin=(run.coldMin||0)+m;if(run.coldMin>=90&&!I.chill){addInjury("chill");toast("You're chilled to the bone.",true,2200);}}else run.coldMin=0;
  for(const k of Object.keys(I)){const o=I[k];let r=m;
    if(k==="wound"){if(!o.treated){o.open+=m;r=0;if(o.open>=12*60&&!o.rolled){o.rolled=1;if(Math.random()<0.4){run.ill=Math.max(run.ill,24*60);toast("Your wound has got infected. You feel ill.",true,2600);}}}else if(o.band)r*=1.6;}
    if(k==="sprain")r*=(opt.sleep||opt.rest?2:1)*(o.band?1.3:1);
    if(k==="ribs"&&opt.sleep)r*=1.5;
    if(k==="chill"&&N.warm<60)r=0;
    o.left-=r;if(o.left<=0){delete I[k];toast(`Your ${INJ[k].n.toLowerCase()} has healed.`,false,2200);}}
}
function injuryRows(){const I=run.inj,fire=run.fire>0,B=run.inv.bandages||0;
  return Object.keys(I).map(k=>{const o=I[k],h=Math.ceil(o.left/60);
    const btn=k==="wound"&&!o.treated?`<button class="iconbtn" data-treat="wound" type="button" ${fire||B?"":"disabled"}>${B?"Dress it (bandage)":"Clean it (fire)"}</button>`:
      k==="sprain"&&!o.band?`<button class="iconbtn" data-treat="sprain" type="button" ${B?"":"disabled"}>Strap it</button>`:"";
    return `<div class="act" style="cursor:default"><span>${INJ[k].n}<small>${INJ[k].desc} ${k==="wound"&&!o.treated?(o.open>=12*60?"Untreated for too long.":`Untreated for ${Math.floor(o.open/60)} h.`):`About ${h} h to heal${k==="chill"?" once you're warm":""}.`}</small></span>${btn}</div>`;}).join("");
}

/* ---------- Towns and the region map ---------- */
// The trade triangle: each town pays more for one kind of fish and less for its own.

const TOWNS={
